title: "작은 일에도 정직하게"

subtitle: "하나님 앞에서 숨기지 않는 마음"

date: "2026-11-22"

calling: "주일 아침, 우리의 마음을 하나님 앞에 정직하게 내려놓으며 예배를 시작합니다."

verse1_title: "레위기 5:5"

verse1: "이 중 하나에 허물이 있을 때에는 아무 일에 잘못하였다고 자복하고"

verse2_title: "레위기 5:6"

verse2: "그 잘못으로 말미암아 여호와께 속죄제를 드리되 그의 잘못을 위하여 양 떼 중 암컷 어린 양이나 염소를 끌어다가 속죄제물로 삼을 것이요 제사장은 그의 잘못을 위하여 속죄할지니라"

reflection: "레위기 5장에는 죄를 깨달았을 때 자복하고 하나님께 나아가는 모습이 나옵니다. 때로는 큰 잘못보다 사소한 말이나 행동을 대수롭지 않게 여기며 지나칠 때가 있습니다. 하지만 하나님 앞에서는 작은 잘못도 정직하게 인정하는 것이 중요합니다. 주일을 맞아 우리의 마음을 돌아봅니다. 다른 사람에게 보이기 위한 모습보다 하나님 앞에서 솔직한 모습으로 서고, 잘못을 깨달았을 때 겸손히 인정하며 다시 걸어가는 삶을 살고 싶습니다."

questions:
  - "우리는 사소한 잘못이라 생각하며 그냥 넘어가는 일이 있지는 않을까요?"
  - "하나님과 사람 앞에서 조금 더 정직해지기 위해 오늘 무엇을 돌아보면 좋을까요?"

prayer: "하나님 아버지, 주일에 주님 앞에 나아갈 수 있게 해주셔서 감사합니다. 우리의 잘못을 감추거나 합리화하지 않고 정직하게 인정할 수 있도록 도와주세요. 말씀을 듣고 예배드리는 가운데 우리의 마음이 주님께 향하게 하시고, 한 주를 살아갈 힘과 지혜를 주세요. 감자도 주님의 돌보심 가운데 잘 자라게 하시고, 남은 임신 기간 동안 아내와 감자를 지켜주세요. 저희 부부가 감자를 기다리는 마음으로 서로 사랑하고 배려하며 살아가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 22일 주일 가정예배"
