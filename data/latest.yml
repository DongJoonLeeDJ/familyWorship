title: "감사를 기억하는 믿음"
subtitle: "하나님께서 지금까지 인도하신 은혜를 기억할 때 내일도 맡길 수 있습니다."
date: "2026-07-14"

calling: |
  은혜의 하나님,
  오늘도 우리 가정을 예배의 자리로 불러 주셔서 감사합니다.
  분주한 하루 속에서도 하나님께서 행하신 일을 기억하게 하시고,
  감사가 믿음이 되는 시간을 허락하여 주옵소서.
  예수님의 이름으로 기도합니다. 아멘.

verse1_title: "시편 103:2-5"
verse1: |
  내 영혼아 여호와를 송축하며
  그의 모든 은택을 잊지 말지어다.
  그가 네 모든 죄악을 사하시며
  네 모든 병을 고치시며
  네 생명을 파멸에서 속량하시고
  인자와 긍휼로 관을 씌우시며
  좋은 것으로 네 소원을 만족하게 하사
  네 청춘을 독수리 같이 새롭게 하시는도다.

verse2_title: "사무엘상 7:12"
verse2: |
  사무엘이 돌을 취하여
  미스바와 센 사이에 세워 이르되
  "여호와께서 여기까지 우리를 도우셨다."
  하고 그 이름을 에벤에셀이라 하니라.

reflection: |
  하나님께서는 왜 우리에게 "잊지 말라"고 자주 말씀하실까요?

  혹시 하나님께서 행하신 일보다
  아직 이루어지지 않은 일을 더 오래 붙잡는 것이
  우리의 자연스러운 모습이기 때문은 아닐까요?

  사무엘은 큰 승리를 경험한 뒤
  에벤에셀이라는 돌을 세웠습니다.
  그 돌은 미래를 보장하는 부적이 아니라,
  하나님께서 "여기까지" 도우셨다는 기억이었습니다.

  우리도 우리만의 에벤에셀을 하나씩 세워 가고 있는 것 같습니다.

  시험관 시술을 시작했던 날,
  착상을 확인했던 날,
  아기집을 보았던 날,
  출혈로 마음 졸였지만 하나님께서 지켜 주셨던 날,
  심장박동을 들었던 날,
  IVF 병원을 졸업했던 날,
  그리고 얼마 전 임신 12주를 맞이한 날까지.

  또 하나의 감사가 더해졌습니다.

  1차 기형아 검사에서
  투명대가 정상이라는 이야기를 들었습니다.
  감자는 건강하게 잘 자라고 있었고,
  첫 번째 초음파에서는 꼼지락거리다가
  두 번째 초음파에서는 가만히 잠든 모습이었다고 했습니다.

  아직 모든 검사가 끝난 것은 아닙니다.
  4주 뒤 2차 기형아 검사까지 마쳐야
  최종 결과를 확인하게 됩니다.

  그런데 하나님은 우리에게
  모든 결과가 나온 뒤에야 감사하라고 말씀하지 않으십니다.

  오늘까지 베풀어 주신 은혜를 기억하며
  오늘 감사하는 사람이 되라고 초대하십니다.

  복음도 그렇습니다.

  우리는 미래를 다 알지 못하지만,
  하나님께서는 이미 예수 그리스도를 통해
  우리를 향한 사랑을 확증해 주셨습니다.
  그 사랑은 앞으로의 시간을 맡길 수 있는 가장 든든한 근거가 됩니다.

  오늘 우리 가정도
  아직 남아 있는 검사보다
  여기까지 인도하신 하나님을 먼저 기억했으면 좋겠습니다.

  에벤에셀의 하나님께서
  앞으로의 걸음도 신실하게 함께하실 것을 믿습니다.

questions:
  - "우리 가정이 '여기까지 하나님께서 도우셨다'고 고백할 수 있는 순간은 무엇인가요?"
  - "감사보다 염려를 더 크게 바라보고 있는 일이 있다면 무엇인가요?"
  - "오늘 하나님께 감사하고 싶은 가장 작은 은혜는 무엇인가요?"

prayer: |
  사랑의 하나님,
  오늘까지 우리 가정을 신실하게 인도하여 주셔서 감사합니다.
  긴 기다림 끝에 감자를 선물로 주시고,
  지금까지 건강하게 자라게 하신 은혜를 찬양합니다.

  1차 기형아 검사 가운데
  투명대가 정상이라는 소식을 듣게 하시고,
  감자가 건강하게 자라고 있다는 이야기를 들을 수 있게 하셔서 감사합니다.
  남아 있는 검사들도 주님의 손에 맡겨 드립니다.
  결과를 미리 염려하기보다
  오늘까지 인도하신 하나님을 신뢰하게 하옵소서.

  사랑하는 아내를 날마다 붙들어 주시고,
  몸과 마음에 평안을 더하여 주옵소서.
  임신 기간 동안 필요한 건강과 회복을 허락하여 주시고,
  언제나 하나님의 위로를 경험하게 하옵소서.

  사랑하는 감자를 주님의 손으로 계속 지켜 주시고,
  건강하게 자라게 하시며,
  하나님 안에 깊이 뿌리내리는 믿음의 사람으로 세워 주옵소서.

  우리 부부도 매일의 예배를 통해
  하나님께서 여기까지 도우셨음을 기억하며,
  내일도 주님께 맡기는 가정이 되게 하옵소서.

  우리를 끝까지 사랑하시는
  예수 그리스도의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 14일 화요일 가정예배"
