title: "맡겨진 하루를 충성으로"
subtitle: "결과보다 오늘의 맡겨진 걸음을 성실히 걷기"
date: "2026-06-06"

calling: |
  우리를 구원하시고 오늘까지 인도하신 하나님께 감사드립니다.

  주님께서는 우리를 사랑받는 자녀로 부르셨을 뿐 아니라,
  맡겨진 삶을 살아가는 청지기로도 부르셨습니다.

  오늘도 하나님께서 맡기신 하루를
  감사함으로 살아가기를 소망하며 예배드립니다.

verse1_title: "고린도전서 4:1-2"
verse1: |
  사람이 마땅히 우리를 그리스도의 일꾼이요
  하나님의 비밀을 맡은 자로 여길지어다

  그리고 맡은 자들에게 구할 것은 충성이니라

verse2_title: "누가복음 16:10"
verse2: |
  지극히 작은 것에 충성된 자는
  큰 것에도 충성되고

reflection: |
  우리는 흔히 큰 결과를 기대하며 살아갑니다.

  IVF 과정을 지나오면서도
  다음 검사 결과는 어떨지,
  출혈은 언제 멈출지,
  피고임은 잘 흡수될지,
  앞으로는 어떤 일이 생길지 생각하게 됩니다.

  하지만 하나님께서는 종종
  결과보다 오늘의 충성을 먼저 바라보십니다.

  고린도전서에서 바울은
  하나님께서 맡기신 사람에게 요구되는 것은
  충성이라고 말합니다.

  충성은 거창한 일을 이루는 것이 아닙니다.

  오늘 해야 할 주사를 잘 맞고,
  몸을 돌보고,
  서로를 배려하고,
  기도하고,
  하나님께 감사하는 것입니다.

  지금 우리에게 맡겨진 일도 그렇습니다.

  감자를 건강하게 자라게 하시는 분은 하나님이십니다.
  우리는 생명을 직접 자라게 할 수 없습니다.

  하지만 하나님께서 맡기신 오늘의 역할은 있습니다.

  아내는 몸을 돌보며 하루를 보내고,
  남편은 사랑과 배려로 곁을 지키며,
  부부는 함께 하나님을 의지하는 것입니다.

  하나님께서는 미래의 모든 결과를
  오늘 우리 손에 맡기지 않으셨습니다.

  대신 오늘의 순종과 신뢰를 맡기셨습니다.

  그래서 우리는 결과를 붙들기보다
  오늘 맡겨진 하루를 성실하게 살아갈 수 있습니다.

  하나님께 충성하는 삶은
  우리를 억누르기 위한 짐이 아니라,
  하나님 안에서 평안을 누리도록 인도하는 길입니다.

questions:
  - "지금 내가 통제하려는 결과와 하나님께 맡겨야 할 결과는 무엇인가요?"
  - "오늘 하나님께서 우리 부부에게 맡기신 작은 충성은 무엇일까요?"
  - "최근 하나님께 감사할 수 있는 일 세 가지는 무엇인가요?"

prayer: |
  하나님 아버지,

  오늘도 우리를 지켜 주시고
  여기까지 인도하여 주셔서 감사합니다.

  우리를 주님의 자녀로 삼아 주시고,
  또한 맡겨진 삶을 살아가는 일꾼으로 불러 주심에 감사합니다.

  우리는 자주 미래의 결과를 걱정하며
  불안해질 때가 있습니다.

  그러나 하나님께서 맡기신 것은
  미래를 통제하는 능력이 아니라
  오늘의 충성과 신뢰임을 기억하게 하옵소서.

  감자를 계속 지켜 주시고
  건강하게 자라게 하여 주옵소서.

  아기집 주변의 피고임이 잘 흡수되게 하시고,
  출혈이 멈추게 하시며,
  아내의 몸과 마음에 평안을 허락하여 주옵소서.

  남편도 사랑과 믿음으로 아내를 잘 돕게 하시고,
  조급함보다 인내를,
  걱정보다 신뢰를 배우게 하옵소서.

  오늘 우리에게 맡겨진 일을 성실히 감당하며,
  결과는 하나님께 맡길 수 있는 믿음을 허락하여 주옵소서.

  하나님께서 오늘 우리 가정에
  평안과 감사와 충성의 마음을 허락해 주시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

