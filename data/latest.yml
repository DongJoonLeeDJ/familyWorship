
title: "보이지 않는 곳까지 정직하게"

subtitle: "하나님 앞에서의 신실함은 작은 일에도 드러납니다"

date: "2026-11-13"

calling: "우리의 일상과 마음을 살피시는 하나님 앞에 정직하고 신실한 마음으로 나아갑니다."

verse1_title: "성막을 만드는 데 사용된 재료"

verse1: "“성소의 세겔대로 금은 성소의 금 스물아홉 달란트와 칠백삼십 세겔이며” (출애굽기 38:24)"

verse2_title: "모든 것을 기록하고 살피다"

verse2: "출애굽기 38장에는 성막을 만드는 데 사용된 금과 은과 놋의 양이 구체적으로 기록되어 있습니다. 많은 사람의 예물이 모인 만큼, 그 재료가 어디에 얼마나 사용되었는지도 분명하게 정리했습니다. 하나님을 섬기는 일이라고 해서 과정이 흐릿해도 되는 것은 아니었습니다."

reflection: "우리는 때때로 좋은 목적을 위해 하는 일이라면 과정은 조금 소홀해도 괜찮다고 생각할 수 있습니다. 하지만 하나님께 드리는 일에는 목적뿐 아니라 과정의 정직함도 중요합니다. 누가 보지 않는 작은 일에서도 책임을 다하고, 맡겨진 것을 투명하게 사용하는 태도가 믿음의 일부일 것입니다. 우리 부부도 가정과 일상의 여러 책임을 감당할 때 서로에게 정직하고 신뢰할 수 있는 사람이 되기를 바랍니다."

questions:
  - "아무도 확인하지 않더라도 정직하게 지켜야 할 나의 책임은 무엇인가요?"
  - "서로에게 더 신뢰받는 사람이 되기 위해 우리가 실천할 수 있는 작은 태도는 무엇일까요?"

prayer: "하나님, 좋은 목적만 앞세우며 과정의 정직함을 놓치지 않게 해주세요. 다른 사람이 보지 않는 자리에서도 맡겨진 일을 성실히 감당하고, 물질과 시간과 약속을 바르게 사용하게 해주세요. 우리 부부가 서로에게 믿을 수 있는 사람이 되고, 감자에게도 정직하고 책임 있는 삶을 보여주는 부모가 되게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 13일 금요일 가정예배"
