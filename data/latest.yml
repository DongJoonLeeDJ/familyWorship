title: "쉬지 않으시는 하나님"
subtitle: "우리를 지키시는 분은 졸지도 주무시지도 않으십니다"
date: "2026-08-01"

calling: |
  사랑의 하나님,
  새로운 달의 첫날 저녁에도 우리를 예배의 자리로 불러 주셔서 감사합니다.
  분주했던 마음을 잠잠하게 하시고, 오늘도 우리와 함께하신 주님을 바라보게 하옵소서.

verse1_title: "시편 121:3-4"
verse1: |
  여호와께서 너를 실족하지 아니하게 하시며 너를 지키시는 이가 졸지 아니하시리로다.
  이스라엘을 지키시는 이는 졸지도 아니하시고 주무시지도 아니하시리로다.

verse2_title: "요한복음 10:27-28"
verse2: |
  내 양은 내 음성을 들으며 나는 그들을 알며 그들은 나를 따르느니라.
  내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요 또 그들을 내 손에서 빼앗을 자가 없느니라.

reflection: |
  사람은 잠을 자야 합니다. 아무리 책임감이 강한 사람도 하루 종일 깨어 있을 수는 없습니다. 부모도, 의사도, 친구도 모두 쉬어야 합니다. 하지만 성경은 하나님만은 다르다고 말씀합니다. 하나님은 졸지도 주무시지도 않으십니다.

  이 말은 하나님께서 단 한순간도 우리를 잊지 않으신다는 뜻입니다. 우리가 바쁘게 일하는 시간에도, 잠든 새벽에도, 마음이 평안한 날에도, 이유 없이 걱정이 밀려오는 순간에도 하나님의 시선은 우리를 향하고 있습니다.

  우리는 때때로 '내가 더 잘해야 하는데', '혹시 무슨 일이 생기면 어떡하지'라는 생각을 합니다. 그러나 믿음은 모든 가능성을 계산하는 데서 시작하지 않습니다. 우리를 붙드시는 분이 누구신지를 기억하는 데서 시작합니다.

  감자도 우리의 눈으로는 보이지 않는 순간이 훨씬 많습니다. 하지만 보이지 않는다고 해서 하나님께서 일하지 않으시는 것은 아닙니다. 하나님은 부모가 보지 못하는 시간에도 한 생명을 가장 아름다운 모습으로 빚어 가십니다. 그리고 그 과정을 지켜보는 부모의 마음에도 조금씩 신뢰를 심어 주십니다.

  새로운 달이 시작되었습니다. 앞으로 어떤 일정이 기다리고 있을지 모두 알 수는 없습니다. 하지만 한 가지는 분명합니다. 7월을 함께 지나오신 하나님께서 8월에도 먼저 걸어가신다는 사실입니다. 그러므로 우리는 불안을 붙잡기보다 하나님의 손을 붙잡을 수 있습니다.

  예수님께서는 자신의 양을 아무도 빼앗을 수 없다고 약속하셨습니다. 그 약속은 우리 부부와 감자에게도 동일하게 주어집니다. 우리는 하나님의 손 안에 있습니다. 그 손은 결코 피곤해지지 않고, 우리를 놓치지도 않으며, 오늘도 내일도 변함없이 붙들어 주십니다. 이 믿음으로 새로운 달의 첫날을 평안하게 마무리하면 좋겠습니다.

questions:
  - "최근 하나님께서 나를 지켜 주셨다고 느꼈던 작은 일은 무엇이었나요?"
  - "새로운 8월을 시작하며 하나님께 맡기고 싶은 걱정은 무엇인가요?"
  - "오늘 서로에게 가장 감사했던 한 가지를 이야기해 볼까요?"

prayer: |
  사랑의 하나님 아버지,
  새로운 8월을 허락하시고 오늘도 우리를 안전하게 지켜 주셔서 감사합니다.
  졸지도 주무시지도 않으시는 주님을 더욱 신뢰하게 하시고,
  눈에 보이는 상황보다 주님의 약속을 더 의지하게 하옵소서.

  사랑하는 아내가 임신의 시간을 기쁨으로 누리게 하시고,
  몸의 불편함이 줄어들며 변비와 같은 어려움 없이 편안한 나날을 보내게 하여 주옵소서.
  오늘 밤도 깊은 쉼을 허락하여 주시고 내일을 기대하는 마음을 주옵소서.

  15주를 맞이한 감자를 주님의 손으로 아름답게 빚어 주시고,
  하나님께서 계획하신 때와 모습대로 자라가게 하옵소서.

  우리 부부가 서로를 귀하게 여기며,
  감사와 웃음이 있는 가정을 세워 가게 하시고,
  어떤 날에도 함께 기도하는 부부가 되게 하옵소서.

  우리를 끝까지 붙드시는 예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 8월 1일 토요일 가정예배"
