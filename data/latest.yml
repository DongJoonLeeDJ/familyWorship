title: "내 기준과는 다른 하나님의 평가"

subtitle: "주인 노릇보다 주인 의식, 판단보다 겸손"

date: "2026-10-22"

calling: "하나님, 제 기준으로 다른 사람을 쉽게 판단하지 않게 하시고, 제가 맡은 자리에서는 책임을 다하며 다른 사람을 품을 수 있게 해 주세요."

verse1_title: "하나님 나라의 모습"

verse1: "하나님의 나라는 먹는 것과 마시는 것이 아니요 오직 성령 안에 있는 의와 평강과 희락이라 (로마서 14:17)"

verse2_title: "하나님께서 보시는 믿음"

verse2: "내가 무슨 말을 더 하리요 기드온, 바락, 삼손, 입다, 다윗 및 사무엘과 선지자들의 일을 말하려면 내게 시간이 부족하리로다 (히브리서 11:32)"

reflection: "오늘 말씀에서 기드온과 입다의 차이가 마음에 남았습니다. 에브라임 사람들의 불만 앞에서 기드온은 상대를 높이며 분노를 가라앉혔지만, 입다는 자신의 억울함을 설명한 뒤 결국 전쟁으로 나아갔습니다. 입다에게도 억울한 사정은 있었겠지만, 갈등을 풀어 가는 방식은 너무나 다른 결과를 만들었습니다. 저도 누군가의 말이나 행동이 마음에 들지 않을 때 제 입장에서 무엇이 옳은지 설명하는 데 집중하기 쉽습니다. 그러나 내가 옳다는 사실을 증명하는 것과 관계를 평화롭게 세우는 것은 같은 일이 아닐 수 있습니다. 더욱이 성경은 여러 약점이 있는 입다도 믿음의 사람들 가운데 기록합니다. 다른 사람의 부족함을 보며 쉽게 평가하기보다, 하나님께서 보시는 믿음과 제게 맡겨진 책임을 함께 돌아보고 싶습니다."

questions:

- "누군가와 의견이 다를 때, 제 주장을 인정받는 것보다 관계를 지키는 일을 먼저 생각할 수 있을까요?"
- "제가 책임을 다해야 할 자리와, 다른 사람을 조금 더 너그럽게 품어야 할 자리는 어디일까요?"

prayer: "하나님, 제 생각과 판단이 언제나 옳은 것은 아니라는 사실을 기억하게 해 주세요. 다른 사람의 부족함을 쉽게 지적하면서 제 모습에는 너그럽지 않았던 순간들을 돌아봅니다. 맡겨진 일에는 책임감을 가지고 참여하되, 다른 사람이 수고한 자리를 인정하고 그 사람의 연약함도 함부로 깎아내리지 않게 해 주세요. 특히 가까운 사람과 의견이 다를 때 제 말이 옳다는 것을 증명하는 데만 힘쓰지 않고, 서로의 마음을 살피며 평화를 이루는 말을 선택하게 해 주세요. 우리 부부가 서로를 성급하게 평가하기보다 이해하려고 노력하고, 함께 하나님 나라를 세워 가게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 22일 목요일 가정예배"