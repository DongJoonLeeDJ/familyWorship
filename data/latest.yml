title: "하나님께서 주신 재능"

subtitle: "맡겨진 일을 지혜롭게 감당하기"

date: "2026-11-03"

calling: "하나님, 저희에게 주신 재능과 역할을 돌아보며 그것을 어디에 어떻게 사용해야 할지 생각하게 해 주세요."

verse1_title: "하나님이 주신 지혜"

verse1: "내가 유다 지파 훌의 손자요 우리의 아들인 브살렐을 지명하여 부르고 하나님의 영을 그에게 충만하게 하여 지혜와 총명과 지식과 여러 가지 재주로 — 출애굽기 31:2-3 중"

verse2_title: "일하는 것과 쉬는 것"

verse2: "엿새 동안은 일할 것이나 일곱째 날은 큰 안식일이니 여호와께 거룩한 것이라 — 출애굽기 31:15 중"

reflection: "성막을 만드는 일을 맡은 브살렐은 하나님의 영으로 충만하여 지혜와 총명과 여러 재주를 갖추게 됩니다. 하나님께서 주시는 지혜가 예배나 말씀을 전하는 일에만 필요한 것은 아니라는 생각이 듭니다. 손으로 무언가를 만들고, 맡은 일을 능숙하게 해내는 재능도 하나님께서 주신 것으로 여겨집니다. 한편 하나님께서는 일하는 것뿐 아니라 안식하는 시간도 구별하셨습니다. 맡은 일을 잘 해내려 애쓰는 마음과 잠시 멈추어 쉬는 마음이 함께 필요합니다. 우리가 가진 능력을 소중히 여기되, 성과를 내는 것만으로 자신의 가치를 판단하지 않고 하나님께서 정하신 쉼도 귀하게 여기면 좋겠습니다."

questions:
  - "하나님께서 저희에게 주신 재능이나 능력 중 감사하게 생각하는 것은 무엇인가요?"
  - "해야 할 일에 집중하느라 충분히 쉬지 못하고 있다면, 일과 쉼의 균형을 위해 무엇을 바꾸면 좋을까요?"

prayer: "하나님 아버지, 저희에게 각자의 재능과 능력을 주셔서 감사합니다. 그것을 자신을 드러내는 데만 사용하지 않고, 맡겨진 일을 성실하게 감당하며 주변 사람에게 도움이 되도록 사용하게 해 주세요. 해야 할 일을 소홀히 하지 않으면서도 쉼의 소중함을 잊지 않게 하시고, 무리하게 자신을 몰아붙이거나 성과로 서로를 판단하지 않도록 도와주세요. 일하는 시간에도 쉬는 시간에도 주님께 감사하는 마음을 품게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 3일 화요일 가정예배"
