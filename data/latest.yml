title: "한 사람의 순종"
subtitle: "작은 용기가 역사를 바꾼다"
date: "2026-09-16"
calling: "잠시 눈을 감고 오늘의 발걸음을 돌아봅니다."
verse1_title: "사사기 7:22"
verse1: "그들이 나팔을 불매 여호와께서 그 온 진영에서 서로 칼로 치게 하시므로 적군이 도망하여 스레라의 벧싯다에 이르고 또 답밧에 가까운 아벨므홀라의 경계에 이르렀으며."
verse2_title: "시편 33:10-11"
verse2: "여호와께서 마음의 계획을 폐하시며 백성의 생각을 이루지 못하게 하시나니 여호와의 계획은 영영히 서고 그의 마음의 생각은 대대에 이르리로다."
reflection: >
  역사 다큐에서 보는 '말도 안 되는 반전'처럼, 기드온의 작은 순종이 큰 변화를 만들었습니다.
  멀리서 보면 하나님이 일하셨지만, 가까이서는 겁 많던 한 사람이 나팔을 불고 행동한 결과였지요.
  우리도 지금은 결과를 기다리며 불안하고, 때로는 아무것도 하지 못하는 것처럼 느낄 때가 있습니다.
  그러나 작은 자리에서의 성실함과 서로를 향한 한 번의 격려가 생각보다 큰 흐름을 만듭니다.
  오늘은 큰 결단이 아니라, 지금 할 수 있는 작은 선한 일 하나를 해보는 밤이 되면 좋겠습니다.
questions:
  - "오늘 내가 할 수 있는 작은 순종은 무엇인가요?"
  - "서로에게 건넬 한 마디 격려는 무엇일까요?"
prayer: >
  주님, 우리의 작은 용기와 연약함을 아시는 분, 오늘도 가까운 자리에서 한 걸음 내딛게 도와주소서.
  감자와 아내를 지켜 주시고, 결과를 기다리는 마음에 평안을 허락해 주세요.
  두려움 앞에서 서로의 손을 놓지 않게 하시고, 필요한 때에 담대히 순종하게 하소서. 아멘.
footer: "2026년 9월 16일 수요일 가정예배"
