title: "주 안에 거하는 삶"
subtitle: "기도는 하나님을 움직이는 방법이 아니라, 하나님 안에 머무는 삶에서 흘러나오는 열매입니다."
date: "2026-07-16"

calling: |
  사랑의 하나님,
  오늘도 우리 부부를 예배의 자리로 불러 주셔서 감사합니다.
  하루를 마무리하며 우리의 마음이 주님 안에 머물게 하시고,
  말씀을 통해 하나님을 더욱 신뢰하게 하옵소서.
  예수님의 이름으로 기도합니다. 아멘.

verse1_title: "요한복음 15:7"
verse1: |
  너희가 내 안에 거하고
  내 말이 너희 안에 거하면
  무엇이든지 원하는 대로 구하라
  그리하면 이루리라.

verse2_title: "시편 37:4-5"
verse2: |
  또 여호와를 기뻐하라
  그가 네 마음의 소원을 네게 이루어 주시리로다.
  네 길을 여호와께 맡기라
  그를 의지하면 그가 이루시고

reflection: |
  예수님은 왜 "무엇이든지 구하면 이루리라"보다
  먼저 "내 안에 거하라"고 말씀하셨을까요?

  우리는 종종 이루어짐에 먼저 마음이 갑니다.
  원하는 것이 이루어질까,
  기도가 응답될까,
  결과는 어떻게 될까를 생각합니다.

  그런데 예수님의 관심은
  기도의 기술이 아니라 관계였습니다.

  "내 안에 거하라."

  거한다는 것은 잠깐 찾아오는 것이 아니라
  머무는 것입니다.
  좋은 날만 함께하는 것이 아니라
  평범한 날에도 함께하는 것입니다.

  우리 부부가 매일 가정예배를 드리는 이유도
  여기에 있는 것 같습니다.

  이 시간을 통해
  하나님께 무엇을 받아 내기보다,
  하나님 안에 머무는 삶을 배우고 있기 때문입니다.

  지난 몇 달을 돌아보면
  하나님께서는 우리에게 참 많은 은혜를 허락하셨습니다.

  시험관 시술의 기다림을 지나
  감자를 선물로 주셨고,
  심장박동을 들려주셨으며,
  임신 12주까지 건강하게 자라게 하셨습니다.

  아직 2차 기형아 검사와
  최종 결과를 기다리는 시간이 남아 있습니다.

  하지만 하나님께서는
  그 결과를 기다리는 동안에도
  우리에게 먼저 주님 안에 거하라고 말씀하십니다.

  왜 그럴까요?

  주님 안에 머물다 보면
  우리의 기도도 조금씩 변하기 때문입니다.

  "하나님, 제 뜻을 이루어 주세요."에서
  "하나님, 제 마음이 주님의 마음을 닮게 해 주세요."로.

  복음은 하나님께서 먼저 우리 안에 거하시기 위해
  예수님을 보내셨다는 이야기입니다.
  우리는 하나님께 가까이 갈 자격을 만들어 낸 사람이 아니라,
  예수님 덕분에 하나님 안에 머물 수 있게 된 사람입니다.

  그래서 오늘도
  내일이 휴일이라 기쁜 마음도 하나님께 감사드리고,
  평범한 쉼도 하나님의 선물로 누리면 좋겠습니다.

  하나님 안에 거하는 사람에게
  쉼도, 일도, 기다림도
  모두 은혜가 될 수 있기 때문입니다.

questions:
  - "나는 요즘 하나님께 '무엇을 구하는 것'과 '하나님 안에 머무는 것' 중 어느 쪽에 더 마음이 가 있나요?"
  - "지난 몇 달 동안 우리 가정이 하나님 안에 거하며 경험한 은혜는 무엇이었나요?"
  - "내일의 쉼을 하나님께서 주시는 선물로 어떻게 감사하며 보낼 수 있을까요?"

prayer: |
  사랑의 하나님,
  오늘도 우리를 주님 안에 거하게 하시는 은혜에 감사합니다.
  무엇을 얻기 위해 하나님을 찾는 것이 아니라,
  하나님과 함께하는 삶 자체를 기뻐하는 가정이 되게 하옵소서.

  지금까지 감자를 건강하게 지켜 주시고,
  우리 부부를 한 걸음 한 걸음 인도하여 주셔서 감사합니다.
  앞으로 남아 있는 검사와 모든 과정도
  주님의 선하신 손에 맡겨 드립니다.

  사랑하는 아내를 오늘도 평안으로 덮어 주시고,
  몸과 마음을 강건하게 하시며,
  임신 기간 동안 필요한 모든 힘과 회복을 허락하여 주옵소서.

  사랑하는 감자를 계속해서 지켜 주시고,
  태중에서부터 하나님을 사랑하는 믿음의 사람으로 자라게 하옵소서.

  내일 허락하신 쉼도 감사함으로 누리게 하시고,
  쉬는 시간에도 하나님 안에 거하는 기쁨을 잊지 않게 하옵소서.

  우리를 하나님 안에 거하게 하신
  예수 그리스도의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 16일 목요일 가정예배"
