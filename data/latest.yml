title: "말씀에 의지하여"
subtitle: "결과를 붙들려 하기보다 하나님을 신뢰하는 믿음"

date: "2026-06-03"

calling: |
  하나님 아버지,

  오늘도 우리를 지켜 주신 은혜에 감사드립니다.

  마음 한편에는 여전히 걱정이 있고,
  아직 해결되지 않은 문제들도 있습니다.

  그러나 우리의 시선이 상황에만 머무르지 않고
  우리를 돌보시는 하나님께 향하기를 원합니다.

  오늘도 말씀을 통해 믿음을 새롭게 하시고,
  주님 안에서 평안을 누리게 하소서.

verse1_title: "누가복음 5:5"

verse1: |
  시몬이 대답하여 이르되
  선생님 우리들이 밤이 새도록 수고하였으되
  잡은 것이 없지마는

  말씀에 의지하여
  내가 그물을 내리리이다

verse2_title: "베드로전서 5:7"

verse2: |
  너희 염려를 다 주께 맡기라
  이는 그가 너희를 돌보심이라

reflection: |
  베드로는 밤새도록 수고했지만
  얻은 것이 없었습니다.

  그는 누구보다 경험 많은 어부였고,
  자신의 상황을 누구보다 잘 알고 있었습니다.

  그런데 예수님께서는
  다시 그물을 내리라고 말씀하셨습니다.

  베드로는 모든 상황이 납득되어서 순종한 것이 아니라,
  "말씀에 의지하여" 그물을 내렸습니다.

  요즘 우리의 마음도 비슷할 때가 있습니다.

  감사한 일도 있었고,
  심장박동도 확인했습니다.

  하지만 여전히 출혈이 있고,
  아기집 주변의 피고임도 남아 있습니다.

  그래서 기쁜 마음과 걱정되는 마음이
  함께 존재합니다.

  우리는 앞으로 어떤 일이 일어날지 알지 못합니다.

  그러나 하나님께서는
  미래를 모두 보여 주신 뒤에야 믿으라고 하시는 분이 아닙니다.

  오늘 우리에게 필요한 것은
  모든 결과를 미리 확인하는 것이 아니라,
  하나님께서 우리를 돌보고 계심을 신뢰하는 것입니다.

  베드로가 "말씀에 의지하여" 그물을 내렸듯이,
  우리도 "주께서 돌보신다"는 말씀에 의지하여
  오늘을 살아갈 수 있습니다.

  염려는 미래를 붙들려고 하지만,
  믿음은 하나님께 맡깁니다.

  오늘도 감자의 생명은
  하나님 손 안에 있습니다.

  아내의 몸도,
  남편의 마음도,
  우리 가정의 내일도
  하나님께서 알고 계십니다.

  그래서 우리는 불안을 억지로 없애려 애쓰기보다
  염려를 하나님께 맡기며
  하루를 마무리할 수 있습니다.

questions:
  - "오늘 하루 가장 많이 떠올랐던 걱정은 무엇이었나요?"
  - "하나님께서 지금까지 우리를 돌보셨다고 느껴지는 순간은 언제였나요?"
  - "내가 붙들고 통제하려는 것이 있다면 무엇인가요?"
  - "오늘 감자를 위해 하나님께 감사할 수 있는 한 가지는 무엇인가요?"

prayer: |
  하나님 아버지,

  오늘도 우리를 지켜 주시고
  감자의 생명을 붙들어 주셔서 감사합니다.

  저희는 자주 미래를 걱정하고,
  아직 알 수 없는 결과 때문에 마음이 흔들립니다.

  그러나 하나님께서 우리를 돌보신다는 말씀을 믿고
  염려를 주님께 맡기기 원합니다.

  아기집 주변의 피가 잘 흡수되거나 배출되게 하시고,
  출혈이 멈추도록 은혜를 베풀어 주십시오.

  감자가 건강하게 자라도록 지켜 주시고,
  아내의 몸과 마음에 안정과 평안을 허락하여 주십시오.

  남편도 두려움에 끌려가기보다
  하나님을 신뢰하며 가정을 잘 섬기게 하여 주십시오.

  결과를 붙들려 하기보다
  하나님께 맡기는 믿음을 주시고,
  지금까지 인도하신 은혜를 기억하게 하여 주십시오.

  하나님께서 우리 가정과 감자에게
  평안과 보호하심과 소망을 허락해 주시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 3일 수요일 가정예배"