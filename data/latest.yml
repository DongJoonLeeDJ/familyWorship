title: "기쁜 마음으로 드리는 것"

subtitle: "억지로가 아닌 자원하는 마음으로"

date: "2026-11-09"

calling: "우리에게 주신 모든 것을 돌아보며, 기쁨으로 하나님께 나아가는 예배를 드립니다."

verse1_title: "마음이 감동된 사람들이 드리다"

verse1: "“마음에 원하는 남녀가 와서 팔찌와 귀고리와 가락지와 목걸이와 여러 가지 금품을 가져다가 여호와께 금 예물을 드렸으며” (출애굽기 35:22)"

verse2_title: "하나님께 드리는 마음"

verse2: "성막을 만들기 위해 모세가 백성에게 예물을 요청했을 때, 사람들은 각자 마음에 원하는 것을 가져왔습니다. 어떤 사람은 귀금속을, 어떤 사람은 실과 천을, 또 어떤 사람은 자신의 재능을 보탰습니다. 가진 것도 역할도 달랐지만, 하나님께 드리고 싶은 마음으로 함께했습니다."

reflection: "하나님께 드리는 것은 꼭 물질만을 의미하지 않습니다. 시간과 수고, 재능과 관심도 누군가를 위해 기꺼이 내어놓을 수 있는 소중한 선물입니다. 중요한 것은 얼마나 많이 가졌느냐보다 어떤 마음으로 나누느냐일 것입니다. 우리 부부도 서로에게 무언가를 요구하기보다, 각자가 기쁜 마음으로 내어놓을 수 있는 것을 살피며 함께 가정을 세워가면 좋겠습니다."

questions:
  - "요즘 우리 가정을 위해 기쁜 마음으로 내어놓을 수 있는 시간이나 수고는 무엇인가요?"
  - "서로의 수고를 당연하게 여기지 않고 감사하려면 어떤 표현이 필요할까요?"

prayer: "하나님, 우리에게 주신 시간과 재능과 물질이 모두 주님의 선물임을 기억하게 해주세요. 의무감이나 생색이 아니라 감사와 기쁨으로 나누게 하시고, 서로의 수고를 당연하게 여기지 않도록 도와주세요. 우리 부부가 작은 것부터 기꺼이 나누며 사랑으로 가정을 세워가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 9일 월요일 가정예배"
