title: "돌아갈 곳을 잊은 사람들"

subtitle: "눈에 보이는 것을 의지하지 않기"

date: "2026-11-04"

calling: "하나님, 눈앞의 상황에 흔들려 주님을 잊지 않고 끝까지 믿음을 지키도록 도와주세요."

verse1_title: "금송아지를 만든 백성"

verse1: "백성이 아론에게 이르되 일어나라 우리를 위하여 우리를 인도할 신을 만들라 이 모세 곧 우리를 애굽 땅에서 인도하여 낸 사람은 어찌 되었는지 알지 못함이니라 — 출애굽기 32:1"

verse2_title: "모세의 간절한 중보"

verse2: "그러나 모세는 그의 하나님 여호와께 구하여 이르되 여호와여 어찌하여 그 큰 권능과 강한 손으로 애굽 땅에서 인도하여 내신 주의 백성에게 진노하시나이까 — 출애굽기 32:11"

reflection: "모세가 산에서 내려오지 않자 이스라엘 백성은 아론에게 자신들을 인도할 신을 만들어 달라고 요구합니다. 하나님께서 직접 그들을 이집트에서 이끌어 내셨지만, 눈앞에 보이는 모세가 사라지자 금송아지를 만들었습니다. 보이지 않는 하나님을 기다리기보다 당장 의지할 수 있는 대상을 원했던 것입니다. 우리도 하나님을 믿는다고 하면서 막상 상황이 불확실해지면 눈에 보이는 결과나 확실한 무언가를 붙잡으려 할 때가 있습니다. 하나님을 믿는다는 것은 모든 상황을 이해하거나 원하는 결과를 확인하는 것이 아니라, 보이지 않는 하나님을 하나님으로 인정하는 것임을 생각하게 됩니다."

questions:
  - "불안하거나 상황이 뜻대로 되지 않을 때, 하나님보다 더 의지하려는 것은 무엇인가요?"
  - "우리 부부가 눈앞의 결과에만 마음을 빼앗기지 않고 하나님을 신뢰하기 위해 필요한 것은 무엇일까요?"

prayer: "하나님 아버지, 눈에 보이는 것만을 의지하려는 저희의 마음을 돌아봅니다. 원하는 때에 원하는 모습으로 일이 이루어지지 않을 때에도 주님을 잊지 않게 해 주세요. 당장 확인할 수 있는 결과에만 매달리지 않고, 하나님께서 어떤 분이신지를 기억하며 살아가게 해 주세요. 저희가 조급함으로 잘못된 선택을 하지 않도록 지혜를 주시고, 서로에게 믿음과 위로가 되는 부부가 되게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 4일 수요일 가정예배"
