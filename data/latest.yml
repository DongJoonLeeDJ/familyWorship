title: "아직 다 이루지 못한 길 위에서"

subtitle: "그리스도 예수를 향하여"

date: "2026-10-11"

calling: "오늘 하루를 돌아보며, 잘한 일과 아쉬운 일을 모두 내려놓고 지금 우리가 걸어가고 있는 길을 하나님 앞에서 생각해 봅니다."

verse1_title: "푯대를 향하여"

verse1: "빌립보서 3:13-14 — 형제들아 나는 아직 내가 잡은 줄로 여기지 아니하고 오직 한 일 즉 뒤에 있는 것은 잊어버리고 앞에 있는 것을 잡으려고 푯대를 향하여 그리스도 예수 안에서 하나님이 위에서 부르신 부름의 상을 위하여 달려가노라"

verse2_title: "모세가 여호와께 부르짖으니"

verse2: "출애굽기 7:5 — 내가 내 손을 애굽 위에 펴서 이스라엘 자손을 그 땅에서 인도하여 낼 때에야 애굽 사람이 나를 여호와인 줄 알리라 하시매"

reflection: "바울은 자신이 이미 모든 것을 이루었다고 생각하지 않았습니다. 지나온 일을 돌아보되 거기에 머무르지 않고, 아직 가야 할 길을 바라보았습니다. 우리도 신앙생활을 하면서 잘한 날에는 스스로 만족하고, 부족했던 날에는 괜히 마음이 무거워질 때가 있습니다. 부모가 될 준비를 하면서도 잘하고 있는지 자신이 없을 수 있고요. 하지만 지금의 우리 모습이 완성된 모습은 아닙니다. 중요한 것은 이미 완벽한 사람이 되었느냐가 아니라, 부족한 가운데서도 무엇을 바라보며 한 걸음씩 나아가느냐일 것입니다. 모세가 바로 앞에서 마주한 상황도 단번에 끝나지 않았습니다. 하나님의 일이 진행되는 과정에는 우리가 당장 이해하기 어려운 시간도 있었습니다. 오늘 모든 것을 잘해내지 못했더라도, 지나간 일에만 머물지 않고 다시 걸어갈 수 있으면 좋겠습니다."

questions:

- "요즘 나는 지나간 실수나 아직 해결되지 않은 일 때문에 현재의 나를 지나치게 판단하고 있지는 않을까?"
- "우리 부부가 앞으로 완벽하게 해내기보다 함께 배우고 조금씩 자라가고 싶은 것은 무엇일까?"

prayer: "하나님, 저희가 아직 부족하고 배워야 할 것이 많은 사람임을 고백합니다. 지나온 일에 아쉬움이 남을 때 그 마음에만 머물지 않게 하시고, 앞으로 걸어갈 길을 바라보게 해주세요. 감자를 맞이할 준비도 모든 것을 미리 알고 완벽하게 해내려 하기보다, 필요한 것을 하나씩 배우고 서로 도우며 해나가게 해주세요. 눈앞의 상황만으로 조급하게 결론 내리지 않게 하시고, 저희가 무엇을 바라보며 살아가야 하는지 잊지 않게 해주세요. 오늘의 부족함을 외면하지 않되 그것 때문에 낙심하지 않고, 그리스도 예수님을 향해 다시 한 걸음 내딛게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 11일 일요일 가정예배"