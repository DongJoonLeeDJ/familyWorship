title: "하나님께서 거하실 자리"

subtitle: "우리의 마음과 일상에 하나님을 모시며"

date: "2026-10-28"

calling: "하나님, 분주한 일상 속에서도 주님을 모시고 주님과 함께 살아가게 해 주세요."

verse1_title: "내가 그들 중에 거할 성소"

verse1: "내가 그들 중에 거할 성소를 그들이 나를 위하여 짓되 — 출애굽기 25:8"

verse2_title: "기쁜 마음으로 드리는 예물"

verse2: "무릇 즐거운 마음으로 내는 자에게서 내게 드리는 것을 너희는 받을지니라 — 출애굽기 25:2"

reflection: "출애굽기 25장에서 하나님은 이스라엘 백성에게 성소를 만들라고 하시며, 기쁜 마음으로 드리는 예물을 받으라고 말씀하십니다. 성소를 만드는 일은 단순히 건물을 세우는 것이 아니라, 하나님께서 백성 가운데 거하신다는 사실을 드러내는 일이었습니다. 하나님은 억지로 내놓는 것보다 기쁜 마음으로 드리는 것을 바라십니다. 우리도 예배나 섬김을 해야 할 일로만 여기다 보면 마음이 무거워질 수 있습니다. 하지만 하나님과 함께 살아가는 자리를 마련하는 일은 거창한 결심에서만 시작되지 않습니다. 하루 중 잠시 말씀을 읽고 기도하는 시간, 서로에게 따뜻하게 말하는 순간에도 주님을 모실 수 있습니다. 우리 가정의 일상에도 하나님을 기쁘게 모시는 자리가 조금씩 넓어지면 좋겠습니다."

questions:
  - "하나님께 드리는 시간이나 섬김을 의무처럼 느끼고 있는 부분이 있다면, 기쁜 마음으로 다시 시작하기 위해 무엇이 필요할까요?"
  - "오늘 우리 가정에서 하나님을 모시고 살아간다는 것을 작은 행동으로 표현한다면 무엇을 할 수 있을까요?"

prayer: "하나님 아버지, 우리 가운데 거하시기를 원하시는 주님의 마음을 기억하게 해 주세요. 예배와 기도, 섬김을 억지로 해야 하는 일로만 여기지 않고 감사와 기쁨으로 드리게 해 주세요. 바쁜 일상 속에서도 주님을 위한 자리를 잊지 않게 하시고, 부부가 서로를 대하는 말과 행동에도 주님의 사랑이 머물게 해 주세요. 감자와 함께 살아갈 우리 가정이 주님을 기쁘게 모시는 따뜻한 가정으로 자라가게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 28일 수요일 가정예배"
