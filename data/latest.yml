title: "오늘 주신 사실을 기억하며"
subtitle: "불안보다 은혜를 바라봅니다"
date: "2026-06-15"

calling: |
  우리를 여기까지 인도하신 하나님께 감사하며 예배드립니다.
  아직 알 수 없는 미래보다 오늘 하나님께서 보여 주신 은혜를 기억하며 주님께 나아갑시다.

verse1_title: "마태복음 6:34"
verse1: |
  그러므로 내일 일을 위하여 염려하지 말라.
  내일 일은 내일이 염려할 것이요
  한 날의 괴로움은 그 날로 족하니라.

verse2_title: "이사야 26:3"
verse2: |
  주께서 심지가 견고한 자를 평강하고 평강하도록 지키시리니
  이는 그가 주를 신뢰함이니이다.

reflection: |
  사람의 마음은 좋은 소식보다 걱정되는 소식에 더 오래 머물 때가 있습니다. 특히 사랑하는 사람을 지켜야 한다고 생각할수록 작은 걱정도 크게 느껴지곤 합니다.

  최근 우리 부부는 감자의 심장소리를 들었습니다. 피고임도 이전보다 줄어들었고, 병원에서는 졸업 이야기도 꺼내기 시작했습니다. 분만병원을 알아볼 만큼 하나님께서 여기까지 인도해 주셨습니다. 이것은 분명 감사한 사실입니다.

  그런데 한편으로는 인터넷에서 보게 되는 여러 이야기들이 마음을 흔들기도 합니다. 또 산전검사 과정에서 갑상선 수치에 대한 이야기를 듣게 되면서 아내의 마음에 새로운 걱정이 생겼습니다. 과거 큰 수술을 경험했던 기억이 있기에 더욱 불안하게 느껴질 수도 있습니다.

  하지만 오늘 우리가 기억해야 할 것은 아직 확인되지 않은 가능성이 아니라, 하나님께서 이미 보여 주신 사실들입니다. 감자는 자라고 있습니다. 심장소리가 들렸습니다. 하나님께서는 지금까지 우리를 인도하셨습니다.

  물론 불안한 마음이 드는 것은 자연스러운 일입니다. 하나님은 그런 감정을 꾸짖지 않으십니다. 오히려 우리의 걱정을 가지고 하나님께 나오라고 말씀하십니다. 믿음은 걱정이 전혀 없는 상태가 아니라, 걱정이 있을 때에도 하나님께 맡기는 것입니다.

  내일은 진료를 받는 날입니다. 감자의 성장도 확인하고, 피고임 상태도 살펴보고, 졸업 여부도 듣게 될 것입니다. 갑상선과 관련된 부분도 조금 더 알아가게 될 수 있습니다. 하지만 내일의 결과보다 먼저 기억해야 할 것은 하나님께서 오늘도 우리와 함께 계신다는 사실입니다.

  오늘은 인터넷 속 수많은 이야기보다 우리 가정에 실제로 베풀어 주신 은혜를 기억하면 좋겠습니다. 하나님께서 어제까지 인도하셨다면, 내일도 가장 좋은 길로 인도하실 것입니다.

questions:
  - "요즘 가장 자주 떠오르는 걱정은 무엇인가요?"
  - "하나님께서 지금까지 우리 가정에 보여 주신 은혜 중 가장 감사한 것은 무엇인가요?"
  - "내일 진료를 앞두고 하나님께 맡기고 싶은 마음은 무엇인가요?"

prayer: |
  사랑의 하나님,

  오늘도 우리 가정을 지켜 주시고 감자의 생명을 붙들어 주셔서 감사합니다.

  감자의 심장소리를 듣게 하시고,
  여기까지 인도하여 주신 은혜를 기억하게 하여 주옵소서.
  아직 보지 못한 미래를 두려워하기보다
  이미 보여 주신 신실하심을 바라보게 하여 주옵소서.

  특별히 아내의 마음을 위로하여 주옵소서.
  갑상선 수치에 대한 걱정과 과거의 아픈 기억 때문에 생기는 두려움까지도 주님께 맡기게 하시고,
  마음에 평안을 허락하여 주옵소서.

  내일 병원 진료 가운데 함께하여 주시고,
  감자가 건강하게 자라고 있음을 확인하게 하여 주옵소서.
  남아 있는 피고임도 잘 흡수되게 하시고,
  갑상선 관련 검사와 진료도 필요한 지혜와 도움 가운데 진행되게 하여 주옵소서.

  남편에게는 믿음과 사랑을 더하여 주셔서
  아내를 잘 위로하고 돕게 하여 주옵소서.
  우리 부부가 결과를 통제하려 하기보다
  하나님을 더욱 신뢰하게 하여 주옵소서.

  하나님께서 오늘도 아내에게 평안과 위로를 주시고,
  감자에게 건강한 성장의 은혜를 허락하시기를 축복합니다.

  예수님의 이름으로 기도합니다.

  아멘.

footer: "2026년 6월 15일 월요일 가정예배"