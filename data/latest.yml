title: "마주하기 시작한 과거"
subtitle: "피하고 싶은 자리에서도 진실을 바라보다"
date: "2026-09-24"
calling: "오늘은 외면하고 싶은 마음까지 하나님 앞에 솔직히 내려놓으며 예배합니다."

verse1_title: "기근 앞에서"
verse1: "야곱이 애굽에 곡식이 있음을 보고 아들들에게 이르되 너희는 어찌하여 서로 바라보고만 있느냐. (창세기 42:1)"

verse2_title: "양심이 깨어나다"
verse2: "그들이 서로 말하되 우리가 아우의 일로 말미암아 범죄하였도다. (창세기 42:21)"

reflection: "창세기 42장에서 형들은 자신들이 저질렀던 요셉의 일을 떠올립니다. 오랜 시간이 지났지만 지나간 일이 완전히 사라진 것은 아니었습니다. 평소에는 묻어두었던 기억이 예상하지 못한 순간에 다시 드러났습니다. 우리도 살아가면서 피하고 싶은 기억이나 인정하기 어려운 마음을 가지고 있을 수 있습니다. 그것을 억지로 덮어두기보다 하나님 앞에서 정직하게 바라볼 때, 비로소 다음 걸음을 내디딜 수 있을 것 같습니다. 하나님은 우리의 과거를 들춰내어 정죄하기보다 그것까지 가지고 나아오도록 기다리시는 분임을 믿고 싶습니다."

questions:
  - "내가 하나님 앞에서 솔직하게 바라보지 못하고 있는 마음은 무엇일까?"
  - "과거의 잘못을 후회하는 데서 그치지 않고 오늘 바꿀 수 있는 것은 무엇일까?"

prayer: "하나님, 지나간 일과 마주하는 것이 두려울 때에도 숨지 않게 해주세요. 잘못은 정직하게 인정하고, 그 기억에 붙잡혀 있기보다 오늘의 삶을 바르게 살아가게 해주세요. 우리 부부도 서로에게 솔직하고 따뜻한 마음을 잃지 않게 하시고, 감자의 앞날도 주님의 손에 맡깁니다. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 24일 목요일 가정예배"
