title: "항상 함께 있으리라"
subtitle: "보내심과 동행하심"
date: "2026-08-17"

calling: |
  오늘 하루도 잘 지나왔습니다.
  예수님께서는 제자들을 세상으로 보내시면서
  해야 할 일을 말씀하신 뒤 마지막에 한 약속을 남기셨습니다.
  "내가 세상 끝날까지 너희와 항상 함께 있으리라."

  오늘 밤에는 우리가 무엇을 해내야 하는지보다,
  우리를 보내시는 주님께서 함께하신다는 약속을 붙들며 예배드리겠습니다.

verse1_title: "모든 민족을 제자로 삼으라"
verse1: |
  마태복음 28:18-20
  예수께서 나아와 말씀하여 이르시되 하늘과 땅의 모든 권세를 내게 주셨으니
  그러므로 너희는 가서 모든 민족을 제자로 삼아 아버지와 아들과 성령의 이름으로 세례를 베풀고
  내가 너희에게 분부한 모든 것을 가르쳐 지키게 하라
  볼지어다 내가 세상 끝날까지 너희와 항상 함께 있으리라 하시니라

verse2_title: "함께하시는 주님"
verse2: |
  이사야 41:10
  두려워하지 말라 내가 너와 함께 함이라
  놀라지 말라 나는 네 하나님이 됨이라
  내가 너를 굳세게 하리라 참으로 너를 도와주리라
  참으로 나의 의로운 오른손으로 너를 붙들리라

reflection: |
  예수님께서 제자들에게 마지막으로 주신 말씀을 보면
  해야 할 일이 꽤 많습니다.

  가야 하고,
  제자를 삼아야 하고,
  세례를 베풀어야 하고,
  가르쳐 지키게 해야 합니다.

  그런데 이 모든 명령의 마지막에
  아주 따뜻한 약속이 하나 붙어 있습니다.

  "내가 세상 끝날까지 너희와 항상 함께 있으리라."

  예수님께서 제자들을 세상에 보내실 때
  "너희가 알아서 잘해라"라고 말씀하지 않으셨습니다.
  사명을 주시는 동시에 함께하시겠다고 약속하셨습니다.

  우리 삶도 비슷하지 않을까요.

  우리는 매일 해야 할 일이 있습니다.
  직장에서도 해야 할 일이 있고,
  가정에서도 해야 할 일이 있습니다.
  앞으로는 부모로서 감당해야 할 일도 생길 것입니다.

  그런데 우리가 모든 일을 잘할 수 있는 것은 아닙니다.
  어떤 날은 지치고,
  어떤 날은 실수하고,
  어떤 날은 무엇부터 해야 할지도 모르겠습니다.

  그때 오늘 말씀을 기억하면 좋겠습니다.

  예수님께서 우리에게 맡기신 삶은
  우리가 혼자 감당하는 삶이 아닙니다.
  주님께서 함께 걸으시는 삶입니다.

  특히 우리 부부가 감자를 기다리며 살아가는 지금,
  앞으로 부모가 된다는 것은
  모든 것을 미리 알고 준비하는 일이 아닐 것입니다.

  모르는 것이 생길 때마다 배우고,
  예상하지 못한 일이 생기면 함께 해결하고,
  때로는 "이게 맞나?" 하면서도 한 걸음씩 걸어가게 될 것입니다.

  그 길에도 예수님께서 함께하십니다.

  이것이 오늘 말씀의 가장 큰 위로가 아닐까 싶습니다.

  우리가 완벽해야 주님이 함께하시는 것이 아닙니다.
  주님께서 먼저 함께하시기 때문에
  부족한 우리도 맡겨진 삶을 살아갈 수 있습니다.

  그러니 오늘 밤에는
  내일 해야 할 일을 모두 해결하려 하지 않아도 좋겠습니다.

  오늘 할 수 있는 만큼 감사하고,
  서로에게 따뜻한 말 한마디 건네고,
  아직 오지 않은 내일은 주님께 맡기면 됩니다.

  우리의 사명보다 먼저 기억할 것은
  우리와 함께하시는 예수님입니다.

  그리고 우리가 잘해서 하나님께 사랑받는 것이 아니라
  그리스도께서 먼저 우리를 사랑하셨기에
  우리는 다시 내일을 살아갈 힘을 얻습니다.

  오늘도 그 약속을 붙들고 편히 쉬었으면 좋겠습니다.

questions:
  - "오늘 '예수님이 함께하신다'는 말이 가장 필요했던 순간은 언제였나요?"
  - "앞으로 부모가 되어 가면서 서로에게 어떤 동반자가 되어 주고 싶나요?"
  - "오늘 하루를 주님께 맡기며 서로에게 해 주고 싶은 말은 무엇인가요?"

prayer: |
  하나님 아버지,
  오늘도 우리와 함께 걸어 주셔서 감사합니다.

  해야 할 일이 많고 앞으로 알 수 없는 일들도 있지만,
  우리가 혼자 살아가는 것이 아님을 기억하게 해 주세요.
  예수님께서 세상 끝날까지 함께하시겠다고 약속하셨으니
  내일의 일도 주님께 맡기겠습니다.

  아내의 오늘을 돌아보시고
  마음에 편안한 쉼을 허락해 주세요.
  작은 기쁨과 웃음을 잃지 않게 하시고,
  앞으로 엄마가 되어 가는 시간도 기쁨으로 누리게 해 주세요.

  감자와 함께 맞이할 새로운 날들도 주님께 맡깁니다.
  우리가 모든 것을 완벽하게 준비하려 하기보다
  하나님께서 인도하시는 길을 한 걸음씩 걸어가게 해 주세요.

  우리 부부가 서로의 짐을 가볍게 해 주는 사람이 되게 하시고,
  바쁜 날에도 서로를 잊지 않게 해 주세요.
  우리의 가정이 주님과 함께 살아가는 기쁨을 누리게 해 주세요.

  우리를 먼저 사랑하신 예수님의 은혜를 의지하여
  오늘 밤 편히 쉬고 내일을 맞이하게 해 주세요.

  예수 그리스도의 이름으로 기도드립니다.
  아멘.

