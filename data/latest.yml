title: "작은 일에도 함께하시는 하나님"
subtitle: "평범한 하루를 살아가는 믿음"
date: "2026-08-18"

calling: |
  하루를 마치고 돌아보면 특별한 일보다
  평범하게 지나간 순간들이 더 많이 떠오릅니다.
  밥을 먹고, 일을 하고, 서로 이야기를 나누고,
  각자의 자리에서 하루를 살아냈습니다.

  하나님은 특별한 순간에만 우리와 함께하시는 분이 아닙니다.
  오늘처럼 별일 없이 지나간 하루에도 함께하십니다.
  그 사실을 기억하며 오늘 밤 잠시 마음을 내려놓고 예배드리겠습니다.

verse1_title: "범사에 감사하라"
verse1: |
  데살로니가전서 5:16-18
  항상 기뻐하라
  쉬지 말고 기도하라
  범사에 감사하라
  이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라

verse2_title: "무엇을 하든지 주께 하듯"
verse2: |
  골로새서 3:23-24
  무슨 일을 하든지 마음을 다하여 주께 하듯 하고 사람에게 하듯 하지 말라
  이는 기업의 상을 주께 받을 줄 아나니 너희는 주 그리스도를 섬기느니라

reflection: |
  특별한 일이 없는 날은 나중에 기억하기가 어렵습니다.

  여행을 다녀온 날이나 큰 사건이 있었던 날은 오래 기억하지만,
  평소와 똑같이 일하고 밥 먹고 집에 돌아온 하루는
  금세 어제와 섞여 버립니다.

  그런데 하나님께서는 그런 평범한 하루도 소중하게 여기시는 것 같습니다.

  바울은 "범사에 감사하라"고 말합니다.
  모든 일이 다 좋다는 뜻은 아닙니다.
  힘든 일까지 억지로 좋다고 생각하라는 것도 아닙니다.
  오히려 좋은 날이나 힘든 날이나
  그 모든 시간을 하나님과 함께 살아가라는 말씀에 가깝습니다.

  우리의 신앙도 결국 대부분 평범한 하루 속에서 드러납니다.

  예배드리는 순간만 하나님을 섬기는 것이 아니라
  일할 때도, 밥을 먹을 때도,
  배우자와 이야기를 나눌 때도,
  피곤해서 아무것도 하기 싫은 순간에도
  우리는 하나님 앞에서 살아갑니다.

  골로새서는 "무슨 일을 하든지 마음을 다하여 주께 하듯 하라"고 합니다.

  거창한 일을 하라는 말이 아닙니다.
  지금 내 앞에 놓인 일을 하나님 앞에서 성실하게 살아내라는 것입니다.

  이것을 가정에 가져오면 조금 다르게 보입니다.

  부부가 함께 살아가면서 하는 일의 상당수는
  누가 알아주지도 않는 작은 일입니다.
  밥을 준비하고,
  정리하고,
  서로 필요한 것을 챙기고,
  피곤한 상대에게 한마디 건네는 일들입니다.

  하지만 그런 작은 행동들이 모여서 가정의 하루가 됩니다.

  앞으로 감자가 태어나면 더욱 그렇겠지요.
  아이를 키우는 일은 특별한 이벤트보다
  매일 반복되는 작은 돌봄이 훨씬 많을 것입니다.

  먹이고,
  씻기고,
  재우고,
  또 먹이고,
  또 씻기고,
  또 재우는 날들이 이어질 것입니다.

  아마 "내가 지금 무슨 대단한 일을 하고 있지?" 싶을 때도 있겠지만,
  하나님께서는 바로 그런 작은 사랑도 알고 계실 것입니다.

  우리의 삶이 특별해야 하나님께 의미 있는 것이 아닙니다.

  오늘 아내에게 건넨 따뜻한 말 한마디,
  오늘 묵묵히 해낸 일 하나,
  서로를 위해 양보한 작은 행동 하나도
  하나님 앞에서는 그냥 사라지는 것이 아닙니다.

  예수님께서도 화려한 삶을 보여 주신 것만이 아니라
  사람들 가운데서 먹고 마시고 걸으시며
  평범한 하루를 살아가셨습니다.

  그래서 우리도 오늘의 평범함을
  너무 하찮게 여기지 않았으면 좋겠습니다.

  오늘 하루를 무사히 살아냈다면 그것도 은혜입니다.
  서로의 얼굴을 볼 수 있었다면 감사할 일이고,
  함께 예배드릴 수 있다면 더욱 감사할 일입니다.

  특별한 일이 없었던 것이 아니라,
  평범한 은혜가 너무 많아서 특별하게 느끼지 못했을 뿐인지도 모릅니다.

  오늘 밤에는 그 평범한 은혜 몇 가지를 떠올려 보면 좋겠습니다.

  그리고 내일도 거창한 것을 이루려고 하기보다
  내 앞에 놓인 하루를 하나님과 함께 살아가면 좋겠습니다.

  우리는 잘해서 하나님께 사랑받는 사람들이 아닙니다.
  예수님 안에서 이미 사랑받은 사람들이기에
  평범한 하루도 감사함으로 살아갈 수 있습니다.

  오늘도 충분히 잘 살아냈습니다.
  이제 하나님께 하루를 맡기고 편히 쉬어도 좋겠습니다.

questions:
  - "오늘 하루 중 별것 아닌 것 같지만 감사했던 순간이 하나 있었나요?"
  - "서로가 오늘 해 준 작은 행동 가운데 고마웠던 것이 있다면 무엇인가요?"
  - "내일 특별한 일을 만들기보다 하나님께 드리고 싶은 평범한 하루의 모습은 무엇인가요?"

prayer: |
  하나님 아버지,
  특별한 일이 없는 평범한 하루도 주님의 은혜였음을 기억하게 해 주세요.
  우리가 지나치기 쉬운 작은 감사들을 발견하게 하시고,
  오늘 주어진 삶을 소중히 살아가게 해 주세요.

  아내의 하루를 돌아보아 주시고,
  오늘의 피곤함은 내려놓고 편안히 쉬게 해 주세요.
  평범한 일상 속에서도 웃을 수 있는 순간을 허락하시고,
  지금의 시간을 감사하며 누리게 해 주세요.

  감자를 기다리는 동안에도
  부모가 되어 가는 우리의 하루하루를 귀하게 여겨 주세요.
  앞으로 반복될 수많은 작은 돌봄 속에서도
  사랑의 기쁨을 발견하게 하시고,
  맡겨 주신 생명을 감사함으로 돌보게 해 주세요.

  우리 부부가 큰일이 있을 때만 서로를 챙기는 것이 아니라
  평범한 날에도 서로의 수고를 알아주게 해 주세요.
  작은 친절과 따뜻한 말이 우리 가정에 오래 쌓이게 해 주세요.

  우리가 잘해서 사랑받는 것이 아니라
  예수님 안에서 이미 사랑받고 있음을 기억하며,
  오늘도 감사로 하루를 내려놓습니다.

  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 8월 18일 화요일 가정예배"
