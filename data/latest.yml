title: "복음에 합당하게 살아가기"
 
subtitle: "두려움보다 담대함으로, 혼자보다 함께"
 
date: "2026-10-20"
 
calling: "우리는 하나님 나라를 꿈꾸며 살아가는 천국 시민입니다. 오늘 말씀을 통해 우리에게 주어진 신분과 책임을 돌아보고, 가정과 일상에서 복음에 합당한 삶을 살아가기로 함께 마음을 모읍니다."
 
verse1_title: "복음에 합당하게 생활하라"
 
verse1: "빌립보서 1:27 — 오직 너희는 그리스도의 복음에 합당하게 생활하라 이는 내가 너희에게 가 보나 떠나 있으나 너희가 한마음으로 서서 한 뜻으로 복음의 신앙을 위하여 협력하는 것과"
 
verse2_title: "우리 안에 계신 이가 더 크시니라"
 
verse2: "요한일서 4:4 — 자녀들아 너희는 하나님께 속하였고 또 그들을 이기었나니 이는 너희 안에 계신 이가 세상에 있는 자보다 크심이라"
 
reflection: "오늘 특별새벽기도회 말씀은 우리가 천국 시민으로서 이 땅을 살아간다는 사실을 일깨워 줍니다. 천국 시민답게 산다는 것은 말로만 믿음을 이야기하는 것이 아니라, 우리의 태도와 선택을 통해 하나님 나라를 드러내는 일입니다. 하지만 그 길을 혼자 걷는 것은 아닙니다. 바울은 한마음과 한뜻으로 함께 서서 복음을 위해 협력하라고 권합니다. 서로 다른 생각이 생길 때 상대를 적으로 여기거나 책임을 떠넘기기보다, 우리가 함께 지키려는 사랑과 믿음을 먼저 돌아볼 필요가 있습니다. 물론 모든 갈등에서 무조건 맞서거나 참는 것이 답은 아닙니다. 복음을 위한 담대함은 상대를 이기는 고집이 아니라, 어려움 속에서도 진리와 사랑을 포기하지 않는 태도일 것입니다. 고난이 찾아온다고 해서 하나님이 떠나셨다고 단정할 필요도 없습니다. 오늘 감당해야 할 일이 크고 어렵게 느껴지더라도, 하나님을 의지하며 서로의 편이 되어 한 걸음씩 나아갑시다."
 
questions:
  - "우리 부부가 의견이 다를 때, 서로를 이기려 하기보다 한마음으로 문제를 풀기 위해 할 수 있는 일은 무엇일까요?"
  - "오늘 두려움 때문에 피하고 싶지만 믿음과 사랑으로 담대하게 마주해야 할 일이 있나요?"
 
prayer: "하나님 아버지, 저희를 예수 그리스도의 은혜로 하나님 나라의 백성 삼아 주셔서 감사합니다. 천국 시민이라는 이름에 걸맞게 말과 행동으로 주님의 사랑을 나타내게 해 주세요. 어려움 앞에서 두려움에 사로잡히거나 쉽게 포기하지 않게 하시고, 무엇을 지켜야 하며 어떤 방식으로 행동해야 하는지 분별하게 해 주세요. 저희 부부가 서로를 경쟁자나 적으로 여기지 않고, 한마음으로 주님을 바라보며 함께 성장하게 해 주세요. 잘못했을 때는 인정하고 고칠 용기를 주시며, 서로 다른 생각 속에서도 사랑과 진리를 함께 붙들게 해 주세요. 감자에게도 믿음은 말뿐 아니라 삶으로 보여 주는 것임을 가르칠 수 있도록 저희부터 복음에 합당하게 살아가게 해 주세요. 오늘 만나는 사람들에게 저희의 부족함만 드러나는 것이 아니라, 주님의 은혜와 평화가 전해지기를 소망합니다. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."
 
footer: "2026년 10월 20일 화요일 가정예배"
