title: "오늘도 우리를 지키시는 하나님"
subtitle: "감사와 조심스러움 사이에서 평안을 배우며"
date: "2026-05-27"

verse1_title: "시편 139:13-14"
verse1: |
  주께서 내 내장을 지으시며
  나의 모태에서 나를 만드셨나이다

  내가 주께 감사하옴은
  나를 지으심이 심히 기묘하심이라
  주께서 하시는 일이 기이함을
  내 영혼이 잘 아나이다

verse2_title: "마태복음 6:34"
verse2: |
  그러므로 내일 일을 위하여 염려하지 말라
  내일 일은 내일이 염려할 것이요
  한 날의 괴로움은 그 날로 족하니라

reflection: |
  어제 우리는
  감사와 놀람이 함께했던 하루를 지나왔습니다.

  기쁜 소식을 듣고 안도했다가,
  예상하지 못한 상황 앞에서 마음이 크게 흔들리기도 했습니다.

  하지만 그 시간 속에서도
  하나님께서는 우리를 버려두지 않으셨고,
  다시 확인하게 하시며
  마음을 붙들어 주셨습니다.

  오늘 말씀은
  하나님께서 모태에서부터 우리를 지으셨다고 말합니다.

  생명은 단지 우리의 계획과 노력만으로 유지되는 것이 아니라,
  하나님의 깊은 돌보심 안에 있다는 사실을 다시 생각하게 됩니다.

  그래서 우리는
  모든 것을 통제하려 애쓰기보다,
  오늘 하루를 하나님께 맡기며 살아가는 법을 조금씩 배워 갑니다.

  물론 마음은 여전히 조심스럽습니다.
  작은 변화에도 민감해지고,
  괜찮은지 계속 확인하고 싶은 마음도 있습니다.

  하나님은 그런 우리의 마음을 이해하십니다.

  그래서 예수님은
  내일의 모든 일을 미리 짊어지려 하지 말고,
  오늘 하루를 하나님께 맡기라고 말씀하십니다.

  믿음은 미래를 다 아는 상태가 아니라,
  오늘도 하나님께서 우리를 붙들고 계심을 신뢰하며 살아가는 것입니다.

  오늘 밤은
  아직 다 알 수 없는 내일보다,
  오늘까지 인도하신 하나님을 기억하며
  감사 가운데 쉬는 시간이 되기를 바랍니다.

questions:
  - "어제 하나님께 특별히 감사했던 순간은 무엇인가요?"
  - "내 마음이 가장 불안해지는 순간은 언제인가요?"
  - "오늘 하나님께 맡기고 내려놓아야 할 염려는 무엇일까요?"

prayer: |
  하나님 아버지,
  어제의 하루를 지켜 주시고
  오늘까지 우리를 인도해 주셔서 감사합니다.

  놀라고 두려웠던 순간에도
  우리를 붙드시고 평안을 허락해 주심을 감사합니다.

  하나님,
  우리의 마음은 여전히 연약하고 조심스럽습니다.
  작은 변화에도 쉽게 흔들리고,
  미래를 미리 걱정하려 할 때가 많습니다.

  그럴 때마다
  오늘도 함께하시는 하나님을 바라보게 해 주세요.

  우리 부부가
  불안에 끌려가기보다,
  서로를 따뜻하게 붙들어 주며
  믿음 안에서 함께 걸어가게 하옵소서.

  감자의 작은 생명도
  주님의 선하신 손 안에 맡겨드립니다.

  필요한 건강과 평안을 허락해 주시고,
  하루하루를 감사함으로 살아가게 해 주세요.

  오늘 밤 우리 마음에
  깊은 쉼과 평안을 허락하여 주옵소서.

blessing: |
  하나님께서 오늘 우리 부부의 마음을 평안으로 지켜 주시고,
  감사와 신뢰 안에서 하루를 살아가게 하시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 5월 27일 수요일 가정예배"