title: "꺼지지 않는 불꽃 앞에서"
subtitle: "하나님과 함께, 그리고 서로 함께 누리는 교제의 기쁨"
date: "2026-08-09"

calling: |
  사랑의 하나님 아버지,
  주일의 마지막 시간에도 우리를 예배의 자리로 불러 주셔서 감사합니다.
  오늘 하루도 우리와 함께 걸어 주신 주님을 바라봅니다.
  우리의 마음을 열어 주시고,
  하나님과의 교제뿐 아니라 서로를 더욱 사랑하는 기쁨도 누리게 하옵소서.

verse1_title: "사도행전 2:42"
verse1: |
  그들이 사도의 가르침을 받아 서로 교제하고 떡을 떼며 오로지 기도하기를 힘쓰니라

verse2_title: "사도행전 2:46-47"
verse2: |
  날마다 마음을 같이하여 성전에 모이기를 힘쓰고 집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹고
  하나님을 찬미하며 또 온 백성에게 칭송을 받으니 주께서 구원 받는 사람을 날마다 더하게 하시니라

reflection: |
  오늘 주일 말씀의 제목은 '꺼지지 않는 불꽃 앞에서'였습니다. 출애굽기 3장에서 모세는 광야에서 이상한 광경을 보았습니다. 떨기나무에 불이 붙었는데, 그 나무가 사라지지 않았습니다. 모세가 가까이 다가가자 하나님께서 그를 부르셨습니다. 그리고 하나님은 "네가 선 곳은 거룩한 땅이니 네 발에서 신을 벗으라"고 말씀하셨습니다.

  하나님을 만나는 자리는 평범한 광야 한가운데에도 거룩한 자리가 될 수 있었습니다. 특별한 장소였기 때문이 아니라 하나님께서 그곳에 임하셨기 때문입니다.

  사도행전 2장의 초대교회도 그랬던 것 같습니다. 그들의 삶에는 대단히 특별한 공간이 있었던 것이 아닙니다. 함께 말씀을 듣고, 기도하고, 성전에 모이고, 집에서 함께 음식을 먹었습니다. 그런데 그 평범한 일상 가운데 하나님을 향한 기쁨이 있었습니다.

  특히 "집에서 떡을 떼며 기쁨과 순전한 마음으로 음식을 먹고"라는 말이 참 따뜻하게 다가옵니다. 믿음의 공동체가 반드시 무겁고 진지한 모습으로만 존재했던 것은 아닙니다. 함께 밥을 먹고 웃고 서로의 삶을 나누는 것도 하나님 안에서 누리는 교제였습니다.

  어쩌면 가정이라는 공간이야말로 우리가 가장 솔직한 모습으로 살아가는 곳인지도 모르겠습니다. 교회에서는 잘 웃다가도 집에서는 피곤한 모습을 보일 수 있고, 다른 사람에게는 친절하면서도 가까운 사람에게는 무심한 말을 할 때도 있습니다. 그래서 가정에서의 사랑은 생각보다 쉽지 않습니다. 가장 가까운 사람이기 때문에 오히려 더 많은 것을 기대하기 때문입니다.

  그렇지만 바로 그곳에서 하나님께서 우리를 조금씩 빚어 가십니다. 예배를 드리고 말씀을 읽는 것뿐 아니라, 함께 식사하고 이야기를 나누고 서로의 하루를 들어 주는 것까지도 하나님께서 사용하시는 교제의 시간이 될 수 있습니다.

  우리 부부가 매일 밤 가정예배를 드리는 것도 그런 의미가 있는 것 같습니다. 단순히 하루에 한 번 성경을 읽는 시간이 아니라, 서로의 마음을 하나님 앞에 함께 가져가는 시간입니다. 어떤 날은 많은 이야기를 나누고, 어떤 날은 짧게 예배하고 잠들 수도 있습니다. 중요한 것은 완벽한 모습이 아니라 하나님을 가운데 모시고 함께 걸어가는 것입니다.

  이제 우리 가정에는 감자라는 새로운 가족이 들어올 준비를 하고 있습니다. 지금은 아직 배 속에서 자라고 있지만, 언젠가는 우리와 함께 식탁에 앉아 밥을 먹고, 이야기를 듣고, 웃고, 함께 기도하게 될 것입니다. 지금 우리가 만들어 가는 가정의 분위기와 서로를 대하는 모습도 언젠가는 감자에게 자연스럽게 전달될 것입니다.

  그래서 부모가 된다는 것은 아이에게 무엇을 많이 가르치는 것만은 아닌 것 같습니다. 우리가 어떤 모습으로 살아가는지를 보여 주는 일이기도 합니다. 하나님을 사랑하는 모습, 서로를 존중하는 모습, 함께 웃는 모습, 힘든 날에도 다시 손을 잡는 모습. 그런 평범한 장면들이 한 아이에게는 아주 소중한 신앙의 기억이 될 것입니다.

  초대교회 사람들은 함께 모여 하나님을 찬미했고, 그들의 기쁨은 다른 사람들에게도 흘러갔습니다. 하나님과의 교제가 사람 사이의 교제로 이어지고, 그 교제가 다시 세상을 향한 사랑으로 이어졌습니다. 이것이 교회 공동체가 누리는 아름다운 모습일 것입니다.

  그리고 그 시작은 거창하지 않을 수 있습니다. 오늘 서로에게 따뜻한 말을 건네는 것, 함께 밥을 먹으며 웃는 것, 배우자의 이야기를 조금 더 들어 주는 것, 잠들기 전에 손을 잡고 기도하는 것. 하나님께서는 그런 작은 순간들을 통해 우리 가정을 하나님의 사랑이 머무는 자리로 만들어 가십니다.

  모세가 서 있던 광야의 떨기나무 앞에도 하나님이 계셨고, 초대교회의 평범한 식탁에도 하나님이 계셨습니다. 그렇다면 우리가 함께 살아가는 이 집과 오늘 드리는 이 예배의 자리에도 하나님께서 계십니다.

  오늘 밤 우리는 특별한 일을 해내지 않아도 됩니다. 하나님께서 우리 가운데 계심을 기억하면 됩니다. 그리고 서로를 바라보며 이렇게 생각하면 좋겠습니다.

  '하나님께서 우리 가정 가운데 함께 계시는구나.'
  '우리가 함께 예배할 수 있어서 참 감사하구나.'
  '내일도 하나님 안에서 함께 걸어가면 되겠구나.'

questions:
  - "우리 둘이 함께 있을 때 가장 편안하고 즐거운 순간은 언제인가요?"
  - "초대교회처럼 우리 집에서도 더 자주 누리고 싶은 기쁨은 무엇인가요?"
  - "감자가 자라면서 우리 가정에서 어떤 모습을 자연스럽게 보았으면 좋겠나요?"

prayer: |
  사랑의 하나님 아버지,
  평범한 우리의 일상 가운데 찾아와 주시고
  우리의 집을 하나님과 함께 살아가는 자리로 만들어 주셔서 감사합니다.

  우리 부부가 하나님과의 교제를 기쁨으로 누리게 하시고,
  서로의 마음을 더 잘 알아가며
  함께 웃고 함께 기도하는 시간을 소중히 여기게 하옵소서.

  사랑하는 아내의 하루를 주님께서 세밀하게 돌보아 주시고,
  몸과 마음에 평안을 더하여 주시며
  지금의 시간을 지나며 엄마가 되어 가는 기쁨도 충분히 누리게 하옵소서.

  우리에게 맡겨 주신 감자를 주님의 손에 올려 드립니다.
  보이지 않는 곳에서 자라고 있는 그 생명을 주님께서 친히 품어 주시고,
  하나님의 사랑 안에서 아름답게 빚어 가게 하옵소서.
  훗날 우리 가정의 식탁에서 함께 웃고 이야기하며
  하나님을 찬양하는 날까지 모든 걸음을 인도하여 주옵소서.

  우리 가정이 서로에게 편안한 안식처가 되게 하시고,
  우리의 식탁과 대화와 웃음 가운데에도 주님이 함께하여 주옵소서.
  교회 공동체와도 기쁨으로 교제하며
  받은 사랑을 다시 흘려보내는 가정이 되게 하옵소서.

  오늘도 하나님께서 우리와 함께하셨음을 기억하며,
  내일도 주님의 사랑 안에서 함께 걸어가게 하옵소서.

  우리 가운데 함께하시며 교제의 기쁨을 주시는
  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 8월 9일 일요일 가정예배"
