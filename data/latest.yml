title: "예상하지 못한 길에서도"
subtitle: "내가 생각한 순서와 다른 하나님의 일하심"
date: "2026-09-20"
calling: "오늘은 우리의 예상과 다른 모습으로 흘러가는 삶도 하나님께 맡기며 예배합니다."

verse1_title: "사람의 길을 넘어서"
verse1: "사람이 마음으로 자기의 길을 계획할지라도 그의 걸음을 인도하시는 이는 여호와시니라. (잠언 16:9)"

verse2_title: "베레스처럼"
verse2: "그의 형의 손이 다시 들어가고 그의 아우가 나오니 그의 이름을 베레스라 하였더라. (창세기 38:29)"

reflection: "창세기 38장에서 처음에는 세라가 먼저 나오는 것처럼 보였습니다. 손까지 먼저 나왔으니 당연히 그렇게 생각했을 것입니다. 그런데 예상과 달리 베레스가 먼저 태어났습니다. 성경에는 이런 식으로 사람이 예상한 순서와 실제 이야기가 달라지는 장면이 자주 나옵니다. 우리도 감자와 관련된 일을 겪으면서 앞으로 어떻게 될지 자꾸 예상하게 됩니다. 하지만 아직 우리가 모르는 것이 많습니다. 내가 생각한 순서대로 일이 흘러가지 않더라도, 그 자체를 두려워하기보다 하나님께 우리의 오늘과 내일을 맡기고 싶습니다."

questions:
  - "요즘 내가 미리 결론 내리고 있는 일은 무엇일까?"
  - "내 예상과 달라질 때에도 하나님을 신뢰하려면 무엇이 필요할까?"

prayer: "하나님, 우리가 알지 못하는 내일을 미리 걱정하지 않게 해주세요. 우리의 예상과 다른 일이 생기더라도 당황하지 않고 하나님을 바라보게 해주세요. 감자의 남은 검사 결과와 앞으로의 모든 과정도 인도해 주시고, 여보와 제가 하루하루 주어진 자리에서 평안히 걸어가게 해주세요. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 20일 일요일 가정예배"