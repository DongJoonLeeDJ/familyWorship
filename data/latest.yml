
title: "악을 멀리하고 선을 선택하기"

subtitle: "우리의 마음과 가정을 지키는 삶"

date: "2026-11-11"

calling: "하나님, 우리 마음과 가정이 악에서 멀어지고 선을 향하도록 주님 앞에 함께 나아갑니다."

verse1_title: "악은 모양이라도 버리라"

verse1: "“악은 어떤 모양이라도 버리라” (데살로니가전서 5:22)"

verse2_title: "멀리하는 것에서 시작되는 믿음"

verse2: "악은 언제나 큰 잘못이나 특별한 사건으로만 찾아오는 것은 아닙니다. 작은 거짓말과 무심한 말, 분노를 그대로 쏟아내는 태도처럼 일상 속에서도 나타날 수 있습니다. 악을 멀리한다는 것은 단순히 잘못을 피하는 데 그치지 않고, 하나님께서 기뻐하시는 선한 것을 선택하는 삶일 것입니다."

reflection: "우리는 때때로 잘못인 줄 알면서도 익숙하다는 이유로 같은 행동을 반복합니다. 하지만 작은 선택도 쌓이면 우리의 마음과 관계에 영향을 줍니다. 악을 멀리하기 위해서는 무엇을 하지 않을지만큼이나 무엇을 선택할지도 중요합니다. 거친 말 대신 부드러운 말을, 이기심 대신 배려를, 미움 대신 용서를 선택하는 것입니다. 우리 부부와 감자가 살아갈 가정에도 선한 말과 행동이 자리 잡기를 바랍니다."

questions:
  - "내가 무심코 반복하는 말이나 행동 중에서 멀리해야 할 것은 무엇인가요?"
  - "오늘 우리 가정에서 선을 선택하기 위해 실천할 수 있는 작은 일은 무엇일까요?"

prayer: "거룩하신 하나님, 우리 안에 있는 악한 생각과 습관을 돌아보게 하시고, 작은 잘못도 가볍게 여기지 않도록 도와주세요. 분노와 미움, 거짓과 이기심을 멀리하고 사랑과 정직과 배려를 선택하게 해주세요. 남편인 저부터 말과 행동을 조심하고 아내를 존중하며, 우리 가정에 선한 영향력을 흘려보내게 해주세요. 아내에게 건강과 기쁨을 더해주시고, 감자가 몸과 마음이 건강하게 자라도록 돌보아 주세요. 우리 세 사람이 주님의 은혜 안에서 악을 멀리하고 선을 행하는 삶을 살아가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 11일 수요일 가정예배"
