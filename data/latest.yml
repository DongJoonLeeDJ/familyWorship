title: "감사로 바라보는 세상"
subtitle: "모든 생명은 하나님의 선물입니다"
date: "2026-06-17"

calling: |
  생명을 주시고 오늘도 우리를 돌보시는 하나님께 감사하며 예배드립니다.
  받은 은혜를 기억하며 감사의 마음으로 주님 앞에 나아갑시다.

verse1_title: "데살로니가전서 5:16-18"
verse1: |
  항상 기뻐하라.
  쉬지 말고 기도하라.
  범사에 감사하라.
  이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라.

verse2_title: "시편 139:13-14"
verse2: |
  주께서 내 내장을 지으시며
  나의 모태에서 나를 만드셨나이다.
  내가 주께 감사하옴은 나를 지으심이 심히 기묘하심이라.

reflection: |
  감사는 특별한 일이 있을 때만 드리는 것이 아닙니다. 오히려 하나님께서 매일 베풀어 주시는 은혜를 발견하는 눈에서 시작됩니다.

  요즘 우리 가정에는 감사한 일들이 많이 있습니다. 아내는 입덧으로 힘든 가운데서도 아침을 챙겨 주고 있습니다. 당연하게 여길 수도 있는 일이지만, 사실은 사랑과 수고가 담긴 귀한 섬김입니다. 누군가를 위해 식사를 준비한다는 것은 생각보다 많은 에너지와 마음을 필요로 합니다. 그래서 오늘은 아내의 사랑에 감사하는 마음을 가져보면 좋겠습니다.

  또한 감자가 건강하게 자라고 있다는 사실도 큰 감사의 제목입니다. 처음에는 보이지도 않던 작은 생명이 이제는 점점 더 선명하게 보이고 있습니다. 심장이 뛰고, 자라가고, 하나님께서 정하신 때를 향해 한 걸음씩 나아가고 있습니다.

  최근에는 주변 사람들을 바라보는 시선도 조금 달라지는 것 같습니다. 길에서 만나는 사람들, 직장에서 스치는 사람들, 가족과 이웃들 모두가 누군가의 소중한 자녀이며 하나님께서 생명을 주신 존재라는 사실을 새롭게 깨닫게 됩니다.

  감자의 성장을 지켜보면서 생명이 얼마나 귀한 것인지 더욱 깊이 느끼게 됩니다. 그리고 그 깨달음은 우리로 하여금 다른 사람들도 더 소중하게 바라보게 만듭니다.

  하나님께서는 우리만 사랑하시는 분이 아니라 모든 사람을 사랑하시는 분이십니다. 오늘은 하나님께서 주신 생명의 귀함을 기억하며, 우리 가정에 베푸신 은혜뿐 아니라 주변 사람들을 향한 하나님의 사랑도 함께 생각해 보면 좋겠습니다.

  감사는 마음을 넓게 만듭니다. 
  
  또한 하나님께 감사한 일이 하나 더 있습니다. 어제까지만 해도 갑상선 수치 때문에 마음 한편에 걱정이 있었습니다. 과거의 아픈 경험 때문에 작은 검사 결과도 크게 느껴질 수 있었습니다. 그러나 전문의의 진료를 통해 현재 상태가 크게 염려할 수준은 아니며, 임신 중이기에 조금 더 세심하게 관리하는 과정이라는 설명을 듣게 되었습니다. 우리는 종종 모르는 부분을 가장 두려워합니다. 하지만 하나님께서는 필요한 때에 필요한 사람들을 통해 우리를 안심시키시고 인도하십니다. 오늘은 문제가 없다는 사실 자체보다도, 걱정 속에서도 우리를 붙드시고 평안을 주시는 하나님께 감사드립니다.
  
  오늘도 하나님께서 주신 감사의 제목들을 하나씩 떠올리며 하루를 마무리하면 좋겠습니다.

questions:
  - "오늘 내가 가장 감사한 일은 무엇인가요?"
  - "최근 생명의 소중함을 느끼게 된 순간은 언제였나요?"
  - "배우자에게 감사하다고 말하고 싶은 것은 무엇인가요?"

prayer: |
  사랑의 하나님,

  오늘도 우리 가정에 많은 은혜를 베풀어 주셔서 감사합니다.

  감자가 건강하게 자라게 하시고,
  오늘도 생명을 붙들어 주심에 감사드립니다.

  입덧으로 힘든 가운데서도 가정을 돌보고 아침을 챙겨 주는 아내에게 힘을 주시고,
  그 사랑과 수고를 기억하며 서로 더욱 감사하는 부부가 되게 하여 주옵소서.

  우리에게 생명의 소중함을 깨닫게 하시고,
  주변 사람들도 하나님의 귀한 형상으로 바라보게 하여 주옵소서.

  앞으로의 임신 기간도 주님의 손으로 인도하여 주시고,
  아내의 몸과 마음에 평안을 더하여 주옵소서.

  여러 선택과 고민들 앞에서 하나님의 뜻을 구하게 하시고,
  우리 가정을 가장 선한 길로 인도하여 주옵소서.

  남편에게는 더욱 따뜻한 배려와 사랑을 주시고,
  아내에게는 힘과 위로를 더하여 주시며,
  감자에게는 건강한 성장의 은혜를 허락하여 주옵소서.

  예수님의 이름으로 기도합니다.

  아멘.

footer: "2026년 6월 17일 수요일 가정예배"