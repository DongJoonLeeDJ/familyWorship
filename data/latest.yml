title: "사랑은 괴롭게 하지 않는 것"

subtitle: "가장 가까운 사람에게 먼저 드러나는 사랑"

date: "2026-11-07"

calling: "하나님, 우리 부부가 서로를 향한 사랑을 말뿐 아니라 일상의 태도와 행동으로 나타내도록 마음을 모아 예배합니다."

verse1_title: "남편들아, 아내를 사랑하라"

verse1: "“남편들아 아내를 사랑하며 괴롭게 하지 말라” (골로새서 3:19)"

verse2_title: "사랑이라는 이름으로 상처 주지 않기"

verse2: "바울은 남편에게 아내를 사랑하라고 권하면서, 동시에 아내를 괴롭게 하지 말라고 말합니다. 사랑은 마음속에 품고 있는 감정만이 아니라 상대방이 실제로 경험하는 말과 행동으로 드러나야 합니다."

reflection: "가장 가까운 사이라는 이유로 말과 행동을 함부로 해서는 안 됩니다. 내 의도가 사랑이었다고 해도 상대방이 두려움이나 상처를 느꼈다면 그 마음을 진지하게 돌아봐야 합니다. 특히 남편은 자신이 가정의 책임자라는 생각보다 아내를 어떻게 대하고 있는지를 먼저 살펴야 합니다. 아내가 존중받고 안전하다고 느낄 수 있도록 작은 말투와 행동부터 바꾸어 가는 것이 사랑의 시작일 것입니다."

questions:

- "내가 사랑이라고 생각하며 했던 말이나 행동이 오히려 아내를 힘들게 한 적은 없었나요?"
- "아내가 존중받고 편안하다고 느끼도록 오늘부터 실천할 수 있는 변화는 무엇일까요?"

prayer: "하나님, 사랑한다고 말하면서도 가까운 사람에게 상처를 주었던 모습을 돌아봅니다. 제 의도만 앞세우지 않고 아내가 실제로 느끼는 마음을 살피게 해주세요. 말과 감정을 절제하고, 잘못했을 때 변명하지 않으며, 행동으로 달라지는 남편이 되게 해주세요. 우리 부부가 서로를 존중하고 사랑하는 가정, 감자에게도 사랑을 보여주는 부모가 되도록 이끌어주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 7일 토요일 가정예배"