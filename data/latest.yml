title: "작은 고백의 밤"
subtitle: "해이해진 마음을 주께 고백함"
date: "2026-09-13"
calling: "함께 무릎 꿇고 잠시 숨을 고릅니다. 오늘의 솔직한 마음을 주께 올립니다."
verse1_title: "시편 139:13-14"
verse1: "주께서 내 내장을 지으시며 나를 모태에서 만드셨나이다 내가 주께 감사하옴은 나를 지으심이 심히 기묘하심이라 주의 행사가 기이함을 내 영혼이 잘 아나이다."
verse2_title: "빌립보서 4:6-7"
verse2: "아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로 너희 구할 것을 감사함으로 하나님께 아뢰라 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라."
reflection: >
  오늘은 스스로가 좀 해이해졌다는 고백으로 시작합니다. 검사와 기다림의 무게가 쌓이면서
  마음이 둔해지고, 기도 대신 일상에 파묻힌 날들이 있었음을 인정합니다. 동시에 과거의
  잘못들—남의 외모를 가볍게 판단했던 일들—이 떠올라 회개하게 됩니다. 그러나 지금의
  상황을 과거 죄에 대한 단순한 보응으로 단정하지 않겠습니다. 시편의 말처럼 한 생명은
  기묘하게 지음받았고, 빌립보서가 말하는 평강은 결과를 알기 전에도 우리 마음을 지킬 수
  있음을 기억합니다. 결과를 바라며 기도하되, 어떤 소식이 와도 서로 손을 놓지 않기로
  다짐합니다.
questions:
  - "오늘 내가 가장 솔직하게 고백하고 싶은 것은 무엇인가요?"
  - "결과를 기다리는 동안 서로에게 어떤 말이나 행동이 도움이 될까요?"
  - "지금 회개해야 할 한 가지는 무엇인가요?"
prayer: >
  주님, 오늘 제 마음의 게으름과 무심함을 고백합니다. 과거의 잘못들을 마주하게 하시니
  돌이키게 하시고, 서로를 향한 비난 대신 연민을 허락해 주세요. 아내의 회복과 감자의
  안전을 맡기며, 결과를 기다리는 동안 두려움 대신 담대함을 주소서. 어떤 소식이 와도
  서로를 붙들고 사랑으로 걸어가게 하소서. 아멘.
footer: "2026년 9월 13일 일요일 가정예배"
