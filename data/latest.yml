title: "마음에 새기는 이름"

subtitle: "하나님 앞에 선 사람으로 살아가기"

date: "2026-10-31"

calling: "하나님, 우리의 마음과 삶이 주님께 속한 사람답게 다듬어지도록 이끌어 주세요."

verse1_title: "여호와께 성결"

verse1: "그 패를 청색 끈으로 관 위에 매되 곧 관 전면에 있게 하라 이 패는 아론의 이마에 있어서 그가 이스라엘 자손이 거룩하게 드리는 성물과 관련된 죄책을 담당하게 하라 — 출애굽기 28:37-38 중"

verse2_title: "하나님 앞에 기억되는 이름"

verse2: "아론이 성소에 들어갈 때에는 이스라엘 아들들의 이름을 기록한 이 판결 흉패를 가슴에 붙여 여호와 앞에 영원한 기념을 삼을 것이니라 — 출애굽기 28:29"

reflection: "출애굽기 28장에는 제사장의 옷이 자세히 기록되어 있습니다. 아론의 이마에는 '여호와께 성결'이라는 글이 새겨지고, 가슴에는 이스라엘 지파들의 이름이 담긴 흉패가 놓입니다. 제사장은 하나님 앞에 거룩하게 서야 했고, 동시에 백성의 이름을 가슴에 품고 하나님께 나아갔습니다. 이 모습에서 하나님을 섬기는 일은 단지 맡은 역할을 수행하는 것이 아니라, 하나님 앞에서 자신을 돌아보고 다른 사람을 마음에 품는 일임을 생각하게 됩니다. 우리도 가정과 일터에서 각자의 역할을 감당할 때, 하나님 앞에 바른 마음을 지키고 곁에 있는 사람을 소중히 여기는 삶을 살아가면 좋겠습니다."

questions:

- "하나님 앞에서 우리의 마음과 태도를 돌아볼 때, 새롭게 다듬고 싶은 부분은 무엇인가요?"
- "오늘 우리 부부가 서로를 더 소중히 여기고 마음에 품기 위해 할 수 있는 작은 행동은 무엇일까요?"

prayer: "거룩하신 하나님, 제사장의 옷에 담긴 말씀을 통해 주님 앞에 서는 마음과 사람을 품는 책임을 생각합니다. 우리의 겉모습만이 아니라 마음과 행동도 주님께서 기뻐하시는 모습으로 다듬어 주세요. 각자의 역할과 책임을 감당하면서도 서로를 당연하게 여기지 않고, 배우자와 가족을 귀하게 여기게 해 주세요. 우리 부부가 주님 앞에서 정직하고 거룩하게 살아가며, 서로의 이름을 마음에 품고 사랑으로 돌보게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 31일 토요일 가정예배"