title: "하나님께서 보시는 자리"
subtitle: "사람의 평가보다 마음을 돌아보기"
date: "2026-09-22"
calling: "오늘은 다른 사람의 시선보다 하나님 앞에서 우리의 마음을 살펴봅니다."

verse1_title: "마음을 살피시는 하나님"
verse1: "사람은 외모를 보거니와 여호와는 중심을 보느니라. (사무엘상 16:7)"

verse2_title: "작은 일에 충성하기"
verse2: "지극히 작은 것에 충성된 자는 큰 것에도 충성되고. (누가복음 16:10)"

reflection: "우리는 하루를 살면서 다른 사람에게 어떻게 보이는지를 의식할 때가 많습니다. 하지만 하나님께서 보시는 것은 겉으로 드러난 모습만이 아니라 그 안에 있는 마음일 것입니다. 특별히 가족처럼 가까운 사람에게는 오히려 마음이 쉽게 드러납니다. 오늘 하루 거창한 일을 해내기보다, 서로에게 하는 작은 말 한마디와 작은 행동 하나를 정직하게 돌아보고 싶습니다. 하나님 앞에서 괜찮은 사람이 되려고 애쓰기보다, 하나님께 내 마음을 솔직하게 보여드리는 하루가 되면 좋겠습니다."

questions:
  - "오늘 내가 사람에게 보이기 위해 했던 행동은 무엇이었을까?"
  - "가장 가까운 사람에게 나는 어떤 마음으로 대하고 있을까?"

prayer: "하나님, 사람의 평가에 마음이 흔들리지 않고 주님 앞에서 제 마음을 정직하게 돌아보게 해주세요. 우리 부부가 가까운 사이일수록 서로를 함부로 대하지 않게 하시고, 작은 말과 행동에서도 사랑을 선택하게 해주세요. 감자에게도 좋은 부모가 되도록 우리의 마음을 다듬어 주세요. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 22일 화요일 가정예배"