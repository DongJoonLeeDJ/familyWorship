title: "하나님께서 보시는 마음"
subtitle: "하나님은 우리의 겉모습보다 마음을 새롭게 하시기를 원하십니다"
date: "2026-07-08"

calling: |
  사랑의 하나님 아버지,
  오늘도 우리 가정을 예배의 자리로 불러 주심에 감사합니다.
  우리의 겉모습이 아니라 마음을 살피시는 주님 앞에
  정직한 마음으로 나아가게 하옵소서.

verse1_title: "잠언 27장 19절"
verse1: |
  물에 비치면 얼굴이 서로 같은 것 같이 사람의 마음도 서로 비치느니라
  (물이 사람의 얼굴을 비춰 주는 것처럼 사람의 마음이 사람을 비춰 준다.)
verse2_title: "누가복음 6장 45절"
verse2: |
  선한 사람은 마음에 쌓은 선에서 선을 내고
  악한 자는 그 쌓은 악에서 악을 내나니
  이는 마음에 가득한 것을 입으로 말함이니라.
  (선한 사람은 그 마음에 쌓은 선에서 선을 내고,
  악한 사람은 그 마음에 쌓은 악에서 악을 낸다.)

reflection: |
  1. 함께 읽기 
  오늘 말씀은 한 문장뿐입니다. 
  그런데 읽고 나면 이런 질문이 생깁니다. 
  "사람의 마음이 사람을 비춰 준다"는 게 무슨 뜻일까요? 
  거울은 얼굴을 보여 줍니다. 
  그런데 하나님은 "마음이 그 사람을 보여 준다"고 말씀하십니다.
  왜 얼굴이 아니라 마음일까요? 
  2. 함께 생각해 보기
  우리는 사람을 볼 때 무엇을 먼저 볼까요?
  말을 잘하는지, 예의가 있는지, 능력이 있는지, 성공했는지. 하지만 그것들은 모두 겉으로 보이는 것입니다.
  그런데 성경은 조금 다른 이야기를 합니다.
  "그 사람의 마음을 보면 그 사람이 보인다."
  왜 그럴까요?
  3. 성경을 연결해 보기
  예수님도 비슷한 말씀을 하셨습니다.
  "선한 사람은 그 마음에 쌓은 선에서 선을 내고,
  악한 사람은 그 마음에 쌓은 악에서 악을 낸다."
  즉 말과 행동은 갑자기 생기는 것이 아니라, 
  이미 마음속에 있던 것이 밖으로 흘러나오는 것입니다.
  그러면 우리가 화를 낼 때도, 불평할 때도, 감사할 때도, 
  사실은 그 순간 새로 만들어진 것이 아니라 마음속에 있던 것이 드러난 것일 수 있습니다. 
  4. 한 가지 질문
  여기서 한 가지 질문이 있습니다. 
  만약 하나님께서 오늘 우리의 마음을 그대로 보여 주신다면, 
  우리는 어떤 사람으로 보일까요? 
  조금 두려운 질문입니다. 
  왜냐하면 우리는 행동은 숨길 수 있어도 마음은 숨길 수 없기 때문입니다. 
  그런데 복음은 여기에서 끝나지 않습니다. 
  하나님은 우리의 마음을 정죄하시려고 보시는 분이 아니라, 새롭게 하시려고 보시는 분입니다. 
  그래서 하나님은 행동을 조금 고치는 것보다 마음을 새롭게 하기를 원하십니다. 
  5. 우리 가정에 적용하기
  오늘 하루를 돌아보면 내가 했던 말은 내 마음을 잘 보여 주었는가?
  내 마음에는 감사가 더 많았는가, 불평이 더 많았는가? 하나님께서 오늘 내 마음을 보셨을 때 가장 기뻐하셨을 부분은 무엇일까?
  반대로 하나님께 맡기고 변화되기를 원하는 마음은 무엇일까?

questions:
  - "오늘 내 말과 행동은 내 마음을 어떻게 보여 주었나요?"
  - "하나님께서 오늘 내 마음을 보셨을 때 가장 기뻐하셨을 부분은 무엇일까요?"
  - "감사와 사랑, 신뢰로 채워지기 위해 오늘 하나님께 맡기고 싶은 마음은 무엇인가요?"

prayer: |
 하나님 아버지. 우리는 겉모습을 꾸미는 데는 익숙하지만, 
 마음을 살피는 데는 서툴 때가 많습니다. 
 오늘 말씀처럼 우리의 마음이 우리 자신을 드러낸다는 사실을 기억하게 해 주세요. 
 감사하는 마음, 사랑하는 마음, 
 하나님을 신뢰하는 마음을 우리 안에 더욱 채워 주시고, 
 두려움과 교만, 원망은 주님께 맡기게 해 주세요. 
 우리 가정이 겉으로만 믿음 있는 가정이 아니라, 
 마음까지 주님을 닮아 가는 가정이 되게 하옵소서. 
 예수님의 이름으로 기도합니다.
 아멘.

footer: "2026년 7월 8일 수요일 가정예배"
