title: "오늘도 우리를 붙드시는 하나님"
subtitle: "결과보다 먼저 함께하시는 주님을 바라보며"
date: "2026-05-20"

verse1_title: "시편 121:5-7"
verse1: |
  여호와는 너를 지키시는 이시라
  여호와께서 네 오른쪽에서 네 그늘이 되시나니
  낮의 해가 너를 상하게 하지 아니하며
  밤의 달도 너를 해치지 아니하리로다
  여호와께서 너를 지켜 모든 환난을 면하게 하시며
  또 네 영혼을 지키시리로다

verse2_title: "빌립보서 4:6-7"
verse2: |
  아무 것도 염려하지 말고
  다만 모든 일에 기도와 간구로,
  너희 구할 것을 감사함으로 하나님께 아뢰라
  그리하면 모든 지각에 뛰어난 하나님의 평강이
  그리스도 예수 안에서 너희 마음과 생각을 지키시리라

reflection: |
  우리는 아직 모든 것을 본 상태가 아닙니다.
  기다림의 시간도 남아 있고,
  조심스러운 마음도 여전히 있습니다.

  그러나 오늘 말씀은
  하나님께서 단지 "결과"를 지켜보시는 분이 아니라,
  우리 곁에서 우리를 지키시는 분이라고 말합니다.

  하나님은 우리가 평안한 날에만 함께하시는 분이 아니라,
  마음이 흔들리는 순간에도
  조용히 우리를 붙들어 주십니다.

  그래서 믿음은
  미래를 다 아는 상태가 아니라,
  오늘 하루를 하나님께 맡기며 살아가는 태도인지도 모릅니다.

  지금 우리의 마음속에는
  감사와 기대,
  그리고 조심스러움이 함께 존재합니다.
  하나님은 그 모든 마음을 아십니다.

  우리는 억지로 담대해질 필요도,
  스스로 미래를 책임지려 애쓸 필요도 없습니다.
  오늘 해야 할 작은 순종과 감사,
  그리고 서로를 아껴주는 마음으로 충분합니다.

  하나님께서 오늘도 우리의 마음과 생각을 지키시며,
  부부의 하루 가운데 평안을 주시기를 바랍니다.

questions:
  - "오늘 하루 하나님께 맡기고 싶은 마음의 짐은 무엇인가요?"
  - "최근 서로에게 가장 감사했던 순간은 언제였나요?"
  - "결과를 기다리는 시간 속에서 하나님께서 주시는 평안은 어떤 모습일까요?"

prayer: |
  하나님 아버지,
  오늘도 우리 부부를 붙드시고 함께해 주셔서 감사합니다.

  마음속에 감사와 기대가 있지만,
  동시에 조심스럽고 작은 염려도 있음을 주님께 올려드립니다.

  우리의 마음이 결과와 상황에만 매이지 않게 하시고,
  오늘 함께하시는 하나님을 바라보게 해 주세요.

  아직 보이지 않는 시간들도
  주님의 손 안에 있음을 믿게 하시고,
  하루하루를 평안 가운데 살아가게 해 주세요.

  우리 부부가 서로를 더 따뜻하게 품게 하시고,
  말과 태도 속에 사랑과 배려가 있게 하옵소서.

  작은 생명도 주님의 선하신 돌보심 안에 맡겨드립니다.
  예수님의 이름으로 기도합니다.
  아멘.

blessing: |
  하나님께서 오늘 우리 부부의 마음과 생각을 지켜주시고,
  불안보다 평안을,
  조급함보다 신뢰를 더 크게 허락해 주시기를 바랍니다.

footer: "2026년 5월 20일 수요일 가정예배"