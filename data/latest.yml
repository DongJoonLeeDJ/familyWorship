title: "아직 결과를 기다리는 자리에서"

subtitle: "출애굽기 4장, 하나님이 아시는 우리의 마음"

date: "2026-10-08"

calling: "오늘은 병원에 다녀왔습니다. 임당검사도 무사히 마쳤지만 결과는 모레, 양수검사 3차 결과는 다음 주에 나온다고 합니다. 감자의 미세음경 소견은 여전히 남아 있지만, 크기도 잘 자라고 있고 뇌의 주름을 비롯한 전반적인 발달도 적절하게 잘 이루어지고 있다고 들었습니다. 좋은 소식과 아직 기다려야 하는 소식이 한날에 함께 있습니다."

verse1_title: "출애굽기 4장 10절"

verse1: "모세가 여호와께 아뢰되 오 주여 나는 본래 말을 잘하지 못하는 자라 주께서 주의 종에게 명령하신 후에도 그러하니 나는 입이 뻣뻣하고 혀가 둔한 자니이다"

verse2_title: "출애굽기 4장 12절"

verse2: "이제 가라 내가 네 입과 함께 있어서 할 말을 가르치리라"

reflection: "모세는 하나님께서 가라고 하셔도 계속 자신이 부족한 이유를 이야기합니다. 하나님은 그런 모세를 나무라기보다 그의 부족함을 아시면서도 함께 가겠다고 말씀하십니다. 오늘 우리도 병원에서 여러 이야기를 듣고 돌아왔습니다. 잘 자라고 있다는 말을 들은 것은 참 감사하지만, 아직 결과를 기다려야 하는 것들도 있습니다. 아마 결과가 모두 나올 때까지 마음이 완전히 편해지지는 않을 것 같습니다. 그렇다고 아직 오지 않은 결과까지 미리 살아갈 필요는 없겠습니다. 오늘 들은 좋은 소식은 오늘의 감사로 받아들이고, 아직 모르는 것은 모르는 채로 두면서 다음 결과를 기다리는 것. 지금 우리에게는 그것도 믿음의 한 모습일 것 같습니다."

questions:
  - "오늘 병원에서 들은 이야기 가운데 내가 가장 감사했던 것은 무엇이었을까?"
  - "아직 알 수 없는 결과를 기다리는 동안 우리 부부가 서로에게 해주고 싶은 말은 무엇일까?"

prayer: "하나님, 오늘 병원에 다녀온 시간을 지켜주셔서 감사합니다. 임당검사를 무사히 마치게 하시고, 감자가 잘 자라고 있으며 여러 발달 과정도 적절하게 이루어지고 있다는 소식을 들을 수 있어 감사드립니다. 아직 미세음경에 대한 걱정이 남아 있고 임당검사와 양수검사 결과도 기다려야 하지만, 오지 않은 결과를 미리 걱정하며 오늘의 시간을 잃지 않게 해주세요. 좋은 소식은 감사히 받아들이고, 걱정되는 부분은 숨기지 않고 주님께 말씀드리며, 결과가 나올 때까지 우리 부부가 서로의 마음을 잘 살필 수 있게 해주세요. 감자를 바라보며 생기는 기대와 걱정 모두를 주님 앞에 내려놓습니다. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 8일 목요일 가정예배"