title: "실수보다 크신 은혜"
subtitle: "우리의 연약함을 아시고 품어 주시는 하나님"
date: "2026-06-10"

calling: |
  오늘 하루도 우리를 붙드시고 감자의 생명을 지켜 주신 하나님께 감사하며 예배드립니다.
  우리의 부족함과 실수까지도 아시는 주님 앞에 평안한 마음으로 나아갑시다.

verse1_title: "시편 103:13-14"
verse1: |
  아버지가 자식을 긍휼히 여김 같이 여호와께서는 자기를 경외하는 자를 긍휼히 여기시나니
  이는 그가 우리의 체질을 아시며 우리가 단지 먼지뿐임을 기억하심이로다.

verse2_title: "예레미야애가 3:22-23"
verse2: |
  여호와의 인자와 긍휼이 무궁하시므로 우리가 진멸되지 아니함이니이다.
  이것들이 아침마다 새로우니 주의 성실하심이 크시도소이다.

reflection: |
  어제는 예상하지 못한 일이 있었다. 아내가 주사와 질정을 차 안에 두어 약이 손상되었고, 결국 다시 병원에 가서 약을 받아야 하게 되었다. 적지 않은 비용도 들고, 무엇보다 마음이 많이 무거웠을 것이다.

  우리는 중요한 일을 앞두고 실수하면 더욱 크게 낙심하곤 한다. 특히 임신 초기처럼 모든 것이 조심스러운 시기에는 작은 일 하나도 크게 느껴질 수 있다.

  그러나 오늘 말씀은 하나님께서 우리의 체질을 아신다고 말한다. 하나님은 우리가 연약한 사람이라는 것을 모르시는 분이 아니다. 피곤할 때 실수할 수 있다는 것도, 마음이 흔들릴 수 있다는 것도, 평소보다 감정이 예민해질 수 있다는 것도 이미 알고 계신다.

  지금까지의 여정을 돌아보면 하나님께서는 우리의 완벽함 때문에 감자를 여기까지 인도하신 것이 아니었다. 출혈이 있었던 날에도, 피고임으로 걱정했던 날에도, 심장박동을 확인했던 날에도, 그리고 어제처럼 예상치 못한 실수가 있었던 날에도 하나님은 여전히 우리와 함께하셨다.

  감자의 심장 소리를 들은 기쁨도 여전히 변하지 않았다. 남아 있는 치료 과정도 하나님의 손 안에 있다. 오늘은 실수에 시선을 고정하기보다 지금까지 인도하신 은혜를 기억하며 감사하는 하루가 되기를 바란다.

questions:
  - "최근 하나님께서 우리 가정에 베풀어 주신 가장 큰 은혜는 무엇이었나요?"
  - "어제의 일을 통해 하나님께 맡겨야 할 걱정은 무엇인가요?"
  - "오늘 배우자에게 해 주고 싶은 격려의 말은 무엇인가요?"

prayer: |
  사랑의 하나님,

  오늘도 감자의 생명을 지켜 주시고 여기까지 인도해 주셔서 감사합니다.
  어제 있었던 일로 아내의 마음이 무거웠을 수 있지만, 실수보다 크신 하나님의 은혜를 바라보게 하여 주옵소서.

  우리의 연약함을 아시는 주님께서 아내의 몸과 마음을 위로하여 주시고, 남아 있는 피고임이 잘 흡수되게 하시며 출혈 문제가 완전히 회복되게 하여 주옵소서.
  감자가 건강하게 자라게 하시고 남은 주사 치료도 잘 마무리되게 하여 주옵소서.

  남편에게는 사랑과 인내를 주셔서 아내를 잘 섬기게 하시고, 우리 부부가 두려움보다 하나님을 더욱 신뢰하게 하여 주옵소서.
  앞으로의 분만병원 선택 과정에도 지혜를 더하여 주옵소서.

  하나님께서 오늘도 아내에게 평안과 위로를 주시고, 감자에게 건강한 성장의 은혜를 허락하시기를 축복합니다.

  예수님의 이름으로 기도합니다.

  아멘.

footer: "2026년 6월 10일 수요일 가정예배"