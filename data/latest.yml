title: "하나님의 마음을 알다"

subtitle: "자비롭고 은혜로우신 하나님"

date: "2026-11-06"

calling: "하나님의 성품을 기억하며, 그 사랑과 은혜 앞에 겸손히 나아갑니다."

verse1_title: "하나님을 소개하시는 하나님"

verse1: "“여호와라 여호와라 자비롭고 은혜롭고 노하기를 더디하고 인자와 진실이 많은 하나님이라” (출애굽기 34:6)"

verse2_title: "다시 기회를 주시는 은혜"

verse2: "이스라엘은 금송아지를 만들어 하나님을 배반했지만, 하나님은 모세에게 다시 돌판을 주시고 언약을 새롭게 하셨습니다. 하나님은 자신의 이름을 선포하시며 자비와 은혜가 풍성한 분임을 알려주셨습니다."

reflection: "하나님은 우리의 잘못을 모른 척하시는 분이 아니지만, 한 번의 실패로 우리를 포기하지도 않으십니다. 출애굽기 34장에서 하나님은 자신을 자비롭고 은혜로운 분으로 소개하십니다. 우리도 서로의 부족함을 대할 때 잘못을 외면하지 않으면서도, 다시 시작할 기회를 주는 마음을 배워가면 좋겠습니다."

questions:

- "하나님께서 우리에게 다시 기회를 주셨다고 느꼈던 순간이 있나요?"
- "서로의 실수나 부족함을 마주할 때, 어떤 태도를 조금씩 바꾸면 좋을까요?"

prayer: "자비롭고 은혜로우신 하나님, 우리의 부족함을 아시면서도 다시 주님께 나아갈 길을 열어주셔서 감사합니다. 받은 은혜를 잊지 않고, 우리도 서로에게 너그럽고 진실한 사람이 되게 해주세요. 잘못을 인정할 때는 겸손하게 인정하고, 다시 시작할 때는 사랑으로 서로를 격려하게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 6일 금요일 가정예배"