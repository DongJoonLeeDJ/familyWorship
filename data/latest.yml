title: "두려움보다 크신 하나님!"
subtitle: "염려를 기도로 바꿀 때 하나님께서 평안을 주십니다"
date: "2026-07-03"

calling: |
  사랑의 하나님 아버지,
  오늘도 우리 가정을 지켜 주시고 함께 예배드리게 하심에 감사합니다.
  우리의 마음을 두려움이 아니라 주님께 향하게 하옵소서.

verse1_title: "시편 3편 6절"
verse1: |
  천만인이 나를 에워싸 진친다 하여도
  나는 두려워하지 아니하리이다.

verse2_title: "빌립보서 4장 6-7절"
verse2: |
  아무 것도 염려하지 말고
  다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라.
  그리하면 모든 지각에 뛰어난 하나님의 평강이
  그리스도 예수 안에서 너희 마음과 생각을 지키시리라.

reflection: |
  살아가다 보면 실제로 '천만인'에게 둘러싸일 일은 거의 없습니다.
  그러나 마음속에는 여러 가지 염려와 부담이 한꺼번에 밀려올 때가 있습니다.
  미래에 대한 걱정, 해야 할 일, 가족을 향한 책임감은 우리의 마음을 무겁게 만들기도 합니다.

  다윗도 큰 위기 속에 있었습니다.
  하지만 그는 주변의 상황보다 하나님을 더 크게 바라보며
  "나는 두려워하지 아니하리이다"라고 고백했습니다.
  두려움이 없어서가 아니라,
  하나님께서 자신을 붙들고 계심을 믿었기 때문입니다.

  우리도 부모가 되어 가는 과정 속에서
  여러 준비를 하고, 앞으로의 진료와 출산을 생각하며
  염려가 생길 때가 있습니다.
  하지만 하나님께서는 지금까지 감자를 건강하게 자라게 하셨고,
  우리 가정을 한 걸음씩 인도해 오셨습니다.

  하나님은 아직 오지 않은 내일보다
  오늘 우리와 함께하시는 분입니다.
  염려를 마음속에만 품지 말고 기도로 올려드릴 때,
  하나님께서는 상황이 즉시 바뀌지 않더라도
  우리의 마음을 평강으로 지켜 주십니다.

  오늘도 두려움보다 하나님을 더 크게 바라보며,
  주님께서 우리 가정을 끝까지 선하게 인도하실 것을 신뢰하는 하루가 되기를 소망합니다.

questions:
  - "지금 하나님께 맡기고 싶은 가장 큰 염려는 무엇인가요?"
  - "지금까지 하나님께서 우리 가정을 지켜 주셨던 순간 중 가장 기억에 남는 것은 무엇인가요?"
  - "오늘 평안을 누리기 위해 하나님께 어떤 기도를 드리고 싶나요?"

prayer: |
  사랑의 하나님 아버지,
  우리의 마음을 아시고 언제나 함께하여 주심에 감사합니다.

  두려움과 염려가 찾아올 때마다
  그것을 하나님께 맡기고 기도로 나아가게 하옵소서.
  우리 마음을 세상이 줄 수 없는 평안으로 지켜 주옵소서.

  지금까지 감자를 건강하게 자라게 하시고
  우리 가정을 신실하게 인도하여 주심에 감사합니다.
  앞으로의 모든 진료와 출산의 과정도
  주님의 선하신 손길 가운데 맡겨 드립니다.

  아내를 오늘도 사랑으로 보호하여 주시고,
  몸과 마음에 힘과 평안을 더하여 주옵소서.
  감자도 건강하게 자라며
  주님의 은혜 가운데 안전하게 보호하여 주옵소서.

  우리 부부가 어떤 상황에서도
  하나님을 신뢰하며 서로를 격려하는 믿음의 가정이 되게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 3일 금요일 가정예배"
