title: "비공식적 선교사"
subtitle: "우리의 평범한 자리도 하나님께서 사용하십니다"
date: "2026-08-23"

calling: |
  오늘은 주일입니다.
  하나님께서 우리를 어디에서, 어떤 모습으로 사용하시는지 잠시 생각해 보겠습니다.
  특별한 일을 하는 사람만 하나님의 일에 쓰임받는 것이 아니라는 사실을 기억하며 예배하겠습니다.

verse1_title: "루디아에게 열리다"
verse1: |
  사도행전 16:14-15
  두아디라 시에 있는 자색 옷감 장사로서 하나님을 섬기는 루디아라 하는 한 여자가 말을 듣고 있을 때에
  주께서 그 마음을 열어 바울의 말을 따르게 하신지라
  그와 그 집이 다 세례를 받고 우리에게 청하여 이르되
  만일 나를 주 믿는 자로 알거든 내 집에 들어와 유하라 하고 강권하여 머물게 하니라

verse2_title: "복음은 일상으로 들어옵니다"
verse2: |
  사도행전 16:15
  그와 그 집이 다 세례를 받고 우리에게 청하여 이르되
  만일 나를 주 믿는 자로 알거든 내 집에 들어와 유하라 하고 강권하여 머물게 하니라

reflection: |
  루디아는 바울처럼 복음을 전하기 위해 먼 곳을 다니던 사람이 아니었습니다. 그는 자색 옷감을 파는 사람이었고, 자신의 삶의 자리에서 하나님을 섬기던 사람이었습니다. 그런데 하나님께서는 그 평범한 자리를 통해 복음의 길을 열어 가셨습니다.

  루디아가 복음을 들은 뒤 가장 먼저 한 일도 특별한 사역을 시작하는 것이 아니었습니다. 자기 집을 열어 하나님의 사람들을 맞이했습니다. 자신의 직업과 집, 그리고 자신에게 주어진 평범한 환경이 복음을 위한 자리가 되었습니다.

  "비공식적 선교사"라는 말도 이런 의미로 생각해 볼 수 있겠습니다. 선교사라는 직함이 없어도 내가 있는 곳에서 사람을 대하고, 친절을 베풀고, 믿음을 살아내고, 누군가를 따뜻하게 맞이하는 것 역시 하나님께서 사용하실 수 있습니다.

  우리도 마찬가지입니다. 직장에서 보내는 시간, 집에서 서로를 대하는 모습, 앞으로 감자를 돌보며 살아갈 평범한 하루까지 모두 하나님께서 일하실 수 있는 자리입니다. 우리가 매 순간 거창한 일을 해야 하는 것은 아닙니다. 오늘 내 곁에 있는 사람을 사랑하는 것부터 하나님께서 사용하실 수 있습니다.

  그리고 본문에서 중요한 분은 결국 하나님이십니다. "주께서 그 마음을 열어" 루디아가 말씀을 받아들이게 하셨습니다. 우리의 역할은 모든 사람을 변화시키는 것이 아니라, 하나님께서 맡기신 자리에서 충실하게 살아가는 것입니다.

  그러니 우리도 너무 큰 일을 해야 한다는 부담을 갖기보다, 오늘 하나님께서 우리에게 맡기신 평범한 자리를 소중히 살아가면 좋겠습니다. 우리의 작은 친절과 사랑도 주님께서 복음의 통로로 사용하실 수 있기 때문입니다.

questions:
  - "내가 지금 살아가는 자리에서 하나님께서 사용하실 수 있는 모습은 무엇일까요?"
  - "우리 집과 일상이 누군가에게 어떤 따뜻한 자리가 될 수 있을까요?"
  - "이번 한 주에 내가 자연스럽게 실천할 수 있는 작은 사랑은 무엇인가요?"

prayer: |
  하나님, 특별한 사람이 되어야만 주님께 쓰임받는 것이 아님을 기억하게 해 주세요.
  오늘 우리가 살아가는 자리와 만나는 사람들을 소중히 여기게 하시고, 작은 친절과 사랑도 주님께 맡기게 해 주세요.
  아내와 제가 가정에서 서로를 대하는 모습에도 예수님의 사랑이 드러나게 하시고, 앞으로 감자와 함께 살아갈 우리의 일상도 주님께서 선하게 사용해 주세요.
  우리의 삶을 통해 필요한 곳에 복음의 향기가 흘러가게 하시되, 모든 일을 이루시는 분은 하나님이심을 잊지 않게 해 주세요.
  예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 8월 23일 주일 가정예배"
