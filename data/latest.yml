title: "지금까지 인도하신 하나님"
subtitle: "지난 은혜를 기억하며 새로운 걸음을 맡깁니다"
date: "2026-07-01"

calling: |
  사랑의 하나님 아버지,
  새로운 달을 허락하시고 오늘도 우리 가정이 함께 예배드리게 하심에 감사합니다.
  지나온 은혜를 기억하며 앞으로의 걸음도 주님께 맡기게 하옵소서.

verse1_title: "사무엘상 7장 12절"
verse1: |
  사무엘이 돌을 취하여 미스바와 센 사이에 세워 이르되
  여호와께서 여기까지 우리를 도우셨다 하고
  그 이름을 에벤에셀이라 하니라.

verse2_title: "시편 126편 3절"
verse2: |
  여호와께서 우리를 위하여 큰일을 행하셨으니
  우리는 기쁘도다.

reflection: |
  어느덧 올해의 절반이 지나 새로운 달을 맞이했습니다.
  시간을 돌아보면 하나님께서는 하루하루 우리를 신실하게 인도해 주셨습니다.

  무엇보다 올해 하나님께서는 우리 가정에 큰 선물을 허락해 주셨습니다.
  오랫동안 기도하며 기다렸던 감자가 엄마의 뱃속에서 건강하게 자라고 있고,
  여러 검사와 치료의 과정을 지나 지금까지 안전하게 인도해 주셨습니다.

  내일은 분만병원에서 첫 기형아 검사를 받게 될 예정입니다.
  아직 결과를 알 수는 없지만,
  지금까지 우리를 도우셨던 하나님께서 앞으로의 걸음도 함께하실 것을 믿으며
  담담한 마음으로 맡겨 드리면 좋겠습니다.

  또한 올해는 결혼 10주년을 맞이한 해이기도 합니다.
  지난 시간 동안 기쁠 때도, 어려울 때도 하나님께서 우리 부부를 붙드시고
  함께 걸어오게 하셨습니다.
  그 사랑의 열매로 감자를 품게 된 오늘은 더욱 감사한 시간입니다.

  오늘은 지나온 은혜를 기억하며 감사하고,
  내일의 일은 하나님께 맡기며 평안히 쉬는 하루가 되기를 소망합니다.

questions:
  - "올해 상반기를 돌아볼 때 가장 감사한 하나님의 은혜는 무엇인가요?"
  - "내일 병원 방문을 하나님께 어떻게 맡기고 싶나요?"
  - "결혼 생활 속에서 하나님께 가장 감사한 한 가지는 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  올해 상반기 동안 우리 가정을 한순간도 떠나지 않으시고
  여기까지 인도하여 주심에 진심으로 감사드립니다.

  무엇보다 감자라는 귀한 생명을 선물로 허락하시고,
  지금까지 건강하게 자라도록 지켜 주심에 감사합니다.

  내일 있을 첫 기형아 검사를 주님의 손에 올려드립니다.
  의료진에게 지혜를 주시고,
  검사 과정과 결과를 모두 주님께서 선하게 인도하여 주옵소서.
  우리 부부의 마음에도 불안보다 평안을 허락하여 주옵소서.

  아내의 몸을 오늘도 강건하게 붙드시고,
  입덧 가운데서도 필요한 힘과 위로를 더하여 주시며,
  감자를 안전하게 보호하시고 건강하게 자라게 하옵소서.

  결혼 이후 지금까지 함께하신 하나님께 감사드리며,
  앞으로도 우리 부부가 서로를 더욱 사랑하고,
  하나님을 신뢰하는 믿음의 가정으로 살아가게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 1일 수요일 가정예배"