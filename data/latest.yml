title: "우리의 연약함을 아시는 하나님"
subtitle: "힘든 날에도 함께하시는 주님"
date: "2026-06-13"

calling: |
  우리의 형편을 아시고 연약함을 돌보시는 하나님께 감사하며 예배드립니다.
  오늘도 우리와 함께하시는 주님의 은혜를 바라보며 평안한 마음으로 나아갑시다.

verse1_title: "시편 103:13-14"
verse1: |
  아버지가 자식을 긍휼히 여김 같이 여호와께서는 자기를 경외하는 자를 긍휼히 여기시나니
  이는 그가 우리의 체질을 아시며 우리가 단지 먼지뿐임을 기억하심이로다.

verse2_title: "히브리서 4:15-16"
verse2: |
  우리에게 있는 대제사장은 우리의 연약함을 동정하지 못하실 이가 아니요
  모든 일에 우리와 똑같이 시험을 받으신 이로되 죄는 없으시니라.
  그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라.

reflection: |
  임신은 기쁜 일이지만 동시에 몸에는 큰 변화가 일어나는 시간입니다. 특히 입덧은 눈에 잘 보이지 않지만 하루 종일 사람을 지치게 만들곤 합니다. 먹고 싶은 것이 없어지고, 평소에는 괜찮던 냄새가 힘들어지기도 하며, 이유 없이 속이 불편해질 때도 있습니다.

  때로는 "왜 이렇게 힘들지?"라는 생각이 들 수도 있습니다. 그러나 오늘 말씀은 하나님께서 우리의 체질을 아신다고 말씀합니다. 하나님은 우리가 강한 척하며 버티기를 원하시는 분이 아닙니다. 오히려 우리의 연약함을 아시고, 필요한 은혜를 공급하시는 분이십니다.

  감자가 자라고 있다는 사실은 눈에 잘 보이지 않을 때가 많습니다. 하지만 지금 아내의 몸에서 일어나는 변화들은 새로운 생명이 자라가고 있다는 과정의 일부이기도 합니다. 힘든 하루를 보내고 있다는 사실이 결코 헛된 시간이 아니라는 뜻입니다.

  하나님께서는 오늘도 감자를 자라게 하시고, 아내의 몸을 붙드시며, 우리 가정을 돌보고 계십니다. 우리가 할 수 있는 일은 모든 불편함을 억지로 견디려 하기보다 필요한 도움을 받고, 서로를 위로하며, 하나님께 힘을 구하는 것입니다.

  오늘은 "잘 버텨야 한다"는 생각보다 "하나님께서 오늘도 함께하신다"는 사실을 기억하면 좋겠습니다. 주님은 우리의 기쁨뿐 아니라 힘겨운 순간도 함께 걸어가시는 분이십니다.

questions:
  - "오늘 가장 감사했던 순간은 무엇이었나요?"
  - "요즘 가장 힘든 부분은 무엇이며, 배우자는 어떻게 도와줄 수 있을까요?"
  - "하나님께서 우리 가정을 돌보고 계심을 느꼈던 순간이 있었나요?"

prayer: |
  사랑의 하나님,

  오늘도 우리 가정을 지켜 주시고 감자의 생명을 자라게 하심에 감사드립니다.

  특별히 입덧으로 힘들어하는 아내를 붙들어 주옵소서.
  속이 불편한 시간마다 위로하여 주시고,
  필요한 영양을 잘 섭취할 수 있도록 도와주시며,
  몸과 마음에 새 힘을 더하여 주옵소서.

  감자가 건강하게 자라게 하시고,
  앞으로의 임신 과정도 주님의 은혜 가운데 인도하여 주옵소서.

  남편에게는 아내를 세심하게 살피는 사랑과 지혜를 주시고,
  우리 부부가 서로를 격려하며 함께 걸어가게 하여 주옵소서.

  힘든 순간에도 하나님께서 우리와 함께하신다는 사실을 잊지 않게 하시고,
  오늘 주시는 은혜로 충분하게 하여 주옵소서.

  하나님께서 오늘도 아내에게 평안과 힘을 주시고,
  감자에게 건강한 성장의 은혜를 허락하시기를 축복합니다.

  예수님의 이름으로 기도합니다.

  아멘.

footer: "2026년 6월 13일 토요일 가정예배"