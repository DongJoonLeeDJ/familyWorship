title: "하나님이 왕이 되시는 자리"
subtitle: "내 뜻보다 하나님의 다스림을 기뻐하는 삶"
date: "2026-07-30"

calling: |
  사랑의 하나님 아버지,
  오늘도 우리 가정을 은혜로 지켜 주셔서 감사합니다.
  하루를 마무리하며 주님 앞에 나아오니,
  우리의 생각보다 크신 하나님의 마음을 배우게 하시고
  오늘도 우리 삶의 왕은 하나님이심을 고백하게 하옵소서.

verse1_title: "이사야 11:9"
verse1: |
  내 거룩한 산 모든 곳에서 해 됨도 없고 상함도 없을 것이니 이는 물이 바다를 덮음 같이 여호와를 아는 지식이 세상에 충만할 것임이니라

verse2_title: "마태복음 6:10"
verse2: |
  나라가 임하시오며 뜻이 하늘에서 이루어진 것 같이 땅에서도 이루어지이다

reflection: |

  우리는 어떤 세상을 가장 원할까요? 아마 대부분은 걱정이 없고, 계획한 대로 흘러가며, 내 마음대로 할 수 있는 삶을 떠올릴 것입니다.

  그런데 오늘 말씀은 하나님께서 약속하시는 세상을 조금 다르게 보여 줍니다. 그곳은 단지 편한 세상이 아니라, 하나님을 아는 지식이 가득하여 하나님께서 온전히 다스리시는 나라입니다.

  그렇다면 하나님을 안다는 것은 무엇일까요? 단순히 하나님에 대해 많이 아는 것이 아닙니다. 오늘 하루의 결정과 말, 마음까지도 "주님이라면 어떻게 하실까?"를 묻는 삶입니다. 하나님이 주인이 되실 때 비로소 우리의 삶에도 참된 평안이 찾아옵니다.

  예수님께서는 십자가를 통해 우리를 하나님의 나라로 초대하셨습니다. 죄로 인해 하나님과 멀어졌던 우리를 다시 아버지께로 이끄셨고, 부활하심으로 새로운 생명의 길을 열어 주셨습니다. 그래서 우리는 억지로 하나님을 모시는 사람이 아니라, 사랑받은 자녀로서 기쁨으로 하나님의 다스림을 받아들이는 사람입니다.

  우리 가정도 하나님께서 맡기신 작은 하나님 나라입니다. 부부가 서로를 존중하는 말 한마디, 함께 드리는 짧은 예배, 웃으며 하루를 마무리하는 시간도 하나님께서 다스리시는 흔적이 될 수 있습니다. 그리고 엄마의 품에서 하루하루 자라고 있는 감자도 하나님의 손길 아래 가장 좋은 때를 향해 자라가고 있습니다. 아직 알지 못하는 것들이 남아 있지만, 하나님께서는 이미 감자의 모든 내일을 알고 계십니다.

  하나님께서 우리 삶의 왕이 되신다는 것은 자유를 빼앗기는 것이 아니라 가장 안전한 손에 삶을 맡기는 것입니다. 그 손 안에서 우리 가정은 오늘도 조금씩 하나님 나라를 닮아갈 것입니다.

  오늘도 하나님께서 함께하셨습니다.
  내일도 하나님께 맡기면 됩니다.
  하나님께서 다스리시는 곳에는 언제나 소망이 있습니다.

questions:
  - "오늘 내 마음의 주인이 하나님보다 앞서 있었던 순간은 있었나요?"
  - "우리 가정이 하나님 나라를 닮아가기 위해 이번 주 실천할 수 있는 작은 일은 무엇일까요?"
  - "오늘 하나님께 감사드리고 싶은 평범한 순간이 하나 있다면 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  우리 삶의 참된 왕이 되어 주셔서 감사합니다.
  우리의 계획보다 하나님의 뜻을 더 신뢰하는 믿음을 허락하시고,
  날마다 주님의 다스림 안에서 기쁨과 평안을 누리게 하옵소서.
  사랑하는 아내에게 오늘도 필요한 힘을 공급해 주시고,
  몸과 마음을 평안으로 감싸 주셔서 임신의 시간을 감사함으로 걸어가게 하옵소서.
  감자가 건강하게 자라도록 세밀하게 돌보시고,
  하나님께서 허락하신 생명의 시간을 기쁨 가운데 채워 주옵소서.
  우리 부부가 부모가 되어 가는 모든 과정 속에서
  서로를 더욱 이해하고 격려하며,
  가정 안에 하나님의 나라를 함께 세워 가게 하옵소서.
  우리를 하나님 나라의 백성으로 삼아 주신
  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 7월 30일 목요일 가정예배"
