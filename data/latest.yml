title: "마음을 지키는 하루"
subtitle: "생명의 근원은 하나님께 붙든 마음에서 시작됩니다"
date: "2026-07-06"

calling: |
  사랑의 하나님 아버지,
  새로운 한 주를 허락하시고 오늘도 함께 예배드리게 하심에 감사합니다.
  우리의 마음을 주님께 맡기며, 주님의 평안으로 채워 주옵소서.

verse1_title: "잠언 4장 23절"
verse1: |
  모든 지킬 만한 것 중에 더욱 네 마음을 지키라.
  생명의 근원이 이에서 남이니라.

verse2_title: "빌립보서 4장 8절"
verse2: |
  끝으로 형제들아 무엇에든지 참되며 무엇에든지 경건하며
  무엇에든지 옳으며 무엇에든지 정결하며 무엇에든지 사랑받을 만하며
  무엇에든지 칭찬받을 만하며 무슨 덕이 있든지 무슨 기림이 있든지
  이것들을 생각하라.

reflection: |
  잠언은 "마음을 지키라"는 말씀으로 우리를 초대합니다.
  우리의 생각은 감정으로 이어지고, 감정은 행동이 되며,
  반복된 행동은 습관과 인격을 만들어 갑니다.
  그래서 하나님께서는 무엇보다 먼저 우리의 마음을 지키라고 말씀하십니다.

  마음을 지킨다는 것은 걱정이나 감정을 억누르는 것이 아니라,
  하나님 앞에 우리의 생각을 올려드리는 것입니다.
  하나님께 시선을 둘 때 우리의 마음은 조금씩 평안을 얻고,
  그 평안은 말과 행동에도 자연스럽게 드러나게 됩니다.

  우리 가정도 새로운 한 주를 시작합니다.
  감자가 건강하게 자라가고, 아내의 몸도 하루하루 변화를 겪고 있습니다.
  앞으로의 일정과 준비해야 할 일들도 있지만,
  하나님께서 지금까지 우리를 인도하신 것처럼 앞으로도 함께하실 것을 믿습니다.

  오늘도 우리의 생각을 하나님의 말씀으로 채우고,
  서로를 향한 사랑과 감사로 마음을 지켜 나가는 하루가 되기를 소망합니다.

questions:
  - "오늘 내 마음을 가장 많이 차지하고 있는 생각은 무엇인가요?"
  - "그 생각을 하나님께 맡기기 위해 어떤 기도를 드리고 싶나요?"
  - "오늘 배우자의 마음을 평안하게 해 줄 수 있는 작은 사랑은 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  우리의 마음을 누구보다 잘 아시는 주님께 감사드립니다.

  오늘도 우리의 생각을 말씀으로 지켜 주시고,
  두려움보다 믿음을, 불평보다 감사를 선택하게 하옵소서.

  아내를 사랑으로 붙드시고,
  몸과 마음에 평안과 새 힘을 허락하여 주옵소서.

  감자를 오늘도 안전하게 보호하시고,
  건강하게 자라며 주님의 은혜 안에서 생명을 이어가게 하옵소서.

  우리 부부가 서로의 마음을 귀하게 여기며,
  하나님의 사랑으로 서로를 세워 가는 가정이 되게 하옵소서.

  새로운 한 주도 주님께 맡겨 드리며,
  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 6일 월요일 가정예배"
