title: "사랑은 다르게 사는 것"
subtitle: "나와 다른 사람을 대하는 마음"
date: "2026-09-19"
calling: "오늘은 내가 누군가를 쉽게 판단하거나 구분하고 있지는 않은지 돌아보며 예배합니다."

verse1_title: "원수를 사랑하라"
verse1: "너희 원수를 사랑하며 너희를 박해하는 자를 위하여 기도하라. (마태복음 5:44)"

verse2_title: "서로 사랑하라"
verse2: "내가 너희를 사랑한 것 같이 너희도 서로 사랑하라. (요한복음 13:34)"

reflection: "오늘 성경을 공부하면서 계속 마음에 남은 것은 ‘우리와 다른 사람’을 바라보는 태도였습니다. 성경에는 원수를 심판해 달라고 하나님께 호소하는 사람들의 모습도 나오지만, 예수님은 그 자리에서 원수까지 사랑하고 기도하라고 말씀하십니다. 어쩌면 믿음은 내가 옳다는 것을 증명하는 것보다, 나와 다른 사람을 대하는 방식에서 드러나는 것인지도 모르겠습니다. 우리 부부도 서로 생각이 다를 때가 있고, 앞으로 감자를 키우면서도 예상하지 못한 사람들과 상황을 만나게 될 것입니다. 그때 상대를 쉽게 ‘다른 사람’으로 만들기보다 사랑으로 대할 수 있으면 좋겠습니다."

questions:
  - "내가 요즘 쉽게 판단하거나 선을 긋는 사람은 누구일까?"
  - "나와 생각이 다른 사람에게 사랑으로 반응한다는 것은 어떤 모습일까?"

prayer: "하나님, 제가 제 생각과 기준만 옳다고 여기지 않게 해주세요. 나와 다른 사람을 쉽게 미워하거나 판단하지 않고, 예수님께서 보여주신 사랑을 조금씩 배워가게 해주세요. 우리 부부도 서로 다를 때 먼저 이해하고 사랑하게 하시고, 감자를 키우며 만나는 사람들에게도 따뜻한 마음을 갖게 해주세요. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 19일 토요일 가정예배"
