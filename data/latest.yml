title: "날마다 자라게 하시는 하나님"
subtitle: "하나님의 손 안에서 감자는 오늘도 자라고 있습니다"
date: "2026-07-02"

calling: |
  사랑의 하나님 아버지,
  오늘도 우리 가정을 돌보시고 함께 예배드리게 하심에 감사합니다.
  하루하루 자라게 하시는 하나님의 신실하심을 기억하게 하옵소서.

verse1_title: "시편 139편 13-14절"
verse1: |
  주께서 내 내장을 지으시며
  나의 모태에서 나를 만드셨나이다.
  내가 주께 감사하옴은 나를 지으심이 심히 기묘하심이라.

verse2_title: "빌립보서 1장 6절"
verse2: |
  너희 안에서 착한 일을 시작하신 이가
  그리스도 예수의 날까지 이루실 줄을 우리는 확신하노라.

reflection: |
  하나님께서는 생명을 한순간에 완성하지 않으시고,
  하루하루 자라게 하십니다.

  오늘 분만병원을 방문하면서 앞으로의 진료를 위한 첫 예약도 마칠 수 있었습니다.
  오랜 시간을 기다려야 했지만,
  그 과정 속에서도 하나님께서는 우리에게 작은 기쁨을 허락하셨습니다.

  이제는 질초음파가 아니라 배 위에서 하는 초음파로도 감자의 모습을 볼 수 있었고,
  어느새 약 4.3cm까지 자란 모습을 확인했습니다.
  또 심장이 힘차게 뛰고 있는 것도 볼 수 있었고,
  초음파 영상을 보며 생명이 자라고 있음을 다시 한번 감사하게 되었습니다.

  조리원도 예약하며 출산을 향한 한 걸음을 더 내디뎠습니다.
  아직 갈 길은 남아 있지만,
  하나님께서는 이미 하나씩 준비할 수 있도록 길을 열어 가고 계십니다.

  때로는 일정을 착각하기도 하고 예상과 다른 일이 생기기도 합니다.
  하지만 하나님께서는 우리의 작은 실수보다 크신 분이시며,
  그 가운데서도 우리 가정을 신실하게 인도해 주십니다.

  오늘도 하나님께서 감자를 자라게 하시고,
  우리 부부도 부모로서 조금씩 준비시켜 가심에 감사하며
  평안히 하루를 마무리하면 좋겠습니다.

questions:
  - "오늘 하나님께 가장 감사했던 순간은 무엇이었나요?"
  - "감자가 자라는 모습을 보며 어떤 마음이 들었나요?"
  - "부모가 되어 가는 과정에서 하나님께 맡기고 싶은 것은 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  오늘도 우리 가정을 인도하여 주시고
  감자가 건강하게 자라고 있음을 확인하게 하심에 감사합니다.

  오랜 기다림 가운데도 지켜 주시고,
  초음파를 통해 힘차게 뛰는 심장과 자라난 모습을 보게 하셔서 감사합니다.

  앞으로의 모든 진료와 검사도 주님의 손에 맡겨 드립니다.
  필요한 준비를 하나씩 잘 해 나갈 수 있도록 지혜를 허락하여 주옵소서.

  아내를 붙들어 주셔서 긴 대기 시간으로 지친 몸을 회복시켜 주시고,
  입덧 가운데서도 날마다 새 힘을 더하여 주옵소서.

  감자를 오늘도 안전하게 보호하시고,
  지혜와 사랑으로 빚으셔서 건강하게 자라게 하옵소서.

  우리 부부도 부모로서 믿음 안에서 함께 성장하게 하시고,
  서로를 이해하고 사랑하며 주님을 더욱 의지하는 가정이 되게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 2일 목요일 가정예배"
