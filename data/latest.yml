title: "오늘의 은혜를 기억하다"
subtitle: "걱정보다 감사할 이유를 먼저 바라보기"
date: "2026-09-18"
calling: "오늘 하루도 우리에게 주신 은혜를 돌아보며 예배를 시작합니다."

verse1_title: "감사함으로"
verse1: "여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다. (시편 107:1)"

verse2_title: "평강을 누리다"
verse2: "아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로... 하나님께 아뢰라. (빌립보서 4:6)"

reflection: "결과를 기다리는 동안 마음은 자꾸 아직 일어나지 않은 일까지 앞서 생각합니다. 좋은 결과를 바라는 마음과 혹시나 하는 걱정이 계속 오가는 것도 자연스러운 것 같습니다. 하지만 돌아보면 여기까지 오는 동안 이미 감사할 일들이 많았습니다. 오늘은 아직 오지 않은 결과에 마음을 빼앗기기보다, 지금까지 지켜 주신 하나님을 기억하고 감사하고 싶습니다. 우리가 할 수 있는 것은 기도하며 기다리는 것이고, 그 기다림의 시간도 하나님께 맡겨 드리면 좋겠습니다."

questions:
  - "오늘 내가 먼저 감사할 것은 무엇일까?"
  - "나는 아직 오지 않은 일을 미리 걱정하고 있지는 않을까?"

prayer: "하나님, 결과를 기다리는 마음이 흔들리지 않게 하시고 이미 주신 은혜를 잊지 않게 해주세요. 여보에게 평안을 주시고 감자도 잘 지켜 주세요. 남은 검사 결과도 선하게 인도해 주시고, 어떤 결과 앞에서도 하나님을 신뢰하게 해주세요. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 18일 금요일 가정예배"
