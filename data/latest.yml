title: "지혜와 절제를 배우는 하루"
subtitle: "하나님께서는 우리의 마음을 다스리는 사람을 기뻐하십니다"
date: "2026-07-07"

calling: |
  사랑의 하나님 아버지,
  거룩한 주일을 허락하시고 함께 예배드리게 하심에 감사합니다.
  오늘도 말씀을 통해 우리의 마음을 새롭게 하시고,
  주님의 지혜 안에서 살아가게 하옵소서.

verse1_title: "잠언 4장 17절"
verse1: |
  대저 그들은 악의 떡을 먹으며
  강포의 술을 마심이니라.

verse2_title: "잠언 16장 32절"
verse2: |
  노하기를 더디 하는 자는 용사보다 낫고
  자기의 마음을 다스리는 자는
  성을 빼앗는 자보다 나으니라.

reflection: |
  잠언은 우리의 삶이 어떤 것을 양식 삼아 살아가는지를 돌아보게 합니다.
  악과 욕심을 가까이하는 삶은 결국 사람을 무너뜨리지만,
  하나님을 경외하는 삶은 마음을 바른 길로 인도합니다.

  특히 잠언 16장 32절은 강한 사람이 누구인지를 새롭게 정의합니다.
  성을 정복하는 사람보다 자신의 마음을 다스리는 사람이 더 큰 사람이라고 말씀합니다.

  우리는 살아가면서 예상하지 못한 일이나 감정의 흔들림을 경험합니다.
  임신 기간을 함께 보내면서도 걱정이 생기고,
  피곤하거나 몸이 힘들 때에는 작은 일에도 마음이 흔들릴 수 있습니다.
  그러나 하나님께서는 우리에게 완벽함을 요구하시기보다,
  하나님을 의지하며 마음을 맡기는 삶으로 초대하십니다.

  오늘도 우리 부부가 서로를 이해하고 기다려 주며,
  사랑으로 마음을 다스리는 가정이 되기를 소망합니다.
  그럴 때 우리 가정에는 하나님의 평안이 더욱 깊이 머물 것입니다.

questions:
  - "최근 내 마음을 가장 흔들었던 일은 무엇이었나요?"
  - "그 상황에서 하나님께 맡기고 싶은 감정은 무엇인가요?"
  - "오늘 배우자를 위해 사랑과 절제를 어떻게 표현할 수 있을까요?"

prayer: |
  사랑의 하나님 아버지,
  우리의 마음을 누구보다 잘 아시는 주님께 감사드립니다.

  감정이 앞서기보다 하나님을 먼저 바라보게 하시고,
  마음을 다스리는 지혜와 절제를 허락하여 주옵소서.

  서로를 판단하기보다 이해하게 하시고,
  사랑으로 말하고 사랑으로 행동하는 부부가 되게 하옵소서.

  아내를 오늘도 건강하게 붙들어 주셔서
  두통과 입덧으로부터 회복하게 하시고,
  몸과 마음에 평안을 허락하여 주옵소서.

  감자를 주님의 손으로 안전하게 보호하시고,
  하루하루 건강하고 지혜롭게 자라게 하옵소서.

  우리 가정이 세상의 방식보다 하나님의 지혜를 따르며,
  언제나 주님을 신뢰하는 믿음의 가정이 되게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 7일 화요일 가정예배"
