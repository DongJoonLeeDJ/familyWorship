title: "오늘은 여기까지"
subtitle: "아직 모르는 내일은 주님께 맡기고, 오늘의 걸음을 걷습니다"
date: "2026-09-10"

calling: |
  오늘 양수검사를 받았습니다.
  이제 최종 결과를 받기까지 3~4주 정도를 기다려야 합니다.
  생각했던 것보다 비용도 많이 들었지만, 장모님께서 큰 도움을 주셔서 감사한 마음도 있습니다.
  
  검사 결과가 나오기 전까지 여러 생각이 들겠지만,
  오늘은 검사 자체를 잘 마쳤다는 것,
  아내가 잘 회복하고 있다는 것,
  그리고 감자가 그 순간에도 잘 견뎌주었다는 것을 먼저 하나님께 감사하며 예배하겠습니다.

verse1_title: "너희 염려를 다 주께 맡기라"
verse1: |
  "너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라"
  — 베드로전서 5:7 (개역개정)

verse2_title: "주의 인도하심을 믿습니다"
verse2: |
  "너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라"
  — 잠언 3:6 (개역개정)

reflection: |
  오늘 양수검사를 받았습니다.

  며칠 동안 계속 마음속에 있던 일이 실제로 지나갔습니다.
  검사할 때 감자가 놀라서 발로 차기도 했다고 합니다.
  그 이야기를 들으니 웃음도 나고, 한편으로는 참 마음이 짠합니다.
  작은 아이가 자기 나름대로 잘 버텨준 것 같아서요.

  검사 결과를 기다리는 시간은 이제부터입니다.
  최종 결과까지는 3~4주 정도 걸린다고 합니다.
  의사 선생님의 말씀을 들어보면 지금 예상하는 것보다 상황이 더 복잡할 수도 있고,
  최악의 경우에는 유전적인 문제까지 생각해야 할 수도 있다고 합니다.
  반대로 그런 문제는 없더라도 성기의 크기가 아주 작을 가능성도 이야기 들었습니다.

  솔직히 기적을 바라고 있습니다.
  그냥 감자의 성기가 시간이 지나면서 기적처럼 잘 자라주었으면 좋겠습니다.
  아무 일도 없었던 것처럼 웃으며 지나갈 수 있다면 얼마나 좋을까 싶습니다.

  하지만 오늘은 그 기도와 함께 다른 기도도 하고 싶습니다.

  "하나님, 제가 원하는 결과가 아니더라도 주님을 놓치지 않게 해주세요."

  이것이 말처럼 쉽지는 않을 것 같습니다.
  좋은 결과를 바라면서도, 혹시 그렇지 않으면 어떡하나 하는 생각이 계속 들 테니까요.
  그래도 하나님께서 우리에게 요구하시는 것이 결과를 미리 알아내는 능력은 아닐 것입니다.

  베드로전서는 염려를 주님께 맡기라고 합니다.
  염려가 생기지 않게 하라고 하지 않습니다.
  염려가 있으니 그것을 주님께 가져가라고 합니다.

  오늘도 걱정됩니다.
  그래서 맡깁니다.

  아내도 잘 회복했으면 좋겠습니다.
  검사 때문에 몸도 마음도 힘들었을 텐데, 이제는 편히 쉬고 회복할 수 있으면 좋겠습니다.
  검사받는 동안 놀랐을 감자도 별일 없이 잘 지내고 있기를 바랍니다.

  그리고 장모님께서 생각보다 큰 도움을 주셨습니다.
  검사 비용이 생각보다 많이 나와서 부담이 되었는데, 도움을 받을 수 있어서 감사했습니다.
  하나님께서 우리 가족을 통해서도 서로를 돌보게 하시는구나 싶습니다.

  아직 우리는 아무것도 최종적으로 알지 못합니다.
  그래서 오늘은 결론을 내리지 않겠습니다.

  감자가 건강하게 잘 자라기를 기도하고,
  기적처럼 성기가 잘 성장하기도 바라고,
  동시에 어떤 결과를 만나더라도 그때그때 필요한 길을 하나님께서 보여주시기를 구하겠습니다.

  3~4주를 한꺼번에 살아내려고 하지 않겠습니다.

  내일 하루를 살고,
  또 그다음 하루를 살겠습니다.

  결과가 나오는 날까지 감자는 계속 자라고,
  아내도 회복하고,
  저희 부부도 평범한 하루를 살아갈 것입니다.

  그 평범한 하루하루도 하나님께서 인도하시는 삶이라고 믿습니다.

questions:
  - "오늘 양수검사를 마치고 하나님께 가장 먼저 감사하고 싶은 것은 무엇인가요?"
  - "아직 결과를 알 수 없는 감자에 관한 어떤 걱정을 주님께 맡기고 싶나요?"
  - "결과를 기다리는 동안 우리가 평범하게 잘 살아가기 위해 서로에게 필요한 것은 무엇일까요?"

prayer: |
  하나님 아버지,
  오늘 양수검사를 잘 마치게 하셔서 감사합니다.
  검사받는 동안 감자를 지켜주시고, 아내도 잘 견디게 해주셔서 감사합니다.

  이제 결과를 기다리는 시간이 시작되었습니다.
  3~4주라는 시간이 길게 느껴질 때도 있겠지만,
  아직 오지 않은 결과를 미리 살아내지 않게 해주세요.

  하나님, 감자의 성기가 기적처럼 잘 자라게 해주시기를 기도합니다.
  지금보다 더 건강하게 성장해서 저희가 걱정했던 일이 아무것도 아니게 되기를 바랍니다.
  저희의 바람을 숨기지 않고 주님께 구합니다.

  하지만 주님,
  저희가 원하는 모습과 다른 결과를 만나게 되더라도
  그때 주님께서 가라고 하시는 길을 외면하지 않게 해주세요.
  감자를 사랑하는 마음을 잃지 않게 하시고,
  필요한 치료와 수술이 있다면 지혜롭게 받아들이며 하루하루 살아가게 해주세요.

  아내의 몸을 특별히 돌봐주세요.
  양수검사 후 잘 회복하게 하시고,
  불편하거나 걱정되는 일이 생기지 않도록 지켜주세요.

  검사받는 동안 놀랐을 감자도 계속 지켜주세요.
  지금처럼 잘 자라고, 잘 움직이고, 필요한 만큼 소변도 잘 보며
  남은 임신 기간을 무사히 지나게 해주세요.

  오늘 도움을 주신 장모님께도 감사드립니다.
  저희가 받은 도움을 감사히 기억하고,
  저희도 가족을 돌아볼 줄 아는 사람이 되게 해주세요.

  이제 결과가 나올 때까지 저희에게 주어진 하루하루를 살겠습니다.
  좋은 결과를 기다리면서도 오늘을 놓치지 않게 하시고,
  기도할 때는 기도하고, 웃을 때는 웃고, 쉬어야 할 때는 쉬게 해주세요.

  저희가 모든 것을 알 수 없더라도
  주님께서 저희보다 앞서 걸어가신다는 것을 믿습니다.

  저희 세 식구의 걸음을 주님께 맡깁니다.
  예수 그리스도의 이름으로 기도합니다. 아멘.

footer: "2026년 9월 10일 목요일 가정예배"