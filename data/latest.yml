title: "향기로운 기도"

subtitle: "하나님께 드리는 마음"

date: "2026-11-02"

calling: "하나님, 우리의 기도가 익숙한 말에 머물지 않고 주님께 드리는 진실한 마음이 되게 해 주세요."

verse1_title: "끊이지 않는 향"

verse1: "아론은 아침마다 등불을 손질할 때에 향기로운 향을 사를지며 또 저녁에 등불을 켤 때에 사를지니 이 향은 너희가 대대로 여호와 앞에 끊지 못할지며 — 출애굽기 30:7-8 중"

verse2_title: "생명을 위한 속전"

verse2: "너는 이스라엘 자손의 수효를 조사할 때에 조사받은 각 사람은 그 생명의 속전을 여호와께 드릴지니 이는 그들을 계수할 때에 그들 중에 질병이 없게 하려 함이라 — 출애굽기 30:12"

reflection: "출애굽기 30장에는 향을 사르는 일과 생명의 속전, 씻는 물과 거룩한 기름에 관한 규례가 나옵니다. 그중 향을 아침과 저녁으로 끊이지 않게 드리라는 말씀이 눈에 들어옵니다. 특별한 날에만 하나님을 찾는 것이 아니라, 하루를 시작하고 마무리하는 자리에서 하나님께 나아가는 모습이 떠오릅니다. 기도가 언제나 깊은 감동이나 특별한 깨달음으로 이어지는 것은 아닐 것입니다. 때로는 할 말이 많지 않고 마음이 분주한 날도 있겠지만, 그런 날에도 하나님 앞에 잠시 머무는 시간을 소중히 여기면 좋겠습니다. 기도를 잘해야 한다는 부담보다 하나님께 마음을 향하는 일을 꾸준히 이어가면 좋겠습니다."

questions:
  - "요즘 하나님께 기도하는 시간은 의무처럼 느껴지나요, 아니면 마음을 나누는 시간처럼 느껴지나요?"
  - "우리 부부가 바쁜 일상 속에서도 꾸준히 이어가고 싶은 기도의 습관은 무엇인가요?"

prayer: "하나님 아버지, 매일 주님께 나아갈 수 있도록 이끌어 주셔서 감사합니다. 기도를 특별한 순간에만 드리는 것이 아니라 평범한 하루 속에서도 이어가게 해 주세요. 마음이 분주하거나 무슨 말을 해야 할지 모를 때에도 주님 앞에 솔직히 머물게 하시고, 익숙함 속에서 기도의 의미를 잊지 않게 해 주세요. 우리 부부가 서로의 마음을 나누듯 하나님께도 진실한 마음을 드리며 살아가게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 2일 월요일 가정예배"
