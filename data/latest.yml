title: "두려운 날에도, 우리는"
subtitle: "모든 것을 알지 못해도 하나님 앞에 함께 서 있습니다"
date: "2026-09-07"

calling: |
  오늘은 마음이 편하게 하루를 마무리하기 어려운 날입니다.
  검사 결과를 기다리는 동안 머릿속에는 자꾸 여러 가지 생각이 떠오릅니다.
  그래도 오늘 밤만큼은 아직 오지 않은 내일을 미리 살아내기보다,
  지금 이 자리에서 하나님과 함께 잠시 쉬어가면 좋겠습니다.

verse1_title: "여호와께서 너의 출입을 지키시리라"
verse1: |
  "여호와께서 너의 출입을 지금부터 영원까지 지키시리로다"
  — 시편 121:8 (개역개정)

verse2_title: "아무것도 우리를 끊을 수 없습니다"
verse2: |
  "내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나
  능력이나 높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는
  하나님의 사랑에서 끊을 수 없으리라"
  — 로마서 8:38-39 (개역개정)

reflection: |
  오늘은 감자 이야기를 하지 않을 수가 없습니다.

  지난 9월 5일부터 마음이 참 복잡했습니다. 16주 때에도 성기의 모양이 조금 애매하다는 이야기를 들었고,
  20주가 된 이번에도 비슷한 이야기를 들었습니다. 한 병원에서만 들은 것도 아니고, 오늘은 다른 병원까지 찾아갔습니다.
  정밀하게 살펴본 뒤에도 양수검사를 이야기하니 마음이 편할 리가 없습니다.

  검사 결과를 기다리는 동안 사람의 마음은 참 바쁘게 움직입니다.
  아직 아무것도 확정되지 않았는데도 최악의 경우를 먼저 생각합니다.
  "혹시 정말 문제가 있다면?"
  "감자는 괜찮을까?"
  "앞으로 우리는 어떻게 해야 할까?"

  그런데 오늘 우리 부부가 하나 결정한 것이 있습니다.
  감자에게 어떤 문제가 있다고 하더라도 낳아 키우기로 했다는 것입니다.

  생각해 보면 이것은 결과를 다 알고 나서 내린 결정이 아닙니다.
  아직 NIPT 결과도 모르고, 정확히 무엇이 문제인지도 모릅니다.
  그런데도 우리는 감자를 기다리기로 했습니다.

  저는 오늘 이 마음을 하나님 앞에 그대로 가져가고 싶습니다.

  시편 121편에서 시인은 "여호와께서 너의 출입을 지금부터 영원까지 지키시리로다"라고 고백합니다.
  모든 일이 잘 풀릴 것이라고 약속하는 말은 아닙니다.
  앞으로 무슨 일이 생길지 미리 알려주는 말씀도 아닙니다.
  다만 그 길을 걸어가는 사람을 하나님께서 지키신다는 고백입니다.

  그리고 로마서 8장은 조금 더 놀라운 말을 합니다.
  현재의 일도, 장래의 일도 우리를 그리스도 안에 있는 하나님의 사랑에서 끊을 수 없다고 합니다.

  그렇다면 우리가 아직 모르는 결과도 하나님의 사랑보다 클 수는 없습니다.
  우리가 상상하는 최악의 상황도 감자를 향한 하나님의 손길보다 클 수는 없습니다.
  물론 그렇다고 두렵지 않은 것은 아닙니다. 걱정이 되는 것은 걱정이 되는 것입니다.

  믿음은 두려움이 전혀 없는 상태가 아니라,
  두려운 마음을 가지고도 하나님께로 향하는 것인지도 모르겠습니다.

  그리고 오늘은 이것 하나만 기억하고 싶습니다.

  감자가 어떤 모습으로 우리에게 오든,
  우리는 이미 감자의 부모입니다.

  결과를 받아 보고 사랑할 아이가 아닙니다.
  좋은 결과가 나오면 품고, 나쁜 결과가 나오면 내려놓는 아이도 아닙니다.
  아직 아무것도 확실하지 않은 지금도 우리에게는 소중한 감자입니다.

  하나님께서 우리에게 맡기신 이 작은 생명을 우리가 끝까지 사랑하기로 마음먹었다는 것.
  오늘 밤에는 그것으로 충분한 것 같습니다.

  내일 결과가 어떻게 될지는 아직 모릅니다.
  하지만 내일이 오기 전까지는 오늘을 살면 됩니다.
  그리고 오늘 밤에는 하나님 앞에서 감자와 우리 부부를 함께 내려놓습니다.

  "하나님, 우리는 잘 모르겠습니다."

  어쩌면 지금 우리에게 가장 솔직한 기도는 이것일지도 모르겠습니다.
  하지만 모르는 우리보다 하나님께서 더 많이 알고 계신다는 사실은 변하지 않습니다.

questions:
  - "지금 내 마음속에서 가장 두려운 것은 무엇인가요?"
  - "아직 알지 못하는 내일을 하나님께 맡기면서, 오늘 내가 붙들고 싶은 말씀은 무엇인가요?"
  - "오늘 밤 감자를 생각하며 하나님께 가장 솔직하게 드리고 싶은 한마디는 무엇인가요?"

prayer: |
  하나님 아버지,
  오늘은 저희가 무엇을 기도해야 할지도 잘 모르겠습니다.
  검사 결과가 어떻게 나올지, 앞으로 어떤 일이 생길지도 알지 못합니다.
  그래서 아는 척하지 않고 지금의 마음 그대로 주님 앞에 가져옵니다.

  감자를 주신 것을 감사합니다.
  아직 많은 것을 알지 못하지만, 이미 저희에게 너무나 소중한 아이입니다.
  어떤 결과를 만나게 되더라도 저희가 감자를 사랑하는 마음을 놓치지 않게 하시고,
  두려움 때문에 아직 오지 않은 시간을 미리 살아가지 않게 해주세요.

  아내의 마음도 붙들어 주세요.
  서로의 걱정을 숨기기보다 함께 나누고, 힘든 순간에 서로에게 조금 더 따뜻한 사람이 되게 해주세요.

  저희 부부가 결과를 기다리는 동안에도 주님의 사랑 안에 머물게 하시고,
  좋은 소식만을 기대하는 믿음이 아니라 어떤 상황에서도 주님을 놓지 않는 믿음을 배우게 해주세요.

  무엇보다 감자의 생명과 앞으로의 모든 시간을 주님의 손에 맡깁니다.
  저희가 할 수 있는 것은 사랑하고 돌보는 것임을 기억하게 하시고,
  나머지는 주님께서 붙들어 주세요.

  예수 그리스도의 이름으로 기도합니다. 아멘.

footer: "2026년 9월 7일 월요일 가정예배"
