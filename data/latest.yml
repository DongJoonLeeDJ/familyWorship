title: "떠나보내야 할 것을 붙잡고 있지는 않을까"

subtitle: "마음이 굳어지기 전에"

date: "2026-10-14"

calling: "내가 꼭 쥐고 놓지 못하는 생각이나 마음이 있는지 잠시 돌아보며, 하나님 앞에 조용히 머뭅니다."

verse1_title: "네가 어느 때까지 내 앞에 겸비하지 아니하겠느냐"

verse1: "출애굽기 10:3 — 모세와 아론이 바로에게 들어가서 그에게 이르되 히브리 사람의 하나님 여호와께서 말씀하시기를 네가 어느 때까지 내 앞에 겸비하지 아니하겠느냐 내 백성을 보내라 그들이 나를 섬길 것이라"

verse2_title: "바로의 마음은 여전히 완악하였다"

verse2: "출애굽기 11:10 — 모세와 아론이 이 모든 이적을 바로 앞에서 행하였으나 여호와께서 바로의 마음을 완악하게 하셨으므로 그가 이스라엘 자손을 그 나라에서 보내지 아니하였더라"

reflection: "출애굽기 10장에서 바로는 여러 차례 재앙을 겪고도 이스라엘 백성을 온전히 보내지 않습니다. 상황이 힘들어지면 조금 양보하는 듯하다가도, 위기가 지나가면 다시 마음을 닫습니다. 우리도 어떤 일을 내려놓아야 한다는 것을 알면서 당장 손해를 보거나 익숙한 것을 바꾸는 일이 두려워 붙잡고 있을 때가 있습니다. 물론 바로의 행동과 우리의 일상을 그대로 비교할 수는 없지만, 마음을 돌이킬 기회가 주어졌을 때 어떻게 반응하는지는 생각해 볼 만합니다. 내가 옳다고 믿는 생각이나 익숙한 방식이 언제나 옳은 것은 아닙니다. 때로는 한 걸음 물러서서 다시 살펴보는 것이 필요합니다. 오늘 모든 문제를 해결하려 하기보다, 내가 마음을 닫아 둔 곳은 없는지 하나만 찾아보아도 좋겠습니다."

questions:
  - "나는 무엇을 바꾸거나 내려놓아야 한다고 느끼면서도 계속 미루고 있을까?"
  - "내 생각과 다른 이야기를 들었을 때, 그 말의 내용을 살피기 전에 먼저 거부하고 있지는 않을까?"

prayer: "하나님, 제 생각이 익숙하다는 이유만으로 그것을 고집하지 않게 해주세요. 잘못을 알게 되었을 때 체면이나 손해를 걱정하며 미루지 않고, 필요한 변화를 받아들일 수 있도록 도와주세요. 아내의 말을 들을 때에도 제 입장을 설명하기에 앞서 그 마음을 먼저 헤아리게 해주시고, 저희가 서로에게 마음을 닫기보다 진실하게 이야기할 수 있게 해주세요. 오늘 당장 모든 것을 이해하지 못하더라도 겸손히 돌아볼 수 있는 마음을 허락해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 14일 수요일 가정예배"
