title: "함께 세워가는 하나님의 일"

subtitle: "각자의 손길이 모여 완성되는 공동체"

date: "2026-11-10"

calling: "우리에게 맡겨진 자리와 역할을 돌아보며, 작은 수고도 소중히 여기는 마음으로 예배합니다."

verse1_title: "맡겨진 일을 기꺼이 감당하다"

verse1: "마음이 지혜로운 모든 자는 성막을 만드는 모든 일을 하려고 그 곳에서 떠나 (출애굽기 36:8)"

verse2_title: "함께 만들어 가는 성막"

verse2: "출애굽기 36장에서는 성막을 만드는 일이 본격적으로 시작됩니다. 브살렐과 오홀리압을 비롯해 마음이 지혜로운 사람들이 각자의 기술과 재능으로 맡은 일을 감당했습니다. 성막은 한 사람의 솜씨로 세워진 것이 아니라, 여러 사람의 손길이 모여 만들어졌습니다."

reflection: "하나님의 일이라고 해서 모두가 같은 일을 해야 하는 것은 아닙니다. 누군가는 만들고, 누군가는 준비하고, 또 누군가는 보이지 않는 곳에서 필요한 일을 맡습니다. 각자의 역할은 달라도 서로의 수고가 모일 때 공동체가 세워집니다. 우리 가정도 마찬가지입니다. 집안일이나 일상의 책임을 누가 더 많이 하는지 따지기보다, 서로의 몫을 알아주고 함께 채워가는 마음이 필요하겠습니다."

questions:

- "요즘 우리 가정에서 각자 맡아 감당하고 있는 일은 무엇인가요?"
- "상대방이 하고 있는 수고 중에 당연하게 여기고 지나친 것은 없을까요?"

prayer: "하나님, 우리에게 각자의 재능과 역할을 주셔서 감사합니다. 눈에 띄는 일뿐 아니라 보이지 않는 수고도 귀하게 여기게 해주세요. 서로의 몫을 당연하게 여기지 않고, 부족한 부분은 기꺼이 채워주며 함께 가정을 세워가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 10일 화요일 가정예배"