title: "분노보다 하나님을 신뢰하는 삶"
subtitle: "마음을 다스리는 사람이 진정으로 강한 사람입니다"
date: "2026-07-05"

calling: |
  사랑의 하나님 아버지,
  거룩한 주일을 허락하시고 함께 예배드리게 하심에 감사합니다.
  우리의 마음을 살피시고, 어떤 상황에서도 주님을 신뢰하게 하옵소서.

verse1_title: "민수기 20장 12절"
verse1: |
  여호와께서 모세와 아론에게 이르시되
  너희가 나를 믿지 아니하고 이스라엘 자손의 목전에서
  내 거룩함을 나타내지 아니한 고로
  너희는 이 회중을 내가 그들에게 준 땅으로 인도하여 들이지 못하리라 하시니라.

verse2_title: "잠언 16장 32절"
verse2: |
  노하기를 더디 하는 자는 용사보다 낫고
  자기의 마음을 다스리는 자는
  성을 빼앗는 자보다 나으니라.

reflection: |
  모세는 오랜 시간 백성을 인도하며 하나님께 충성했던 사람이었습니다.
  그러나 민수기 20장에서 그는 백성의 원망 앞에서 분노했고,
  하나님께서 말씀하신 대로 하지 않고 자신의 감정대로 행동했습니다.

  분노 자체가 모든 죄는 아니지만,
  분노가 하나님을 신뢰하는 마음보다 앞설 때 우리는 하나님의 뜻보다
  자신의 감정에 이끌릴 수 있습니다.

  잠언은 자기 마음을 다스리는 사람이 성을 함락시키는 용사보다
  더 강한 사람이라고 말합니다.
  진정한 힘은 상대를 이기는 데 있는 것이 아니라,
  하나님을 신뢰하며 자신의 마음을 맡길 줄 아는 데 있습니다.

  우리도 살아가면서 예상과 다른 일이 생기거나,
  몸이 지치고 마음이 예민해질 때가 있습니다.
  특히 임신 기간 동안은 몸과 마음이 모두 민감해질 수 있기에
  서로를 이해하고 기다려 주는 사랑이 더욱 필요합니다.

  오늘도 우리 부부가 감정보다 하나님을 먼저 바라보고,
  서로에게 부드러운 말과 따뜻한 마음을 선택하는 하루가 되기를 소망합니다.
  하나님께서 주시는 평안이 우리 가정을 지켜 주실 것입니다.

questions:
  - "최근 내 마음을 가장 흔들었던 일은 무엇이었나요?"
  - "그 순간 하나님께 맡기지 못했던 감정은 무엇이었나요?"
  - "오늘 배우자를 위해 절제와 사랑을 어떻게 표현할 수 있을까요?"

prayer: |
  사랑의 하나님 아버지,
  우리의 마음을 누구보다 잘 아시는 주님께 감사드립니다.

  감정이 앞서기보다 하나님을 먼저 신뢰하게 하시고,
  분노보다 사랑을, 조급함보다 평안을 선택하게 하옵소서.

  우리의 말과 행동을 지켜 주셔서
  서로에게 상처를 주기보다 위로와 격려를 전하는 부부가 되게 하옵소서.

  아내를 오늘도 사랑으로 붙들어 주시고,
  몸의 불편함을 덜어 주시며 평안과 회복을 허락하여 주옵소서.

  감자를 안전하게 보호하시고,
  건강하게 자라며 주님의 은혜 가운데 하루하루 성장하게 하옵소서.

  우리 가정이 어떤 상황에서도 하나님을 신뢰하며,
  마음을 다스리는 지혜를 배우는 믿음의 가정이 되게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 5일 주일 가정예배"
