title: "긍휼이 많으신 하나님"
subtitle: "우리의 부족함보다 크신 하나님의 신실하심"
date: "2026-06-07"

calling: |
  우리를 사랑으로 부르시고
  오늘도 은혜 가운데 인도하시는 하나님께 나아갑니다.

  우리의 믿음이 완전해서가 아니라,
  하나님의 긍휼과 신실하심으로 여기까지 왔음을 기억하며
  감사함으로 예배드립니다.

verse1_title: "느헤미야 9:31"
verse1: |
  주께서는 주의 크신 긍휼로
  그들을 아주 멸하지 아니하시며 버리지도 아니하셨사오니

  주는 은혜로우시고 긍휼이 많으신 하나님이심이니이다

verse2_title: "마태복음 9:36"
verse2: |
  무리를 보시고 불쌍히 여기시니
  이는 그들이 목자 없는 양과 같이
  고생하며 기진함이라

reflection: |
  느헤미야 9장에서 이스라엘 백성은
  자신들의 역사를 돌아봅니다.

  그 역사 속에는 순종도 있었지만
  실패와 불순종도 있었습니다.

  그러나 하나님께서는 백성을 버리지 않으셨습니다.

  하나님께서 신실하셨기 때문입니다.

  마태복음에서는 예수님께서
  지치고 힘겨운 사람들을 보시고
  긍휼히 여기셨다고 말씀합니다.

  하나님은 연약한 사람들을 향해
  냉정하게 평가하시는 분이 아니라,
  긍휼의 눈으로 바라보시는 분이십니다.

  우리도 요즘 여러 감정을 경험하고 있습니다.

  감사와 설렘이 있지만,
  한편으로는 걱정과 긴장도 있습니다.

  출혈이 있었고,
  피고임도 관찰 중이며,
  아직 조심해야 하는 시기입니다.

  때로는 믿음이 부족하게 느껴질 수도 있고,
  마음이 흔들릴 때도 있습니다.

  그러나 하나님께서는
  우리의 믿음의 크기만 바라보시는 분이 아닙니다.

  하나님께서는 우리의 연약함을 아시고,
  우리의 두려움도 아시며,
  그 가운데서도 우리를 품어 주십니다.

  지금까지 감자를 지켜 주신 것도
  하나님의 은혜였습니다.

  앞으로의 길 역시
  하나님의 손 안에 있습니다.

  오늘 우리는 완벽한 믿음을 자랑하기보다,
  긍휼이 많으신 하나님을 바라봅니다.

  그리고 그 하나님께
  오늘 하루도 맡겨 드립니다.

questions:
  - "최근 하나님께서 우리를 돌보셨다고 느꼈던 순간은 언제였나요?"
  - "내가 하나님께 솔직히 맡기고 싶은 걱정은 무엇인가요?"
  - "하나님의 긍휼을 생각할 때 감사하게 되는 일은 무엇인가요?"

prayer: |
  하나님 아버지,

  오늘도 우리를 사랑으로 품어 주시고
  은혜 가운데 인도하여 주셔서 감사합니다.

  우리의 믿음이 늘 강한 것은 아니고,
  때로는 걱정하고 흔들릴 때도 있지만,
  하나님께서 긍휼로 우리를 붙들어 주심에 감사합니다.

  지금까지 감자를 지켜 주시고
  심장박동을 보게 하신 은혜를 기억하게 하옵소서.

  아기집 주변의 피고임이 잘 흡수되게 하시고,
  출혈이 멈추게 하시며,
  감자가 건강하게 자라도록 보호하여 주옵소서.

  아내의 몸과 마음을 평안으로 지켜 주시고,
  필요한 힘과 안정을 허락하여 주옵소서.

  남편도 사랑과 인내로 아내를 잘 섬기게 하시고,
  조급함보다 신뢰를 배우게 하옵소서.

  우리가 미래를 두려워하기보다
  오늘 함께하시는 하나님을 바라보게 하시고,
  결과를 통제하려 하기보다
  주님의 선하신 손에 맡기게 하옵소서.

  하나님께서 오늘 우리 가정에
  평안과 감사와 소망을 허락해 주시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 7일 주일 가정예배"