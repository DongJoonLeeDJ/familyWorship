title: "하나님께서 우리 가운데 거하시도록" subtitle: "출애굽기 29장" date: "2026-11-01"

calling: "오늘은 주일입니다. 잠시 일상을 내려놓고, 하나님께서 우리 가운데 거하시기를 원하신다는 말씀을 생각하며 예배드리겠습니다."

verse1_title: "하나님께 나아가는 사람들" verse1: "출애굽기 29:4-7 — 아론과 그의 아들들은 물로 씻김을 받고 제사장의 옷을 입은 뒤 기름 부음을 받았습니다. 하나님을 섬기는 직분을 맡기시기 전에 그들을 구별하여 세우시는 장면입니다."

verse2_title: "내가 그들 중에 거하리라" verse2: "출애굽기 29:45-46 — 하나님께서는 이스라엘 자손 중에 거하시며 그들의 하나님이 되시겠다고 말씀하십니다. 출애굽의 목적은 단지 이집트에서 벗어나는 것에 그치지 않고, 하나님께서 그들과 함께 거하시는 백성이 되는 것이었습니다."

reflection: "출애굽기 29장에는 제사장을 세우는 복잡한 절차가 길게 이어지지만, 마지막에는 하나님께서 백성 가운데 거하시겠다는 말씀이 나옵니다. 하나님께서 원하시는 것이 단지 정해진 의식을 잘 지키는 것만은 아니라는 생각이 듭니다. 신앙생활을 하다 보면 해야 할 일과 지켜야 할 것에 집중할 때가 있지만, 그 모든 과정에서 하나님과 어떤 관계를 맺으며 살아가는지도 돌아보게 됩니다. 예배를 드리고 말씀을 읽는 일뿐 아니라 평범한 일상을 살아가는 시간에도 하나님을 의식하며 살아가면 좋겠습니다."

questions: - "신앙생활을 하면서 하나님과의 관계보다 해야 할 일에 더 집중하고 있을 때는 언제인가요?" - "우리 부부가 평범한 일상 속에서도 하나님을 기억하기 위해 실천할 수 있는 작은 일은 무엇일까요?"

prayer: "하나님 아버지, 저희 가운데 거하시기를 원하시는 은혜에 감사드립니다. 신앙생활을 형식적으로 이어가는 데 그치지 않고, 일상 속에서도 하나님과 함께 살아가는 마음을 잃지 않게 해 주세요. 서로를 대하는 말과 행동 속에서도 믿음이 드러나게 하시고, 주일뿐 아니라 평일의 삶에서도 하나님을 기억하며 살아가도록 도와주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 1일 일요일 가정예배"
