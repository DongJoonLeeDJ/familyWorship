title: "마음을 감동시키시는 하나님"
subtitle: "우리가 할 수 없는 곳에서도 일하시는 주님"
date: "2026-06-05"

calling: |
  오늘도 우리를 지켜 주시는 하나님 앞에 나아갑니다.

  우리의 힘으로 할 수 없는 일들이 많지만,
  하나님께서는 보이지 않는 곳에서도 일하시는 분이심을 기억하며
  감사함으로 예배드립니다.

verse1_title: "에스라 1:1"
verse1: |
  바사 왕 고레스 원년에
  여호와께서 예레미야의 입을 통하여 하신 말씀을
  이루게 하시려고
  바사 왕 고레스의 마음을 감동시키시매

verse2_title: "잠언 21:1"
verse2: |
  왕의 마음이 여호와의 손에 있음이
  마치 보의 물과 같아서
  그가 임의로 인도하시느니라

reflection: |
  에스라서의 시작은 놀라운 장면으로 시작됩니다.

  하나님께서는 이스라엘 백성이 할 수 없었던 일을
  고레스 왕의 마음을 움직이심으로 이루어 가셨습니다.

  당시 백성들은 자신들의 힘만으로는
  예루살렘으로 돌아갈 수도,
  성전을 다시 세울 수도 없었습니다.

  그러나 하나님께서는
  그들이 통제할 수 없는 영역에서도 일하고 계셨습니다.

  우리의 삶에도 비슷한 순간들이 있습니다.

  지금 우리는 감자의 건강한 성장을 바라며
  하루하루를 조심스럽게 지나가고 있습니다.

  출혈과 피고임의 경과를 직접 조절할 수 없고,
  몸 안에서 일어나는 모든 과정을
  눈으로 확인할 수도 없습니다.

  그래서 때때로 답답함과 무력함을 느끼게 됩니다.

  하지만 오늘 본문은
  하나님께서 우리가 손댈 수 없는 영역에서도
  일하실 수 있는 분임을 보여 줍니다.

  우리는 결과를 만들어 내는 사람이 아니라
  하나님을 신뢰하며 하루를 살아가는 사람들입니다.

  오늘 감자가 자라고 있는 것도,
  아내의 몸이 견디고 있는 것도,
  지금까지 우리를 인도하신 것도
  모두 하나님의 돌보심 가운데 있습니다.

  하나님께서 하셔야 할 일까지 우리가 붙들려 하지 말고,
  하나님께 맡겨야 할 것은 하나님께 맡길 수 있기를 바랍니다.

  오늘도 우리에게 필요한 것은
  미래를 미리 아는 능력이 아니라
  오늘 하나님을 신뢰하는 마음일지 모릅니다.

questions:
  - "최근 내가 통제하려고 붙들고 있었던 일은 무엇인가요?"
  - "하나님께 맡겨야 하지만 여전히 걱정하고 있는 부분은 무엇인가요?"
  - "지금까지 IVF 과정을 돌아볼 때 하나님께 감사할 수 있는 일은 무엇인가요?"

prayer: |
  하나님 아버지,

  오늘도 우리 가정을 붙들어 주시고
  여기까지 인도해 주셔서 감사합니다.

  우리는 감자의 성장을 간절히 바라지만
  모든 과정을 통제할 수는 없습니다.

  하나님께서 고레스의 마음을 감동시키셨던 것처럼,
  우리가 볼 수 없는 곳에서도
  주님의 뜻 가운데 일하고 계심을 믿게 하옵소서.

  아기집 주변의 피고임이 잘 흡수되게 하시고,
  출혈이 멈추게 하시며,
  감자가 건강하게 자라도록 은혜를 베풀어 주옵소서.

  아내의 몸을 보호하여 주시고
  마음에도 평안을 허락하여 주옵소서.

  남편도 불안에 휘둘리기보다
  믿음과 사랑으로 아내를 잘 섬기게 하시고,
  함께 하나님을 의지하며 이 시간을 지나가게 하옵소서.

  우리가 할 수 있는 일은 성실히 하되,
  하나님께 맡겨야 할 것은 하나님께 맡기는
  지혜와 믿음을 허락하여 주옵소서.

  하나님께서 오늘 우리 가정에
  평안과 신뢰의 마음을 허락해 주시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 5일 금요일 가정예배"