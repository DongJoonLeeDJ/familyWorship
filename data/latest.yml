title: "하나님께 드리는 삶의 예배"
subtitle: "예배는 예배당에서 끝나지 않고 삶으로 이어집니다"
date: "2026-06-28"

calling: |
  거룩하신 하나님 아버지,
  주일을 허락하시고 함께 예배드리게 하심에 감사합니다.
  오늘도 우리의 마음을 새롭게 하시고,
  삶으로 드리는 예배를 배우게 하옵소서.

verse1_title: "로마서 12장 1절"
verse1: |
  그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니
  너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라
  이는 너희가 드릴 영적 예배니라.

verse2_title: "이사야 6장 8절"
verse2: |
  내가 또 주의 목소리를 들으니 주께서 이르시되
  내가 누구를 보내며 누가 우리를 위하여 갈꼬 하시니
  그때에 내가 이르되 내가 여기 있나이다 나를 보내소서 하였더니

reflection: |
  예배는 단지 교회에서 드리는 한 시간의 순서만을 의미하지 않습니다.
  하나님의 은혜를 경험한 사람이 하나님께 드리는 삶 전체가 예배입니다.

  이사야는 하나님의 거룩하심을 만난 후 "내가 여기 있나이다"라고 응답했습니다.
  또한 바울은 하나님의 자비를 받은 우리가 우리의 삶을 하나님께 드리는 것이
  영적 예배라고 권면합니다.

  이번 한 주를 돌아보면 출장도 있었고,
  무사히 돌아올 수 있었던 은혜도 있었습니다.
  평안한 휴식도 누렸고,
  아내와 감자가 하나님의 보호하심 가운데 또 한 주를 보낼 수 있었습니다.

  하나님께서는 특별한 순간뿐 아니라
  평범한 일상 속에서도 우리의 예배를 기뻐하십니다.
  서로를 사랑하는 말 한마디,
  가족을 위한 작은 배려,
  감사하는 마음과 정직한 삶도 하나님께 드리는 예배가 될 수 있습니다.

  오늘 주일을 마무리하며,
  내일부터 시작될 새로운 한 주도 하나님께 올려드리는 예배가 되기를 소망합니다.
  우리의 태도와 선택이 하나님을 향한 사랑의 고백이 되기를 바랍니다.

questions:
  - "이번 한 주 동안 가장 크게 경험한 하나님의 은혜는 무엇이었나요?"
  - "내 삶에서 하나님께 드리는 예배가 될 수 있는 작은 실천은 무엇일까요?"
  - "새로운 한 주를 시작하며 하나님께 맡기고 싶은 일은 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  오늘도 주일을 허락하시고 예배드릴 수 있게 하심에 감사합니다.

  교회에서 드리는 예배뿐 아니라
  우리의 일상도 하나님께서 기뻐하시는 예배가 되게 하옵소서.

  새로운 한 주에도 우리의 마음을 새롭게 하시고,
  말과 행동, 생각 속에서 주님을 닮아가게 하옵소서.

  아내를 사랑으로 붙들어 주셔서 입덧 가운데서도 힘과 평안을 더하여 주시고,
  감자를 오늘도 건강하게 지켜 주셔서 날마다 생명이 아름답게 자라게 하옵소서.

  우리 부부가 서로를 더욱 사랑하며,
  작은 일에도 감사하고 하나님을 신뢰하는 가정이 되게 하옵소서.

  우리의 삶 전체가 하나님께 드리는 예배가 되기를 소망하며,
  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 28일 주일 가정예배"