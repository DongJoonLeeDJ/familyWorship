title: "기다림 끝에 드리는 감사"

subtitle: "감사할 수 있는 오늘을 허락하심"

date: "2026-10-14"

calling: "오랫동안 마음에 품고 있던 소식을 들은 오늘, 감사한 마음을 하나님 앞에 솔직하게 올려드리며 예배를 시작합니다."

verse1_title: "범사에 감사하라"

verse1: "데살로니가전서 5:18 — 범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라"

verse2_title: "여호와께 감사하라"

verse2: "시편 136:1 — 여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다"

reflection: "한 달이 넘도록 기다렸던 양수검사 결과가 드디어 모두 나왔네요. 1차와 2차에 이어 3차 결과까지 괜찮다는 소식을 들었으니, 그동안 마음에 쌓였던 무게가 조금은 내려갔을 것 같습니다. 할렐루야, 감사한 일입니다. 아직 미세음경에 관한 선생님의 견해가 어떻게 달라질지는 모르고, 내일은 임당 재검도 남아 있지만 오늘만큼은 이미 들은 좋은 소식을 기뻐해도 되겠습니다. 감사는 모든 걱정이 사라진 뒤에야 할 수 있는 것이 아니라, 아직 남은 일이 있더라도 지금 주어진 기쁨을 온전히 누리는 것일 수 있겠습니다. 그동안 결과를 기다리며 마음 졸였던 시간까지 없었던 일로 만들 필요는 없습니다. 그 시간을 지나 오늘 감사하다고 고백할 수 있게 된 것 자체가 참 귀합니다."

questions:
  - "오늘 결과를 듣고 가장 먼저 들었던 생각이나 감정은 무엇이었을까?"
  - "아직 남아 있는 걱정 때문에 오늘 누릴 수 있는 기쁨까지 미루고 있지는 않을까?"

prayer: "하나님, 감사합니다. 한 달이 넘도록 기다렸던 양수검사 결과가 모두 괜찮다는 소식을 듣게 하시니 정말 감사합니다. 결과를 기다리는 동안 마음이 무겁고 여러 생각이 많았는데, 오늘은 기쁜 마음으로 할렐루야를 고백합니다. 아직 미세음경에 관해 더 살펴볼 부분이 있고 내일 임당 재검도 남아 있지만, 남은 걱정이 오늘의 감사를 덮어버리지 않게 해주세요. 아내와 함께 이 기쁜 소식을 나누며 잠시라도 마음 편히 쉴 수 있게 해주시고, 앞으로 확인해야 할 일들도 차분하게 마주하게 해주세요. 저희가 받은 위로와 기쁨을 기억하며 감사하는 마음으로 살아가기를 바랍니다. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 14일 수요일 가정예배"
