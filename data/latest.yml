title: "하나님께 맡기고 함께 걷는 하루"
subtitle: "오늘의 작은 순간도 주님 안에서 살아갑니다"
date: "2026-08-29"

calling: |
  이번 한 주도 여러 마음과 일들 가운데 지나왔습니다.
  이제 잠시 멈추어 오늘의 마음을 하나님께 맡깁니다.
  잘한 것도, 아쉬운 것도 그대로 내려놓고 우리 곁에 계신 주님을 바라보며 예배하겠습니다.

verse1_title: "여호와를 의지하라"
verse1: |
  잠언 3:5-6
  너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라
  너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라

verse2_title: "나의 길을 아시는 하나님"
verse2: |
  시편 139:3
  나의 모든 길과 내가 눕는 것을 살펴보셨으므로
  나의 모든 행위를 익히 아시오니

reflection: |
  우리는 내가 무엇을 해야 할지 생각하면서 하루를 살아갑니다. 오늘 해야 할 일도 알고, 앞으로 준비해야 할 것도 있습니다. 하지만 아무리 꼼꼼하게 생각해도 내가 모르는 것이 더 많습니다.

  그래서 잠언은 우리의 명철을 의지하지 말고 하나님을 신뢰하라고 합니다. 이것은 생각하지 말라는 뜻이 아니라, 내가 아는 것이 전부가 아니라는 사실을 인정하는 것입니다. 내가 보지 못하는 것까지 아시는 하나님께 내 길을 맡기는 것입니다.

  요즘 우리에게도 그런 순간들이 있습니다. 앞으로 감자와 함께 살아갈 날을 생각하면 기대도 되지만, 한편으로는 "우리가 잘할 수 있을까?" 하는 마음도 생깁니다. 하지만 아직 오지 않은 날까지 미리 살아낼 필요는 없겠습니다. 그날이 오면 그날의 은혜를 구하면 됩니다.

  오늘도 마찬가지입니다. 완벽하게 하루를 만들어야 하는 것이 아니라, 주어진 자리에서 하나님을 인정하며 살아가면 됩니다. 아내와 함께 웃을 일이 있으면 웃고, 서로 서운한 일이 생기면 다시 이야기하고, 해야 할 일이 있다면 하나씩 해 나가면 됩니다.

  하나님께 맡긴다는 것은 아무것도 하지 않는 것이 아니라, 내가 할 몫을 다하면서 결과까지 내가 책임지려고 하지 않는 것입니다. 우리의 길을 아시는 분이 계시기에 조금은 내려놓을 수 있습니다.

  오늘 밤에는 "앞으로 어떻게 하지?"보다 "오늘 여기까지 인도하신 하나님께 감사하자"라고 말할 수 있으면 좋겠습니다. 우리에게 필요한 것은 모든 답을 아는 것이 아니라, 길을 아시는 분을 신뢰하는 것이니까요.

questions:
  - "요즘 내가 내 힘으로 다 해결하려고 붙잡고 있는 것은 무엇인가요?"
  - "오늘 아내와 함께하며 감사했던 작은 순간은 무엇인가요?"
  - "앞으로의 일 중 하나님께 맡기고 싶은 것은 무엇인가요?"

prayer: |
  하나님, 우리가 알지 못하는 것까지 아시는 주님을 신뢰합니다.
  모든 일을 미리 걱정하며 붙잡기보다 오늘의 몫을 충실히 살아가게 해 주세요.
  아내가 오늘 편안히 쉬며 기쁨을 누리게 하시고, 감자를 기다리는 시간도 주님께 맡기며 감사하게 해 주세요.
  우리 부부가 서로에게 조급함을 더하기보다 함께 주님을 의지하는 사람이 되게 하시고, 앞으로의 길도 주님께서 선하게 인도해 주세요.
  우리의 길을 아시는 예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 8월 29일 토요일 가정예배"
