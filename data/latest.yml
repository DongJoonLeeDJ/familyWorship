title: "축복을 이어가는 사람"
subtitle: "내게 주어진 믿음을 다음 세대로"
date: "2026-10-01"
calling: "오늘은 야곱이 요셉의 아들들을 축복하는 모습을 바라보며, 우리에게 주어진 믿음과 사랑을 다음 세대에 어떻게 전할지 생각하며 예배합니다."

verse1_title: "손을 어긋나게 얹어"
verse1: "이스라엘이 오른손을 펴서 에브라임의 머리에 얹고 왼손을 므낫세의 머리에 얹으니 므낫세는 장자라 그의 손을 바르게 하려 하여 그의 아버지에게 그 손을 옮기려고 하였더라. (창세기 48:14)"

verse2_title: "나를 기르신 하나님"
verse2: "나를 모든 환난에서 건지신 여호와의 사자께서 이 아이들에게 복을 주시오며 이들로 내 이름과 내 조상 아브라함과 이삭의 이름으로 칭하게 하시오며 이들이 세상에서 번식되게 하시기를 원하나이다. (창세기 48:16)"

reflection: "창세기 48장에서 야곱은 요셉의 두 아들을 자신의 아들처럼 품고 축복합니다. 요셉이 생각했던 순서와 달리 야곱은 작은 아들 에브라임에게 오른손을 얹었지만, 그보다 더 마음에 남는 것은 야곱이 자신의 삶을 돌아보며 하나님께서 지금까지 자신을 기르시고 인도하셨다고 고백하는 모습입니다. 우리도 감자를 기다리면서 이제 곧 부모가 된다는 사실을 조금씩 실감하고 있습니다. 감자에게 무엇을 많이 가르쳐줄 수 있을지보다, 우리가 먼저 어떤 모습으로 살아가고 있는지가 더 중요할 것 같습니다. 언젠가 감자가 우리를 돌아볼 때, 하나님을 믿는 것이 어떤 것인지 우리의 삶을 통해 자연스럽게 볼 수 있으면 좋겠습니다."

questions:
  - "감자에게 꼭 물려주고 싶은 우리의 삶의 모습은 무엇일까?"
  - "부모가 되기 전에 우리 부부가 먼저 돌아보고 싶은 모습은 무엇일까?"

prayer: "하나님, 야곱의 삶을 돌아보며 지금까지 자신을 인도하신 하나님을 고백하게 하셨던 것처럼 우리도 지나온 시간을 돌아보며 주님의 은혜를 기억하게 해주세요. 감자를 기다리며 부모가 되어가는 우리에게 사랑과 지혜를 주시고, 말로 가르치기 전에 우리의 삶으로 믿음을 보여줄 수 있게 해주세요. 감자가 자라가는 모든 과정에서 우리 부부가 조급하게 앞서가지 않고 아이를 한 사람으로 존중하며 사랑하게 해주세요. 우리에게 맡겨주신 가정을 소중히 돌보며, 다음 세대에 좋은 것을 전하는 부모가 되어가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 1일 목요일 가정예배"
