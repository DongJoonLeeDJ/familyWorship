title: "보이지 않는 자리에서도"
subtitle: "하나님 앞에서 살아가는 사람"
date: "2026-09-21"
calling: "사람의 눈보다 하나님의 눈을 의식하며 오늘을 시작합니다."

verse1_title: "요셉과 함께하신 하나님"
verse1: "여호와께서 요셉과 함께하시므로 그가 형통한 자가 되어 그의 주인 애굽 사람의 집에 있으니. (창세기 39:2)"

verse2_title: "악이 스스로 무너지다"
verse2: "아비멜렉이 이스라엘 자손을 다스린 지 삼 년에 하나님이 아비멜렉과 세겜 사람들 사이에 악한 영을 보내시매. (사사기 9:22-23)"

reflection: "창세기 39장의 요셉은 하나님이 함께하셨지만 상황은 오히려 점점 어려워집니다. 유혹을 거절한 뒤 억울하게 감옥에 가기도 합니다. 반면 사사기 9장의 아비멜렉은 스스로 권력을 잡았지만 결국 자신이 만든 폭력과 갈등 속에서 무너집니다. 두 이야기를 같이 읽으니 당장의 상황이 하나님의 함께하심을 판단하는 기준은 아니라는 생각이 듭니다. 일이 잘 풀리는 날뿐 아니라 억울하고 답답한 자리에서도 하나님 앞에서 바르게 살아가는 것이 중요하겠습니다."

questions:
  - "지금 내가 처한 상황만 보고 하나님이 함께하시는지를 판단하고 있지는 않을까?"
  - "사람이 보지 않는 자리에서 내가 지키고 싶은 것은 무엇일까?"

prayer: "하나님, 상황이 뜻대로 풀리지 않을 때에도 주님이 함께하심을 잊지 않게 해주세요. 눈앞의 결과보다 하나님 앞에서 바르게 살아가는 것을 중요하게 여기게 하시고, 우리 부부가 서로에게도 정직하고 따뜻하게 살아가게 해주세요. 감자의 앞날도 주님의 손에 맡깁니다. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 21일 월요일 가정예배"