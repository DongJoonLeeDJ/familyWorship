title: "삶의 중심을 다시 맞추다"
subtitle: "하나님을 중심에 모시고 살아가는 하루"
date: "2026-08-19"

calling: |
  하루를 살아가다 보면 해야 할 일이 많아질수록
  무엇이 정말 중요한지 놓칠 때가 있습니다.
  오늘 수요예배에서 들은 말씀처럼,
  우리의 삶에도 중심이 필요합니다.

  오늘 밤에는 하나님께서 이스라엘의 진 가운데
  성막을 중심에 두게 하셨던 장면을 바라보며,
  우리 부부의 삶에서 무엇이 중심에 놓여 있는지
  조용히 돌아보겠습니다.

verse1_title: "회막을 향하여 진을 치라"
verse1: |
  민수기 2:1-2
  여호와께서 모세와 아론에게 말씀하여 이르시되
  이스라엘 자손은 각각 자기의 진영의 군기와
  자기의 조상의 가문의 기호 곁에 진을 치되
  회막을 향하여 사방으로 치라

verse2_title: "먼저 그의 나라를 구하라"
verse2: |
  마태복음 6:33
  그런즉 너희는 먼저 그의 나라와 그의 의를 구하라
  그리하면 이 모든 것을 너희에게 더하시리라

reflection: |
  이스라엘 백성이 광야에서 진을 칠 때도
  자기 마음대로 자리를 정했던 것은 아니었습니다.
  하나님께서는 각 지파가 어디에 자리 잡을지를 정해 주셨고,
  그 중심에는 회막이 있었습니다.

  오늘 수요예배의 제목처럼
  "정렬"이라는 말을 생각하게 됩니다.

  정렬은 모든 것을 똑같이 만드는 것이 아닙니다.
  각자 자기 자리에 있으면서도
  무엇을 중심으로 살아가는지를 맞추는 것입니다.

  우리 삶도 그렇습니다.

  일도 중요하고,
  돈도 중요하고,
  건강도 중요하고,
  가족도 중요합니다.
  앞으로는 감자를 키우는 일도 우리 삶에서 아주 중요한 자리가 될 것입니다.

  문제는 중요한 것이 너무 많아질 때입니다.

  중요한 것들이 서로 중심 자리를 차지하려고 하면
  우리의 마음은 쉽게 복잡해집니다.
  일을 중심에 놓으면 가족이 밀려나고,
  가족만 바라보다 보면 하나님을 잊을 수 있고,
  미래에 대한 걱정이 중심을 차지하면
  오늘의 감사가 사라지기도 합니다.

  그래서 신앙은 모든 것을 버리고
  하나님만 생각하며 사는 것이 아니라,
  하나님을 중심에 모신 채 다른 것들을 제자리에 두는 것인지도 모르겠습니다.

  민수기의 이스라엘은 각자 자기 자리가 있었습니다.
  하나님께서 주신 역할도 달랐습니다.
  그런데 모두가 회막을 중심으로 자리를 잡았습니다.

  우리 부부도 서로 역할이 다르고,
  직장에서 하는 일도 다르고,
  성격도 다르고,
  앞으로 부모가 되어 가는 과정에서 맡게 될 일도 조금씩 다를 것입니다.

  그래도 한 가지 중심은 같았으면 좋겠습니다.

  "우리 가정의 중심에는 하나님이 계신다."

  이것은 매 순간 성경책만 들고 있어야 한다는 뜻은 아닙니다.
  오히려 하나님을 중심에 둔다는 것은
  일할 때도 하나님을 잊지 않고,
  아내와 이야기할 때도 하나님 앞에 있다는 것을 기억하고,
  감자를 기다릴 때도 우리의 계획만 붙들지 않는 것입니다.

  오늘 수요예배를 듣고 집에 돌아와
  다시 일상으로 돌아왔지만,
  예배에서 들은 말씀이 일상과 따로 떨어져 있을 필요는 없습니다.

  하나님을 중심에 둔다는 것은
  예배당 안에서만 하나님을 바라보는 것이 아니라
  집으로 돌아온 뒤에도 삶의 방향을 조금씩 조정하는 것이니까요.

  특히 앞으로 우리의 삶에는
  새로운 변화가 많이 생길 것입니다.

  감자가 태어나면 지금보다 훨씬 바빠질 것이고,
  우리가 예상했던 계획이 자주 바뀔 수도 있습니다.
  잠도 부족하고, 해야 할 일도 많아질 것입니다.

  그때 "하나님을 중심에 둬야지"라는 말이
  오히려 또 하나의 부담이 되지 않았으면 좋겠습니다.

  완벽하게 모든 것을 정리한 뒤 하나님을 중심에 모시는 것이 아니라,
  엉망인 하루 가운데서도 다시 중심을 찾는 것입니다.

  오늘은 일에 치였지만
  내일은 잠깐 기도할 수 있고,
  오늘은 서로에게 날카로웠다면
  다음에는 먼저 미안하다고 말할 수 있습니다.

  하나님께 돌아오는 작은 방향 전환도
  삶을 다시 정렬하는 일이 될 수 있습니다.

  예수님께서도 "먼저 그의 나라와 그의 의를 구하라"고 말씀하셨습니다.
  먼저라는 말이 중요합니다.

  모든 문제를 해결한 다음 하나님을 찾으라는 것이 아니라
  하나님을 먼저 바라볼 때
  다른 것들도 제자리를 찾아가기 시작한다는 말씀처럼 들립니다.

  그래서 오늘 밤 우리도
  삶 전체를 완벽하게 정리하려 하지 않아도 좋겠습니다.

  그냥 한 번 바라보면 됩니다.

  "지금 내 마음의 중심에는 무엇이 가장 크게 자리하고 있지?"

  일일 수도 있고,
  걱정일 수도 있고,
  돈이나 미래일 수도 있고,
  혹은 아주 좋은 것인 가족일 수도 있습니다.

  좋은 것이라도 하나님보다 중심에 놓이면
  결국 우리를 지치게 할 수 있습니다.

  하나님께서 우리에게 주신 것들을 사랑하되,
  그것들을 주신 하나님을 잊지 않는 것.
  그것이 오늘 우리가 배울 수 있는 정렬일 것 같습니다.

  그리고 그 중심에는 우리가 스스로 찾아낸 하나님이 아니라
  먼저 우리를 찾아오신 예수님이 계십니다.

  우리는 자꾸 중심을 잃습니다.
  그런데 예수님께서는 그런 우리를 버려두지 않으십니다.
  다시 주님께 돌아갈 수 있는 길을 열어 주십니다.

  그러니 오늘 하루가 완벽하지 않았어도 괜찮습니다.

  지금 이 밤,
  다시 하나님을 바라보면 됩니다.

  우리 부부의 자리도,
  감자를 기다리는 시간도,
  일과 앞으로의 수많은 계획도
  하나님께서 주신 자리 안에 놓고 살아가면 됩니다.

  모든 것을 잘하는 가정이 아니라
  중심을 잃었을 때 다시 주님께 방향을 돌리는 가정.

  그것이면 충분하지 않을까요.

questions:
  - "요즘 내 마음의 중심을 가장 많이 차지하고 있는 것은 무엇인 것 같나요?"
  - "우리 부부가 하나님을 중심에 두고 살아간다는 것을 아주 작은 행동 하나로 표현한다면 무엇일까요?"
  - "감자가 태어난 뒤에도 우리 가정의 중심을 잃지 않기 위해 지금부터 함께 지키고 싶은 것은 무엇인가요?"

prayer: |
  하나님 아버지,
  오늘 예배를 통해 우리의 삶을 돌아보게 하시니 감사합니다.
  여러 가지 중요한 것들 사이에서 무엇이 중심인지 잊지 않게 해 주세요.

  우리의 일과 계획, 가족과 미래를 모두 귀하게 여기되
  그것들을 주신 하나님보다 앞세우지 않게 하시고,
  마음이 흐트러질 때마다 다시 주님께 방향을 돌리게 해 주세요.

  아내의 마음에도 주님의 평안을 더해 주세요.
  해야 할 일과 앞으로의 변화 때문에 마음이 복잡해질 때
  모든 것을 한꺼번에 해결하려 하지 않고
  오늘 주어진 하루를 편안히 살아가게 해 주세요.

  감자를 기다리는 시간도 주님께 맡깁니다.
  감자가 우리 삶의 중심을 빼앗는 존재가 아니라
  하나님께서 맡겨 주신 귀한 생명임을 기억하게 하시고,
  부모가 되어 가는 과정에서도 주님을 바라보게 해 주세요.

  우리 부부가 서로에게 하나님을 향해 방향을 돌릴 수 있도록 돕는 사람이 되게 해 주세요.
  바쁜 날에는 잠시 멈출 수 있게 하고,
  마음이 어긋난 날에는 다시 가까워질 수 있게 하며,
  함께 살아가는 모든 자리에서 주님을 기억하게 해 주세요.

  우리의 삶이 완벽하게 정돈되어서가 아니라
  예수님께서 우리의 중심이 되어 주시기 때문에
  다시 시작할 수 있음을 믿습니다.
  오늘도 주님 안에서 우리의 방향을 바로잡고
  평안히 하루를 내려놓게 해 주세요.

  예수 그리스도의 이름으로 기도드립니다.
  아멘.

