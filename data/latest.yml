title: "네가 누구든, 내가 너와 함께한다"

subtitle: "출애굽기 3장, 모세를 다시 부르시는 하나님"

date: "2026-10-07"

calling: "모세는 광야에서 오랜 시간을 보냈고, 어느새 자신이 무엇인가를 해낼 사람이라는 생각에서도 멀어져 있었던 것 같습니다. 그런데 하나님은 떨기나무 가운데서 모세를 부르십니다. 모세가 자신을 어떻게 생각하고 있는지는 하나님이 그를 부르시는 데 걸림돌이 되지 않았습니다."

verse1_title: "출애굽기 3장 11절"

verse1: "모세가 하나님께 아뢰되 내가 누구이기에 바로에게 가며 이스라엘 자손을 애굽에서 인도하여 내리이까"

verse2_title: "출애굽기 3장 12절"

verse2: "하나님이 이르시되 내가 반드시 너와 함께 있으리라 네가 그 백성을 애굽에서 인도하여 낸 후에 너희가 이 산에서 하나님을 섬기리니 이것이 내가 너를 보낸 증거니라"

reflection: "모세의 첫 반응이 ‘제가 할 수 있습니다’가 아니라 ‘내가 누구이기에’였다는 것이 오늘따라 눈에 들어옵니다. 사람은 살면서 자신의 지난 경험이나 현재의 모습 때문에 스스로를 작게 생각할 때가 있습니다. 하지만 하나님은 모세에게 네가 충분한 사람이라고 설득하기보다 ‘내가 반드시 너와 함께 있으리라’고 말씀하십니다. 이제 우리도 부모가 되어가는 길에 들어서면서 잘할 수 있을까 싶은 순간들이 있을 것 같습니다. 좋은 부모가 되는 방법을 모두 알고 시작하는 사람은 없으니까요. 감자를 기다리는 우리에게도 필요한 것은 완벽하게 준비된 자신감보다는, 부족한 모습 그대로 한 걸음씩 배워가는 마음일지 모르겠습니다."

questions:
  - "요즘 내가 ‘내가 과연 잘할 수 있을까’ 하고 작아지는 부분은 무엇일까?"
  - "부모가 되어가는 우리에게 지금 가장 필요하다고 느끼는 것은 무엇일까?"

prayer: "하나님, 모세가 자신을 바라보며 ‘내가 누구이기에’라고 물었던 마음을 이해할 것 같습니다. 우리도 앞으로의 삶과 부모가 되는 일을 생각하며 부족함을 느낄 때가 있습니다. 그럴 때 스스로를 과대평가하지도, 지나치게 작게 여기지도 않게 해주세요. 우리가 모든 것을 잘할 수 있어서가 아니라, 필요한 순간마다 배우고 서로 도우며 걸어갈 수 있게 해주세요. 감자를 맞이할 준비를 하면서 우리에게 필요한 지혜와 사랑을 조금씩 채워주시고, 아직 알지 못하는 내일을 미리 두려워하기보다 오늘 해야 할 일을 잘 감당하게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 7일 수요일 가정예배"
