title: "내면에서 역사하시는 성령님"
subtitle: "기도와 찬송으로 주님과 동행하는 하루"
date: "2026-06-24"

calling: |
  하나님 아버지,
  오늘도 우리 안에 거하시는 성령님을 통해 역사하심에 감사드립니다.
  우리의 마음을 주님께 향하게 하시고, 예배 가운데 함께하여 주옵소서.

verse1_title: "고린도전서 14장 15절"
verse1: |
  그러면 어떻게 할까 내가 영으로 기도하고 또 마음으로 기도하며
  내가 영으로 찬송하고 또 마음으로 찬송하리라

verse2_title: "갈라디아서 5장 22-23절"
verse2: |
  오직 성령의 열매는 사랑과 희락과 화평과 오래 참음과
  자비와 양선과 충성과 온유와 절제니
  이같은 것을 금지할 법이 없느니라

reflection: |
  하나님께서는 우리를 홀로 살아가도록 두지 않으시고,
  성령님을 우리 안에 보내 주셔서 날마다 함께하시고 역사하십니다.

  우리는 때로 눈에 보이는 결과나 상황의 변화를 먼저 바라보지만,
  성령님께서는 우리의 내면을 빚어 가시는 일을 쉬지 않고 행하십니다.
  사랑과 화평, 온유와 절제 같은 성령의 열매는 하루아침에 만들어지는 것이 아니라
  하나님과 동행하는 시간 속에서 조금씩 자라납니다.

  기도와 찬송은 우리의 시선을 하나님께로 돌리게 합니다.
  상황이 순탄할 때뿐 아니라 예상치 못한 어려움과 감정의 흔들림 속에서도
  주님을 바라볼 때 성령님께서 우리 마음을 붙드시고 인도하십니다.

  오늘도 부부가 함께 하나님을 의지하며,
  우리 안에서 일하시는 성령님의 역사하심을 신뢰하면 좋겠습니다.
  눈에 보이는 변화뿐 아니라 보이지 않는 내면의 성장 또한
  하나님께서 주시는 귀한 은혜임을 기억했으면 좋겠습니다.

questions:
  - "최근 하나님께서 내 마음을 변화시키고 계심을 느낀 순간이 있었나요?"
  - "오늘 내가 더욱 맺기 원하는 성령의 열매는 무엇인가요?"
  - "기도와 찬송을 통해 하나님께 맡기고 싶은 일은 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  우리 안에 성령님을 보내 주시고 날마다 함께하여 주심에 감사드립니다.

  눈에 보이는 결과만 바라보지 않게 하시고,
  우리의 내면을 빚어 가시는 하나님의 손길을 신뢰하게 하옵소서.

  기도할 때마다 주님을 더욱 의지하게 하시고,
  찬송할 때마다 하나님께서 주시는 평안을 누리게 하옵소서.

  아내의 몸과 마음을 지켜 주셔서 입덧 가운데서도 힘을 더하여 주시고,
  하나님께서 주시는 위로와 평안으로 채워 주옵소서.

  감자를 건강하게 보호하여 주시고,
  오늘도 안전하게 자라도록 은혜를 베풀어 주옵소서.

  우리 부부가 어떤 상황 속에서도 성령님과 동행하며,
  사랑과 화평의 열매를 맺어 가는 가정이 되게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 24일 수요일 가정예배"