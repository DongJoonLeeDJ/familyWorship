title: "바다 앞에서도 길을 여시는 하나님"

subtitle: "앞이 막막해 보여도 주님을 바라보며"

date: "2026-10-17"

calling: "이스라엘 백성 앞에는 바다가 있었고 뒤에는 애굽의 군대가 다가오고 있었습니다. 어디로 가야 할지 알 수 없는 순간에도 하나님은 그들을 버려두지 않으셨습니다. 오늘 우리도 막막한 순간에 주님을 바라보며 예배를 시작합니다."

verse1_title: "너희는 두려워하지 말라"

verse1: "출애굽기 14:13 — 모세가 백성에게 이르되 너희는 두려워하지 말고 가만히 서서 여호와께서 오늘 너희를 위하여 행하시는 구원을 보라 너희가 오늘 본 애굽 사람을 영원히 다시 보지 아니하리라"

verse2_title: "너희가 어찌하여 내게 부르짖느냐"

verse2: "출애굽기 14:15 — 여호와께서 모세에게 이르시되 너는 어찌하여 내게 부르짖느냐 이스라엘 자손에게 명령하여 앞으로 나아가게 하고"

reflection: "이스라엘 백성은 애굽에서 벗어났지만, 곧바로 편안한 길을 만난 것은 아니었습니다. 앞에는 바다가 있고 뒤에서는 군대가 쫓아왔습니다. 두려움이 커지자 그들은 모세를 원망했고, 차라리 애굽에 남아 있는 편이 나았겠다고 생각했습니다. 우리도 문제가 지나갔다고 생각한 순간 또 다른 걱정을 마주할 때가 있습니다. 그때는 이미 지나온 길마저 잘못된 선택처럼 느껴지기도 합니다. 그러나 하나님은 이스라엘에게 두려워하지 말라고 하시면서 동시에 앞으로 나아가라고 말씀하셨습니다. 믿음은 아무것도 두렵지 않은 상태가 아니라, 두려움 속에서도 하나님을 바라보며 다음 걸음을 내딛는 것인지 모릅니다. 모든 길이 한꺼번에 보이지 않아도 괜찮습니다. 오늘 우리가 할 수 있는 작은 걸음을 걷고, 열리지 않은 길은 주님께 맡겨 봅시다."

questions:

- "요즘 우리 앞을 가로막은 바다처럼 느껴지는 걱정은 무엇인가요? 서로의 마음을 어떻게 도울 수 있을까요?"
- "아직 모든 것이 해결되지 않았더라도, 오늘 믿음으로 내디딜 수 있는 작은 걸음은 무엇인가요?"

prayer: "하나님 아버지, 앞이 막막할 때 두려움에 사로잡혀 지난 선택을 후회하거나 서로를 원망하지 않게 해 주세요. 이스라엘 앞에 바다가 놓여 있었던 것처럼 저희에게도 당장 답을 찾기 어려운 일이 있지만, 보이는 상황만으로 주님의 인도하심을 단정하지 않게 해 주세요. 기다려야 할 때는 기다리고, 나아가야 할 때는 용기를 내어 한 걸음을 내딛게 해 주세요. 부부가 서로의 불안을 가볍게 여기지 않고 함께 들어 주며, 걱정 속에서도 평안을 나눌 수 있도록 도와주세요. 감자의 앞날도 저희가 모두 계획하거나 알 수는 없지만, 하루하루 주어진 책임을 다하며 주님을 신뢰하게 해 주세요. 바다가 갈라지는 기적만 바라기보다, 오늘 주님께서 맡기신 길을 충실히 걸어가게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 17일 토요일 가정예배"