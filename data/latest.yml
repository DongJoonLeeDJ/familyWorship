title: "날을 세는 사람은 오늘을 삽니다"
subtitle: "우리에게 주어진 오늘을 지혜롭게 살아가기"
date: "2026-08-26"

calling: |
  오늘도 우리에게 하루를 주신 하나님 앞에 잠시 멈춥니다.
  지나간 날은 감사로 맡겨 드리고, 아직 오지 않은 날은 주님께 맡기며,
  지금 우리에게 주어진 오늘을 바라보며 예배하겠습니다.

verse1_title: "우리에게 우리 날 계수함을 가르치사"
verse1: |
  시편 90:10, 12
  우리의 연수가 칠십이요 강건하면 팔십이라도
  그 연수의 자랑은 수고와 슬픔뿐이요 신속히 가니 우리가 날아가나이다
  우리에게 우리 날 계수함을 가르치사 지혜로운 마음을 얻게 하소서

verse2_title: "오늘이라는 날"
verse2: |
  히브리서 3:13
  오직 오늘이라 일컫는 동안에 매일 피차 권면하여
  너희 중에 누구든지 죄의 유혹으로 완고하게 되지 않도록 하라

reflection: |
  시간은 이상합니다. 지나갈 때는 평범해 보이는데, 지나고 나면 다시 돌아갈 수 없습니다. 어제의 하루도 이미 지나갔고, 내일의 하루는 아직 오지 않았습니다. 결국 우리가 실제로 살아갈 수 있는 날은 오늘뿐입니다.

  시편 90편은 인생이 짧다는 사실을 말하면서 단순히 "열심히 살아야 한다"고 다그치지 않습니다. 오히려 "우리 날을 계수하게 하소서"라고 기도합니다. 하루하루가 하나님께서 주신 시간이라는 사실을 알고, 그 시간을 지혜롭게 살아가게 해 달라는 기도입니다.

  우리도 앞으로의 일을 많이 생각합니다. 감자가 태어나면 어떤 부모가 되어야 할지, 무엇을 준비해야 할지, 앞으로 우리 가정이 어떻게 달라질지 생각하게 됩니다. 하지만 아직 오지 않은 날을 걱정하느라 오늘을 놓칠 필요는 없습니다. 감자와 함께할 미래를 준비하는 것도 중요하지만, 지금 아내와 함께 있는 오늘 역시 다시 오지 않을 귀한 시간입니다.

  그래서 오늘은 거창한 일을 해야 한다는 부담보다, 오늘 할 수 있는 사랑을 생각하면 좋겠습니다. 아내의 이야기를 조금 더 들어 주고, 함께 웃고, 감사할 일이 있다면 감사하고, 해야 할 일을 성실하게 감당하는 것. 그렇게 하루를 살아가는 것이 "날을 세는 사람"의 모습일 것입니다.

  그리고 우리의 날이 짧다는 사실이 두려움으로만 남지 않는 이유가 있습니다. 시편 90편은 처음부터 하나님을 "대대에 우리의 거처"라고 고백합니다. 우리의 날은 지나가지만 하나님은 변하지 않으십니다. 우리의 시간이 하나님 안에 있기 때문에 오늘을 소중히 살 수 있습니다.

  모든 날을 완벽하게 살아야 하는 것이 아닙니다. 어제의 부족함을 붙잡고 오늘까지 망치지도 말고, 내일을 미리 살아 버리지도 않으면 됩니다. 하나님께서 주신 오늘을 감사하며 살아가면 됩니다.

questions:
  - "요즘 내가 너무 앞서 걱정하며 오늘을 놓치고 있는 것은 무엇인가요?"
  - "오늘 아내와 함께할 수 있는 작은 행복은 무엇일까요?"
  - "하나님께서 주신 오늘을 지혜롭게 살기 위해 내려놓고 싶은 것은 무엇인가요?"

prayer: |
  영원하신 하나님, 우리에게 오늘이라는 시간을 주셔서 감사합니다.
  지나간 날을 후회하기보다 맡겨 드리고, 아직 오지 않은 날을 염려하기보다 오늘을 충실하게 살아가게 해 주세요.
  아내와 함께하는 평범한 순간을 소중히 여기게 하시고, 감자를 기다리는 지금의 시간도 감사로 누리게 해 주세요.
  우리의 날은 짧지만 우리의 거처가 되시는 하나님은 영원하시니, 오늘도 주님 안에서 지혜롭게 살아가게 해 주세요.
  우리의 모든 시간을 붙드시는 예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 8월 26일 수요일 가정예배"
