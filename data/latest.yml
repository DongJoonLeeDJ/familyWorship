title: "예수님은 누구이십니까?"
subtitle: "답을 아는 것에서 함께 걷는 것으로"
date: "2026-07-27"

calling: |
  사랑의 하나님 아버지,
  오늘 하루도 우리를 지켜 주시고
  이 시간 말씀 앞에 함께 모이게 하심을 감사합니다.
  우리의 마음을 열어 주셔서
  예수님을 더욱 깊이 알고, 더욱 닮아가게 하옵소서.

verse1_title: "마가복음 8:29"
verse1: |
  또 물으시되 너희는 나를 누구라 하느냐 베드로가 대답하여 이르되 주는 그리스도시니이다 하매

verse2_title: "마가복음 8:34-35"
verse2: |
  무리와 제자들을 불러 이르시되 누구든지 나를 따라오려거든 자기를 부인하고 자기 십자가를 지고 나를 따를 것이니라
  누구든지 자기 목숨을 구원하고자 하면 잃을 것이요 누구든지 나와 복음을 위하여 자기 목숨을 잃으면 구원하리라

reflection: |
  함께 말씀을 읽으며 한 가지 질문을 마음에 담아 봅니다.

  예수님께서 오늘 우리에게도 "너는 나를 누구라고 하느냐?"라고 물으신다면, 우리는 어떤 대답을 드릴까요?

  베드로는 "주는 그리스도시니이다."라고 정확하게 고백했습니다. 하지만 바로 이어서 예수님께서 십자가의 길을 말씀하시자 그 길을 막아섰습니다. 예수님을 알고 있다고 생각했지만, 아직 예수님의 마음까지는 이해하지 못했던 것입니다.

  그래서 예수님은 제자들에게 단순히 자신을 아는 것에서 멈추지 말고, 자신을 따라오라고 말씀하십니다. 신앙은 정답을 맞히는 것이 아니라 예수님과 같은 방향으로 걸어가는 삶입니다.

  예수님께서는 우리를 사랑하시기 때문에 십자가를 피하지 않으셨습니다. 그리고 죽음을 이기시고 부활하셔서 우리에게 새로운 생명을 주셨습니다. 우리는 우리의 힘으로 예수님을 따라가는 사람이 아니라, 먼저 사랑받았기에 그 사랑을 따라 살아가는 사람입니다.

  우리도 일상을 살아가다 보면 '내 뜻'과 '하나님의 뜻' 사이에서 고민하는 순간을 만납니다. 그때마다 하나님은 완벽한 사람을 찾으시는 것이 아니라, 다시 주님께 마음을 돌이키는 사람을 기뻐하십니다. 한 걸음은 느릴 수 있고, 때로는 넘어질 수도 있지만, 예수님을 바라보며 다시 일어나는 것이 제자의 길입니다.

  오늘도 우리 가정은 예수님을 함께 바라볼 수 있다는 것이 큰 은혜입니다. 서로를 변화시키려고 애쓰기보다 함께 예수님을 바라본다면, 하나님께서 우리를 조금씩 예수님을 닮아가는 가정으로 빚어 가실 것입니다.

  오늘도 하나님께서 함께하셨습니다. 내일도 하나님께 맡기면 됩니다. 우리보다 앞서 걸어가시는 예수님께서 우리 가정의 길도 끝까지 인도하실 것입니다.

questions:
  - "예수님께서 오늘 나에게 '너는 나를 누구라 하느냐?'라고 물으신다면 어떻게 대답하고 싶나요?"
  - "최근 내 생각보다 하나님의 뜻을 선택하려고 했던 순간이 있었나요?"
  - "이번 주 우리 부부가 함께 예수님을 닮아가기 위해 실천할 수 있는 작은 한 가지는 무엇일까요?"

prayer: |
  사랑의 하나님 아버지,
  우리를 먼저 사랑하시고 예수님을 통해 구원의 길을 열어 주셔서 감사합니다.
  우리가 예수님을 아는 것에 머물지 않고, 날마다 예수님을 닮아가는 삶을 살게 하옵소서.
  사랑하는 아내에게 건강과 기쁨을 더하시고, 매일 주님의 평안으로 채워 주옵소서.
  감자의 모든 시간을 주님의 손으로 지켜 주시고, 지혜와 생명으로 아름답게 자라게 하옵소서.
  우리 부부가 서로를 통해 예수님의 사랑을 배우고, 어떤 상황에서도 함께 믿음으로 걸어가게 하옵소서.
  우리를 끝까지 사랑하시고 인도하시는 예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 7월 27일 월요일 가정예배"
