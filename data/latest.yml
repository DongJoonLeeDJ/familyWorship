title: "작은 변화, 큰 감사"
subtitle: "보이는 성장에 감사하며 조심스러운 소망을 품다"
date: "2026-09-17"
calling: "잠깐 눈을 맞추고 오늘의 마음을 나눕니다."
verse1_title: "시편 121:1-2"
verse1: "내가 산을 향하여 눈을 들리라 나의 도움이 어디서 올까 나의 도움이 천지를 지으신 여호와에게서로다."
verse2_title: "시편 46:1"
verse2: "하나님은 우리의 피난처시요 힘이시니 환난 중에 만날 큰 도움이시라."
reflection: >
  오늘은 감자의 음경이 조금 더 자란 것처럼 보여 감사한 마음이 먼저 들었습니다. 의사 선생님은 전과 비슷하다고 하셨지만, 우리 눈에는 변화가 있어 잠깐 안도했지요. 동시에 남은 검사 결과들이 모두 정상으로 나오기를 바라는 소망과, 아직 확실치 않다는 현실 사이에서 마음이 오갑니다. 기쁨과 불안이 섞인 이 순간을 솔직히 나누고, 서로의 손을 잡고 오늘의 작은 감사에 머물기로 합니다.
questions:
  - "지금 느끼는 감사와 불안 중 어느 쪽이 더 크게 자리하나요?"
  - "서로에게 해 주면 위로가 될 한마디는 무엇일까요?"
  - "내일을 위해 오늘 밤 한 가지로 기도할 것은?"
prayer: >
  주님, 오늘 보인 작은 변화를 감사드립니다. 남은 검사 결과들을 맡기며 불안한 마음을 주께 올립니다.
  아내의 회복과 감자의 평안을 지켜 주시고, 결과를 기다리는 우리 마음에 평안을 허락해 주세요.
  어떤 소식이 와도 서로를 붙들고 담담히 걸어가게 하소서. 아멘.
footer: "2026년 9월 17일 목요일 가정예배"
