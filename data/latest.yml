title: "오늘도 붙들어 주시는 손"
subtitle: "우리의 힘보다 크신 하나님의 신실하심"
date: "2026-08-20"

calling: |
  오늘도 하루가 지나갔습니다.
  어떤 날은 내가 잘 살아낸 것 같고,
  어떤 날은 별로 한 것도 없이 지나간 것처럼 느껴집니다.

  하지만 우리의 하루를 붙들어 주시는 분은
  우리의 힘과 성실함에만 달려 있지 않습니다.
  오늘은 하나님의 신실하심을 바라보며
  마음을 잠시 내려놓겠습니다.

verse1_title: "여호와를 기다리라"
verse1: |
  시편 27:13-14
  내가 산 자들의 땅에서 여호와의 선하심을 보게 될 줄 확실히 믿었도다
  너는 여호와를 기다릴지어다
  강하고 담대하며 여호와를 기다릴지어다

verse2_title: "새 힘을 얻으리라"
verse2: |
  이사야 40:31
  오직 여호와를 앙망하는 자는 새 힘을 얻으리니
  독수리가 날개치며 올라감 같을 것이요
  달음박질하여도 곤비하지 아니하겠고
  걸어가도 피곤하지 아니하리로다

reflection: |
  우리는 자꾸 빨리 가려고 합니다.

  일이 끝나기를 기다리면서도 빨리 끝났으면 하고,
  궁금한 일이 있으면 빨리 답을 알고 싶고,
  기다리는 시간이 길어지면 괜히 마음이 조급해집니다.

  그런데 성경은 때때로 우리에게
  "기다리라"고 말합니다.

  시편 기자는 여호와의 선하심을 믿었기 때문에
  기다릴 수 있었습니다.
  아직 눈앞에 다 나타나지 않았지만
  하나님이 선하시다는 사실을 붙든 것입니다.

  우리도 살아가면서
  모든 것을 바로 확인할 수는 없습니다.

  감자를 기다리는 시간도 그렇고,
  앞으로 우리 가정에 어떤 일들이 생길지도 그렇습니다.
  지금 당장 답을 알 수 없는 일들이 있습니다.

  그럴 때 믿음은
  모든 결과를 미리 아는 것이 아니라
  결과를 아시는 하나님을 신뢰하는 것입니다.

  이사야는 여호와를 앙망하는 자가 새 힘을 얻는다고 말합니다.
  여기서 중요한 것은
  하나님을 바라보면 모든 일이 즉시 쉬워진다는 뜻은 아니라는 것입니다.

  지친 사람도 여전히 걸어가야 합니다.
  다만 혼자 걸어가는 것이 아닙니다.

  우리 부부도 앞으로 그런 날들을 만나게 될 것입니다.
  기쁜 날도 있겠지만 피곤한 날도 있을 것이고,
  부모가 된 뒤에는 예상하지 못한 일도 많을 것입니다.

  그때 서로에게
  "왜 이것도 못 해?"라고 하기보다
  "오늘은 여기까지만 해도 괜찮아"라고 말해 줄 수 있으면 좋겠습니다.

  하나님께서 우리에게 주시는 새 힘은
  우리가 한 번도 지치지 않는 힘이 아니라,
  지쳤을 때에도 다시 걸어갈 수 있게 하는 힘일 테니까요.

  그리고 오늘 밤에는
  우리가 잘 살아냈다는 사실보다
  하나님께서 오늘도 우리를 붙드셨다는 사실을 기억하면 좋겠습니다.

  우리는 내일을 알지 못하지만
  하나님은 아십니다.

  우리가 모든 것을 준비하지 못해도
  하나님께서 우리의 부족함을 아십니다.

  그래서 오늘 하루를 주님께 맡기고
  편안히 쉬어도 됩니다.

  예수님 안에서 우리는
  우리의 힘으로 하나님께 인정받으려고 애쓰는 사람들이 아니라,
  이미 사랑받은 사람으로 살아갑니다.

  오늘도 그 사랑을 의지해서
  천천히, 그러나 다시 걸어가면 됩니다.

questions:
  - "요즘 내가 조금 빨리 답을 얻고 싶어 하는 일은 무엇인가요?"
  - "오늘 서로에게 '괜찮아, 천천히 해도 돼'라고 말해 주고 싶은 일이 있나요?"
  - "하나님께 맡기고 편히 잠들고 싶은 것은 무엇인가요?"

prayer: |
  하나님 아버지,
  오늘도 우리를 여기까지 인도해 주셔서 감사합니다.
  조급한 마음이 들 때마다
  우리의 시간보다 하나님의 때를 신뢰하게 해 주세요.

  아내의 마음과 몸에 쉼을 주시고,
  오늘의 수고를 내려놓고 편안히 잠들게 해 주세요.
  작은 기쁨을 누리며 내일을 맞이할 힘도 허락해 주세요.

  감자를 기다리는 시간도 주님께 맡깁니다.
  우리가 보지 못하는 시간까지 주님께서 알고 계심을 믿으며,
  기다림 속에서도 감사할 수 있게 해 주세요.

  우리 부부가 서로의 피곤함을 이해하고
  힘든 날에는 조금 더 따뜻하게 대하게 해 주세요.
  함께 걷는 길에서 서로의 속도를 존중하게 해 주세요.

  우리의 힘이 아니라 예수님의 은혜를 의지합니다.
  오늘 밤 주님 안에서 편히 쉬고,
  내일 다시 걸어갈 힘을 얻게 해 주세요.

  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 8월 20일 목요일 가정예배"
