title: "작은 사람, 큰 은혜"
subtitle: "생명의 주인이신 하나님"
date: "2026-06-19"

calling: |
  우리에게 생명을 맡겨 주시고 오늘도 돌보시는 하나님께 감사하며 예배드립니다.
  감자의 성장과 하나님의 신실하신 인도하심을 기억하며 주님께 나아갑시다.

verse1_title: "시편 139:13-14"
verse1: |
  주께서 내 내장을 지으시며
  나의 모태에서 나를 만드셨나이다.
  내가 주께 감사하옴은 나를 지으심이 심히 기묘하심이라.

verse2_title: "예레미야 1:5"
verse2: |
  내가 너를 모태에 짓기 전에 너를 알았고
  네가 배에서 나오기 전에 너를 성별하였고
  너를 여러 나라의 선지자로 세웠노라.

reflection: |
  최근 초음파를 통해 감자의 모습을 다시 보게 되었습니다. 몇 주 전만 해도 작은 점처럼 보이던 생명이 이제는 머리와 몸통이 구분될 정도로 자라 있었습니다. 심장은 힘차게 뛰고 있었고, 하나님께서 생명을 붙들고 계심을 다시 한번 확인하게 되었습니다.

  사람은 때때로 큰 기적만 은혜라고 생각합니다. 하지만 생명이 하루하루 자라나는 것 자체가 놀라운 기적입니다. 우리가 잠든 사이에도, 일하고 있는 동안에도, 감자는 하나님께서 정하신 방식대로 자라고 있습니다.

  시편 기자는 하나님께서 모태에서 우리를 지으셨다고 고백합니다. 생명은 우연히 만들어지는 것이 아니라 하나님의 손길 가운데 자라납니다. 지금 감자에게 일어나고 있는 모든 성장 역시 하나님의 세밀한 돌보심 가운데 있습니다.

  또한 최근에는 생명의 소중함을 더욱 깊이 생각하게 됩니다. 감자가 자라는 모습을 보며, 우리 주변의 모든 사람도 누군가의 소중한 자녀이며 하나님께서 사랑하시는 존재라는 사실을 새롭게 깨닫게 됩니다. 하나님께서 한 사람 한 사람을 귀하게 여기신다는 사실은 큰 은혜입니다.

  어제는 갑상선 검사 결과도 예상보다 좋은 소식을 듣게 되었습니다. 걱정하던 마음이 한결 가벼워졌고, 하나님께서 필요한 때에 필요한 위로를 주신다는 사실을 경험하게 되었습니다. 우리가 미래를 다 알 수는 없지만, 하나님께서는 언제나 우리보다 앞서 일하고 계십니다.

  오늘은 감자의 성장에 감사하고, 아내의 건강을 지켜 주시는 하나님께 감사하며, 우리 가정을 여기까지 인도하신 주님의 은혜를 기억하면 좋겠습니다. 생명의 주인이신 하나님께서 앞으로의 길도 선하게 인도하실 것입니다.

questions:
  - "최근 하나님께 감사하게 된 일은 무엇인가요?"
  - "감자의 성장을 보며 새롭게 깨닫게 된 것은 무엇인가요?"
  - "오늘 하나님께 맡기고 싶은 걱정이나 계획은 무엇인가요?"

prayer: |
  사랑의 하나님,

  오늘도 우리 가정을 지켜 주시고 감자의 생명을 붙들어 주셔서 감사합니다.

  감자가 건강하게 자라게 하시고,
  하나님께서 정하신 때까지 안전하게 보호하여 주옵소서.

  아내의 몸과 마음을 돌보아 주시고,
  입덧 가운데서도 필요한 힘과 평안을 공급하여 주옵소서.
  갑상선 수치도 잘 관리되게 하시고,
  앞으로의 검사와 진료도 주님의 은혜 가운데 진행되게 하여 주옵소서.

  우리 부부가 받은 은혜를 잊지 않게 하시고,
  생명의 소중함을 기억하며 감사로 살아가게 하여 주옵소서.

  여러 선택과 고민들 앞에서 하나님의 뜻을 구하게 하시고,
  우리의 생각보다 더 선한 길로 인도하여 주옵소서.

  남편에게는 지혜와 배려를 더하여 주셔서
  아내를 사랑으로 섬기고 힘이 되게 하여 주옵소서.

  하나님께서 오늘도 아내에게 평안과 힘을 주시고,
  감자에게 건강한 성장의 은혜를 허락하시기를 축복합니다.

  예수님의 이름으로 기도합니다.

  아멘.

footer: "2026년 6월 19일 금요일 가정예배"