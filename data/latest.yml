title: "아시는 하나님, 기다리는 우리"
subtitle: "아직 알지 못하는 것까지도 주님의 손에 맡기며"
date: "2026-08-10"

calling: |
  사랑의 하나님 아버지,
  새로운 한 주를 시작하며 우리를 다시 예배의 자리로 불러 주셔서 감사합니다.
  오늘도 우리의 기쁨과 기대, 아직 알지 못하는 것들까지
  주님 앞에 조용히 내려놓습니다.
  말씀을 통해 우리가 알지 못하는 내일보다
  이미 알고 계시는 하나님을 바라보게 하옵소서.

verse1_title: "시편 139:13-14"
verse1: |
  주께서 내 내장을 지으시며 나의 모태에서 나를 만드셨나이다.
  내가 주께 감사하옴은 나를 지으심이 심히 기묘하심이라
  주께서 하시는 일이 기이함을 내 영혼이 잘 아나이다.

verse2_title: "잠언 3:5-6"
verse2: |
  너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라
  너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라.

reflection: |
  어떤 사실은 알게 되는 순간보다, 알기 전까지 기다리는 시간이 더 재미있기도 합니다. 오늘 우리에게도 그런 시간이 있었습니다. 감자의 성별을 알게 될 것 같았는데, 아직은 정확하게 모릅니다. 딸일 것 같다는 이야기를 들었지만 정말 그런지는 조금 더 기다려 봐야 합니다.

  부모가 되어 가면서 참 신기한 것이 있습니다. 아이가 태어나기도 전인데 우리는 이미 아이에 대해 궁금한 것이 참 많습니다. 누구를 닮았을까, 어떤 성격일까, 무엇을 좋아할까, 건강하게 자라고 있을까. 하나씩 알아갈 때마다 기쁘고 감사하지만, 아직 모르는 것이 훨씬 더 많습니다.

  그런데 오늘 시편의 말씀은 우리의 시선을 조금 다르게 돌려 줍니다. 우리는 아직 감자에 대해 모르는 것이 많지만, 하나님은 처음부터 알고 계십니다. 우리가 오늘 초음파를 통해 확인하는 모습보다 훨씬 이전부터 하나님께서는 그 생명을 알고 계셨습니다. 우리가 이름을 부르기 전부터 하나님께서는 그 아이를 알고 계셨고, 우리가 미래를 상상하기 전부터 하나님께서는 그 아이의 모든 날을 알고 계십니다.

  그래서 부모에게 필요한 믿음은 모든 것을 미리 아는 능력이 아니라, 모든 것을 아시는 하나님을 신뢰하는 마음인지도 모르겠습니다.

  우리는 앞으로도 여러 가지를 알게 될 것입니다. 오늘은 성별을 조금 더 알게 되고, 다음에는 또 다른 모습을 확인하게 되고, 시간이 지나면 마침내 감자를 직접 만나게 될 것입니다. 그 과정에서 기쁜 소식도 듣고 예상하지 못했던 이야기를 듣기도 할 것입니다. 하지만 그 모든 과정의 중심에는 변하지 않는 사실이 하나 있습니다. 하나님께서 이미 감자를 알고 계시며 지금도 붙들고 계신다는 것입니다.

  오늘 16주가 되었다는 것도 참 감사한 일입니다. 날짜를 하나씩 세어 여기까지 왔다는 사실 자체가 우리에게는 작은 기념일처럼 느껴집니다. 처음에는 하루하루가 참 길게 느껴졌는데, 어느새 16주라는 시간이 흘렀습니다. 그동안 하나님께서 우리의 걱정과 기쁨을 모두 지나오게 하셨습니다.

  오늘 초음파를 보러 가는 길에도 여러 마음이 생길 수 있습니다. 기대도 되고, 조금 긴장도 될 것입니다. 하지만 검사 결과를 확인하기 전에도 하나님은 이미 그 자리에 계십니다. 의사가 화면을 통해 처음 발견하는 것을 하나님께서는 이미 알고 계십니다. 우리가 확인하는 것은 새로운 사실이지만, 하나님께는 이미 알고 계시던 사실입니다.

  잠언은 "마음을 다하여 여호와를 신뢰하라"고 말합니다. 모든 것을 이해한 뒤에 신뢰하라고 하지 않습니다. 오히려 내가 다 알 수 없다는 사실을 인정하면서 하나님을 의지하라고 합니다. 이것은 포기하는 믿음이 아니라, 나보다 크신 분을 믿는 믿음입니다.

  어쩌면 감자의 성별을 기다리는 이 작은 사건도 부모가 되어 가는 우리에게 좋은 연습인지 모르겠습니다. 궁금하지만 기다리고, 알고 싶지만 맡기고, 예상하지만 하나님께서 하실 일을 기대하는 것. 앞으로 살아가면서 우리는 이런 순간을 수도 없이 만나게 될 것입니다.

  딸일지 아들일지 아직은 조금 더 기다려 보겠습니다. 그리고 어떤 아이인지 하나씩 알아가는 기쁨도 누리면 좋겠습니다. 우리가 어떤 모습의 감자를 만나게 되든, 하나님께서 우리에게 맡겨 주신 귀한 생명이라는 사실은 달라지지 않습니다.

  오늘 밤에는 아직 알지 못하는 것들을 억지로 알아내려 하기보다, 이미 알고 계시는 하나님을 바라보면 좋겠습니다. 하나님께서 오늘도 우리와 감자와 함께하셨습니다. 그리고 우리가 아직 알지 못하는 내일도 이미 하나님의 손 안에 있습니다. 그러니 우리는 기대하는 마음으로 내일을 기다리면 됩니다.

questions:
  - "감자의 성별을 기다리며 가장 기대되는 것은 무엇인가요?"
  - "우리가 아직 알지 못하지만 하나님께 맡기고 싶은 미래의 한 가지는 무엇인가요?"
  - "16주를 지나오며 '하나님께서 여기까지 인도하셨구나' 싶었던 순간은 언제였나요?"

prayer: |
  사랑의 하나님 아버지,
  우리보다 먼저 감자를 아시고 지금까지 인도해 주신 은혜에 감사드립니다.
  16주라는 시간을 무사히 지나오게 하시고
  오늘도 감자와 함께 새로운 한 주를 시작하게 하셔서 감사합니다.

  오늘 초음파를 통해 감자의 모습을 확인하는 모든 과정을 지켜 주시고,
  우리가 기쁜 마음으로 그 시간을 누리게 하옵소서.
  아직 정확하게 알지 못하는 것까지도
  주님께서 가장 선한 뜻 가운데 인도하고 계심을 믿게 하옵소서.

  사랑하는 아내를 붙들어 주시고,
  검사받는 동안에도 마음에 평안을 주시며
  앞으로 남은 임신의 시간도 기쁨과 감사로 채워 주옵소서.

  우리에게 맡겨 주신 감자를 주님의 손에 온전히 올려 드립니다.
  아들인지 딸인지보다 먼저,
  하나님께서 사랑하시는 귀한 생명임을 기억하게 하시고
  주님의 뜻 가운데 아름답게 자라가게 하옵소서.

  우리 부부가 모든 것을 미리 알고 통제하려 하기보다
  알지 못하는 순간에도 하나님을 신뢰하게 하시고,
  서로의 기대와 설렘을 함께 나누며
  감사가 넘치는 가정을 만들어 가게 하옵소서.

  우리의 모든 날을 아시며 선한 길로 인도하시는
  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 8월 10일 월요일 가정예배"
