title: "마지막에 남기는 말"
subtitle: "창세기 49장, 각 사람의 분량대로"
date: "2026-10-02"
calling: "가족을 사랑한다는 것은 좋은 말만 골라 하는 것이 아니라, 서로의 모습을 정직하게 바라보면서도 그 사람을 포기하지 않는 것인지 돌아봅니다."

verse1_title: "각 사람의 분량대로"
verse1: "창세기 49:28 — 이들은 이스라엘의 열두 지파라 이와 같이 그들의 아버지가 그들에게 말하고 그들에게 축복하였으니 곧 그들 각 사람의 분량대로 축복하였더라."

verse2_title: "정직한 말도 사랑이 될 수 있을까"
verse2: "창세기 49장에서 야곱은 아들들에게 똑같은 말을 하지 않습니다. 잘한 것만 칭찬하지도 않고, 그들의 지나온 모습과 성품을 있는 그대로 바라봅니다. 그런데 마지막에는 그것을 모두 ‘축복’이라고 기록합니다. 사랑한다고 해서 언제나 듣기 좋은 말만 해야 하는 것은 아닌 것 같습니다. 서로를 잘 안다는 이유로 쉽게 판단하거나, 반대로 좋은 모습만 보고 싶은 마음도 우리에게 있습니다. 가까운 사이일수록 정직하게 바라보되, 그 사람을 향한 마음까지 놓치지 않는 것이 무엇인지 생각해 봅니다."

reflection: "야곱의 마지막 말은 아들마다 달랐습니다. 어떤 아들에게는 좋은 말만 하지 않았고, 지나온 모습에 대한 아픔과 경고도 함께 담겨 있습니다. 그런데 성경은 그것을 ‘각 사람의 분량대로 축복하였다’고 기록합니다. 어쩌면 사랑은 상대를 내가 바라는 모습으로 만들어 바라보는 것이 아니라, 그 사람의 모습을 정직하게 인정하면서도 끝까지 그 사람으로 대하는 것인지도 모르겠습니다. 우리 부부도 서로를 너무 쉽게 단정하지 않으면서, 그렇다고 좋은 모습만 골라 보려고 하지 않으면서, 있는 모습을 바라보고 말할 수 있으면 좋겠습니다. 그리고 언젠가 감자를 바라볼 때에도 우리가 원하는 아이의 모습보다 하나님 앞에서 한 사람으로 살아갈 그 아이의 모습을 존중할 수 있는 부모가 되었으면 좋겠습니다."

questions:
  - "나는 가까운 사람의 어떤 모습을 너무 쉽게 판단하거나 단정하고 있을까?"
  - "서로에게 솔직하면서도 상처 주지 않는 말을 하기 위해 우리 부부가 지키고 싶은 것은 무엇일까?"

prayer: "하나님, 우리에게 서로를 있는 모습 그대로 바라볼 수 있는 마음을 주세요. 좋은 모습만 보려고 하지도, 한 번의 실수나 부족함으로 서로를 규정하지도 않게 해주세요. 가까운 사람일수록 더 조심스럽게 말하고, 정직함과 사랑을 함께 품게 해주세요. 우리가 앞으로 부모가 되어 아이를 바라볼 때에도 우리의 기대에 맞추려 하기보다 한 사람의 삶을 존중하며 사랑할 수 있게 해주세요. 오늘도 우리에게 주어진 관계들을 소중히 여기며 살아가게 하시고, 우리의 말과 마음이 서로에게 쉼이 되게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 2일 금요일 가정예배"
