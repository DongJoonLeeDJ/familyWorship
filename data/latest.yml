title: "가족이 머물 자리를 마련하시다"
subtitle: "요셉의 자리에서 야곱의 가족을 바라보다"
date: "2026-09-30"
calling: "오늘은 야곱의 가족이 애굽에 머물 자리를 얻게 된 이야기를 통해, 우리에게 주어진 자리와 가족을 돌아보며 예배합니다."

verse1_title: "좋은 땅에 거주하게 하며"
verse1: "요셉이 바로의 명령대로 그의 아버지와 그의 형제들에게 거처를 주되 애굽의 좋은 땅 라암셋을 그들에게 주어 기업으로 삼게 하였더라. (창세기 47:11)"

verse2_title: "생육하며 번성하였더라"
verse2: "이스라엘이 애굽 땅 고센 땅에 거주하며 거기서 생업을 얻고 생육하며 번성하였더라. (창세기 47:27)"

reflection: "창세기 47장에서 야곱의 가족은 결국 애굽에 머물 자리를 얻게 됩니다. 흉년을 피해 내려온 낯선 땅이었지만, 그곳에서 가족이 함께 살아갈 터전을 마련하게 되었습니다. 얼마 전까지만 해도 우리도 이사를 해야 하나 고민했는데, 감자가 우리에게 오면서 새로운 집을 찾게 되었고 어제는 가계약까지 하게 되었습니다. 아직 실제 이사까지는 시간이 남았지만, 우리 가족이 함께 살아갈 새로운 자리가 생겼다는 것이 감사하게 느껴집니다. 야곱의 가족이 고센에 자리를 잡아갔듯이 우리도 이제 감자와 함께 살아갈 집을 하나씩 준비해가려 합니다."

questions:
  - "우리에게 새로운 집과 새로운 가족의 자리를 허락하신 것을 생각하며 무엇이 가장 감사할까?"
  - "감자와 함께 살아갈 집을 준비하면서 우리 부부가 중요하게 지키고 싶은 것은 무엇일까?"

prayer: "하나님, 야곱의 가족에게 머물 자리를 주셨던 것처럼 우리 가정에도 함께 살아갈 새로운 자리를 준비하게 해주셔서 감사합니다. 감자가 우리에게 오면서 이사를 생각하게 되었고, 생각하지 못했던 새로운 집을 준비하게 된 것도 감사드립니다. 아직 남아 있는 계약과 이사 과정도 잘 인도해주시고, 새로운 집에서 우리 가족이 서로를 아끼며 평안하게 살아가게 해주세요. 집의 크기나 조건보다 그곳에서 어떤 가족으로 살아갈지를 더 중요하게 여기게 하시고, 감자를 맞이할 준비도 하나씩 지혜롭게 해나가게 해주세요. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 30일 수요일 가정예배"
