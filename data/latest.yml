title: "함께하는 기쁨"
subtitle: "좋은 사람들과 나누는 풍성한 교제"
date: "2026-09-26"
calling: "오늘은 좋은 사람들과 함께 웃고 이야기하며 풍성한 교제를 나눈 하루를 돌아보며 예배합니다."

verse1_title: "함께 즐거워하고"
verse1: "즐거워하는 자들과 함께 즐거워하고 우는 자들과 함께 울라. (로마서 12:15)"

verse2_title: "서로 돌아보며"
verse2: "서로 돌아보아 사랑과 선행을 격려하며. (히브리서 10:24)"

reflection: "오늘은 교회에서 만난 한 부부와 오후 두 시부터 밤 아홉 시까지 함께했습니다. 오랜 시간 함께했지만 특별히 무언가를 해야 했던 것은 아니고, 서로의 이야기를 나누고 웃으며 각자의 삶을 나누는 것만으로도 시간이 참 풍성했습니다. 신앙 안에서 만난 사람들이 이렇게 편하게 마음을 나눌 수 있다는 것이 감사하게 느껴집니다. 좋은 교제는 우리에게 새로운 힘을 주고, 혼자 살아가는 것이 아니라 함께 살아가고 있다는 것을 다시 느끼게 하는 것 같습니다. 오늘 우리가 받은 기쁨처럼 우리도 주변 사람들에게 편안하게 함께할 수 있는 사람이 되었으면 좋겠습니다."

questions:
  - "오늘 그 부부와 함께하면서 특별히 감사했던 것은 무엇이었을까?"
  - "우리 부부도 주변 사람들에게 어떤 기쁨과 편안함을 나누며 살아가고 있을까?"

prayer: "하나님, 오늘 좋은 사람들과 오랜 시간 함께하며 웃고 이야기할 수 있게 해주셔서 감사합니다. 함께하는 것만으로도 마음이 풍성해질 수 있음을 느끼게 해주셔서 감사합니다. 우리에게 허락하신 좋은 관계들을 소중히 여기게 하시고, 우리 부부도 다른 사람들에게 편안하고 따뜻한 사람이 되게 해주세요. 오늘 나눈 기쁨과 이야기를 좋은 기억으로 간직하게 하시고, 우리의 모든 만남을 선하게 이끌어주세요. 예수님의 이름으로 기도합니다. 아멘."

footer: "2026년 9월 26일 토요일 가정예배"