title: "잊지 않으시는 기도"
subtitle: "한나의 노래, 우리의 기도"
date: "2026-09-01"

calling: |
  오늘 하루도 애쓰며 살아온 우리를 하나님께서 아십니다.
  잠시 모든 것을 내려놓고, 주님 앞에 함께 앉습니다.

verse1_title: "사무엘상 1:27"
verse1: |
  이 아이를 위하여 내가 기도하였더니 여호와께서 내가 구한 바 소원을 허락하신지라

verse2_title: "사무엘상 2:1-2"
verse2: |
  한나가 기도하여 이르되 내 마음이 여호와로 말미암아 즐거워하며 내 뿔이 여호와로 말미암아 높아졌고 내 입이 원수들을 향하여 크게 열렸으니 이는 내가 주의 구원으로 말미암아 기뻐함이니이다
  여호와와 같이 거룩하신 이가 없으시니 이는 주 밖에 다른 이가 없고 우리 하나님 같은 반석도 없음이니이다

reflection: |
  한나는 오랜 세월 아이를 구하며 기도했습니다. 그 기도가 응답되기까지 시간이 걸렸지만, 사라지지 않았습니다. 아이를 품에 안은 뒤 한나가 부른 노래는 자기 자랑이 아니라 하나님을 향한 찬양이었습니다.

  아내는 요즘 감자를 위해 기도할 때가 많습니다. 아직 눈에 보이지 않는 것들을 위해, 앞으로 엄마가 되어 갈 시간을 위해 마음으로 구합니다. 그 기도가 오늘 당장 눈앞의 결과로 나타나지 않아도, 하나님께서 흘려버리지 않으신다는 것이 위로가 됩니다.

  한나의 기도가 응답된 뒤 가장 먼저 한 일은 그 아이를 자신의 것으로 붙잡는 것이 아니라 하나님께 다시 돌려드리는 것이었습니다. 우리도 감자를 우리의 소유가 아니라 하나님께서 맡기신 생명으로 받아들이는 연습을 하고 있습니다.

  기도한 것을 잊는 것은 우리 쪽입니다. 하나님은 잊지 않으십니다. 오늘 우리가 드리는 짧은 기도 하나도, 하나님 안에서는 결코 가벼운 것이 아닙니다.

questions:
  - "요즘 마음속으로 계속 구하고 있는 기도가 있다면 무엇인가요?"
  - "아직 응답을 보지 못했지만 하나님께 맡기고 싶은 것은 무엇인가요?"
  - "감자를 위해 오늘 하루 드리고 싶은 짧은 기도가 있다면요?"

prayer: |
  하나님, 오늘 하루도 지켜 주셔서 감사합니다.
  우리가 드린 기도들을 하나도 흘려버리지 않으시는 주님을 신뢰합니다.
  아내가 감자를 위해 마음으로 구하는 시간들을 기억해 주시고,
  그 마음에 조급함보다 평안이 자리하게 해 주세요.
  감자를 우리 것이 아니라 주님께서 맡기신 생명으로 여기며 살게 해 주시고,
  우리 부부가 서로를 위해 기도하는 것을 잊지 않게 해 주세요.
  예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 9월 1일 화요일 가정예배"