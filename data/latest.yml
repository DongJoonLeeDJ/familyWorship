title: "잘못을 깨닫게 하시는 은혜"

subtitle: "잘못을 인정하고 하나님께 나아가기"

date: "2026-11-20"

calling: "하나님 앞에서 우리의 모습을 솔직하게 돌아보며 예배를 시작합니다."

verse1_title: "레위기 4:2"

verse1: "이스라엘 자손에게 말하여 이르라 누구든지 여호와의 계명 중 하나라도 부지중에 범하여 그릇 행하였을 때에는"

verse2_title: "레위기 4:28"

verse2: "그가 범한 죄를 깨달으면 그는 그 범한 죄를 위하여 흠 없는 암염소를 끌고 와서 그 죄를 위하여 제물로 삼아"

reflection: "레위기 4장에는 죄를 지은 사람이 자신의 잘못을 깨달았을 때 드리는 속죄제에 대한 규례가 나옵니다. 죄를 모르고 지었더라도 그것이 죄가 아닌 것은 아니지만, 깨달은 후에는 하나님 앞에 나아가야 했습니다. 우리는 때때로 잘못을 깨닫고도 변명하거나 모른 척하고 싶을 때가 있습니다. 그러나 잘못을 인정하고 하나님께 나아가는 것은 부끄러운 일이 아니라 회복을 향한 시작입니다. 우리의 부족함을 숨기기보다 솔직하게 하나님 앞에 서는 하루가 되었으면 좋겠습니다."

questions:
  - "최근에 돌아보게 된 말이나 행동이 있다면, 우리는 그것을 솔직하게 인정하고 있나요?"
  - "잘못을 깨달았을 때 변명하기보다 바로잡기 위해 어떤 행동을 할 수 있을까요?"

prayer: "하나님 아버지, 우리의 잘못을 깨닫게 하실 때 외면하거나 변명하지 않게 해주세요. 하나님 앞에서 정직하게 우리의 모습을 돌아보고, 잘못된 것을 바로잡을 용기를 주세요. 서로에게도 솔직하고 부드럽게 대하며, 잘못을 인정하고 용서를 구할 줄 아는 부부가 되게 해주세요. 감자가 자라는 동안 필요한 모든 것을 채워주시고, 감자가 건강하게 자라 태어날 날까지 지켜주세요. 저희도 감자에게 사랑과 믿음을 전할 수 있는 부모로 준비되어 가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 20일 금요일 가정예배"
