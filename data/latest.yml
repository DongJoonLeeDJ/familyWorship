title: "말씀을 전한다고 해서 모두가 기뻐하는 것은 아니다"

subtitle: "바로의 마음과 모세의 걸음"

date: "2026-10-09"

calling: "우리의 마음이 원하는 대로 상황이 흘러가지 않을 때에도, 눈앞의 반응만으로 모든 것을 판단하지 않기를 바라며 예배를 시작합니다."

verse1_title: "바로가 대답하되"

verse1: "출애굽기 5:2 — 바로가 이르되 여호와가 누구이기에 내가 그의 목소리를 듣고 이스라엘을 보내겠느냐 나는 여호와를 알지 못하니 이스라엘을 보내지 아니하리라 하더라"

verse2_title: "백성의 원망을 들은 모세"

verse2: "출애굽기 5:22-23 — 모세가 여호와께 돌아와서 아뢰되 주여 어찌하여 이 백성이 학대를 당하게 하셨나이까 어찌하여 나를 보내셨나이까 내가 바로에게 들어가서 주의 이름으로 말한 후로부터 그가 이 백성을 더 학대하며 주께서도 주의 백성을 구원하지 아니하시나이다"

reflection: "모세는 하나님의 말씀을 전했지만 상황은 오히려 나빠졌고, 이스라엘 백성은 모세를 원망했습니다. 하나님께 순종하면 일이 곧바로 풀릴 것이라고 기대하기 쉽지만, 출애굽기 5장에서 모세가 마주한 현실은 그렇지 않았습니다. 모세도 하나님께 왜 자신을 보내셨느냐고 솔직하게 물었습니다. 믿음이 있다는 것은 이해되지 않는 상황에도 아무렇지 않은 척하는 것이 아니라, 답답함과 의문을 하나님께 가져가는 모습일 수도 있겠습니다. 우리 역시 무언가를 바르게 하려고 노력했는데 결과가 좋지 않을 때가 있습니다. 그럴 때 당장 드러난 결과만으로 모든 노력이 잘못되었다고 결론 내리거나, 반대로 좋은 의도였다는 이유로 자신의 행동을 돌아보지 않는 일은 경계해야겠습니다. 지금 이해하지 못하는 부분은 정직하게 묻되, 오늘 내가 해야 할 일까지 놓치지는 않는 하루였으면 합니다."

questions:
  - "내가 좋은 의도로 시작했는데 결과가 기대와 달라 답답했던 일이 있었을까? 그때 나는 어떤 마음이었을까?"
  - "상황이 뜻대로 되지 않을 때, 나는 너무 빨리 포기하거나 다른 사람을 탓하지는 않는가?"

prayer: "하나님, 마음먹은 대로 일이 풀리지 않을 때 쉽게 낙심하고 답을 재촉하는 저희를 돌아봅니다. 모세처럼 이해되지 않는 것을 하나님께 솔직하게 아뢰면서도, 눈앞의 결과만으로 모든 것을 판단하지 않게 해주세요. 저희가 옳다고 생각하는 일이라도 그 과정에서 다른 사람을 힘들게 하지는 않았는지 살피게 하시고, 잘못한 것이 있다면 인정하고 바로잡게 해주세요. 아직 알지 못하는 일들 때문에 오늘의 감사와 책임을 놓치지 않도록 도와주세요. 저희가 조급함에 끌려가기보다 하루하루 성실하게 살아가기를 바랍니다. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 9일 금요일 가정예배"
