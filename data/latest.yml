title: "재물이 아니라 사람을 향하는 마음"

subtitle: "효율보다 관계를, 소유보다 사랑을"

date: "2026-11-17"

calling: "하나님 앞에서 우리의 마음이 무엇을 향하고 있는지 돌아보며 예배를 시작합니다."

verse1_title: "고린도후서 12:14"

verse1: "보라 내가 이제 세 번째 너희에게 가기를 준비하였으나 너희에게 폐를 끼치지 아니하리라 내가 구하는 것은 너희의 재물이 아니요 오직 너희니라 어린 아이가 부모를 위하여 재물을 저축하는 것이 아니요 부모가 어린 아이를 위하여 하느니라"

verse2_title: "빌립보서 2:5"

verse2: "너희 안에 이 마음을 품으라 곧 그리스도 예수의 마음이니"

reflection: "바울은 자신을 오해하는 사람들에게 자신이 원하는 것은 재물이 아니라 그들 자신이라고 말합니다. 부모가 자녀에게 무엇을 받아내기 위해 사랑하는 것이 아니듯, 바울도 성도들의 유익을 먼저 생각했습니다. 우리는 사람을 대할 때도 효율이나 주고받는 것을 먼저 따질 때가 있습니다. 하지만 사랑은 때로 먼저 다가가고, 상대방의 유익을 위해 기꺼이 수고하는 모습으로 나타납니다. 우리 부부도 서로에게 무엇을 기대하는지만 생각하기보다, 상대방에게 무엇을 해줄 수 있을지 먼저 생각하는 하루가 되었으면 좋겠습니다."

questions:
  - "우리는 가까운 사람에게 무언가를 기대하기 전에 먼저 베풀고 있나요?"
  - "오늘 상대방의 유익을 위해 내가 먼저 할 수 있는 작은 일은 무엇일까요?"

prayer: "하나님 아버지, 사람을 대할 때 내게 돌아올 유익부터 계산하지 않게 해주세요. 바울이 성도들을 향해 가졌던 아비의 마음을 배우고 싶습니다. 특히 가장 가까운 아내에게 먼저 사랑을 표현하고, 서로의 필요를 살필 수 있게 해주세요. 우리의 마음과 행동에 예수님의 사랑이 조금씩 드러나게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 17일 화요일 가정예배"
