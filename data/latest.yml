title: "하나님께 맡기고 오늘을 살다"
subtitle: "내일을 다 알지 못해도 오늘의 걸음을 걸어갑니다"
date: "2026-08-24"

calling: |
  새로운 한 주가 시작되었습니다.
  아직 오지 않은 일까지 미리 걱정하기보다, 오늘 하나님께서 주신 하루에 마음을 두겠습니다.
  우리의 계획과 걱정을 잠시 내려놓고 주님을 바라보며 예배하겠습니다.

verse1_title: "내일 일을 자랑하지 말라"
verse1: |
  잠언 27:1
  너는 내일 일을 자랑하지 말라
  하루 동안에 무슨 일이 일어날는지 네가 알 수 없음이니라

verse2_title: "주의 뜻이면"
verse2: |
  야고보서 4:15
  너희가 도리어 말하기를 주의 뜻이면 우리가 살기도 하고
  이것이나 저것을 하리라 할 것이거늘

reflection: |
  우리는 내일을 계획하며 살아갑니다. 해야 할 일도 있고, 준비해야 할 것도 있고, 앞으로 감자와 함께 살아갈 날들도 기다리고 있습니다. 계획하는 것은 필요하지만, 오늘 말씀은 우리가 내일을 손에 쥐고 있는 사람처럼 살지는 말라고 합니다.

  내일 무슨 일이 일어날지 우리는 알지 못합니다. 그렇다고 불안해할 필요도 없습니다. 내일을 모르는 우리와 달리 하나님께서는 내일도 알고 계시기 때문입니다.

  그래서 믿음은 모든 미래를 알아내는 것이 아니라, 알지 못하는 미래를 하나님께 맡기고 오늘 해야 할 일을 살아가는 것인지도 모르겠습니다. 오늘 해야 할 일이 있다면 오늘 하고, 쉴 때가 되면 쉬고, 사랑해야 할 사람이 곁에 있다면 그 사람을 사랑하는 것입니다.

  우리 부부도 앞으로 부모가 되는 과정에서 예상하지 못한 일들을 많이 만나게 될 것입니다. 모든 것을 미리 준비할 수는 없습니다. 하지만 그때마다 다시 하나님께 묻고, 함께 한 걸음씩 가면 됩니다.

  "주의 뜻이면"이라는 말은 아무것도 하지 않겠다는 뜻이 아니라, 내가 모든 것을 결정할 수 있다는 착각을 내려놓는 고백입니다. 계획은 세우되 하나님께 맡기는 것, 오늘의 몫은 성실하게 감당하되 내일의 몫까지 끌어안지 않는 것. 그것이면 충분합니다.

  오늘 하루도 그렇게 살아가면 좋겠습니다. 미래를 통제하려 애쓰기보다 지금 우리에게 주어진 하루를 감사히 살아가고, 아직 보이지 않는 길은 우리보다 먼저 가시는 하나님께 맡겨 봅니다.

questions:
  - "내일 일까지 미리 걱정하고 있는 것은 무엇인가요?"
  - "오늘 내가 집중해서 살아야 할 한 가지는 무엇인가요?"
  - "우리 부부가 함께 하나님께 맡기고 싶은 앞으로의 일은 무엇인가요?"

prayer: |
  하나님, 우리가 알지 못하는 내일까지 붙잡으려 했던 마음을 내려놓습니다.
  오늘 우리에게 주신 일에 충실하고, 아직 오지 않은 시간은 주님께 맡기게 해 주세요.
  아내에게 오늘 필요한 쉼과 기쁨을 허락하시고, 감자를 기다리는 우리의 마음에도 조급함 대신 신뢰를 더해 주세요.
  계획할 때에는 지혜를 주시고, 계획대로 되지 않을 때에는 주님을 다시 바라보게 해 주세요.
  우리의 내일을 아시는 예수님을 의지하며, 예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 8월 24일 월요일 가정예배"