title: "주 안에서 기뻐하라"
subtitle: "상황보다 크신 하나님"
date: "2026-06-20"

calling: |
  오늘도 우리를 붙드시고 인도하시는 하나님께 감사하며 예배드립니다.
  우리의 상황이 아니라 하나님을 바라보며 기쁨과 평안을 누리는 시간이 되기를 소망합니다.

verse1_title: "빌립보서 4:4"
verse1: |
  주 안에서 항상 기뻐하라.
  내가 다시 말하노니 기뻐하라.

verse2_title: "빌립보서 4:6-7"
verse2: |
  아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로,
  너희 구할 것을 감사함으로 하나님께 아뢰라.
  그리하면 모든 지각에 뛰어난 하나님의 평강이
  그리스도 예수 안에서 너희 마음과 생각을 지키시리라.

reflection: |
  빌립보서는 기쁨의 서신이라고 불립니다. 그런데 바울은 모든 것이 잘되고 있을 때 이 편지를 쓴 것이 아닙니다. 그는 감옥에 갇혀 있는 상황에서도 "주 안에서 항상 기뻐하라"라고 권면했습니다.

  바울이 말한 기쁨은 문제가 없는 상태에서 나오는 감정이 아닙니다. 하나님께서 함께하신다는 사실에서 나오는 믿음의 기쁨입니다. 그래서 환경이 변해도 사라지지 않는 기쁨입니다.

  최근 우리 가정을 돌아보면 감사한 일들이 많습니다. 감자는 건강하게 자라고 있고, 심장도 힘차게 뛰고 있습니다. IVF 병원도 무사히 졸업하게 되었고, 걱정했던 갑상선 검사 결과도 예상보다 좋은 소식을 듣게 되었습니다. 하나님께서 한 걸음씩 인도해 주신 은혜를 돌아보면 감사하지 않을 수 없습니다.

  물론 아직 입덧이라는 어려움이 남아 있습니다. 아내는 몸의 변화를 견디며 하루하루를 보내고 있고, 앞으로도 여러 검사와 새로운 경험들이 기다리고 있습니다. 그러나 하나님께서 지금까지 함께하셨다면 앞으로도 함께하실 것입니다.

  바울은 기쁨 다음에 기도를 이야기합니다. 염려가 생기지 않는 사람이 되는 것이 아니라, 염려가 생길 때마다 하나님께 가지고 가는 사람이 되라는 것입니다. 그리고 하나님께서는 우리의 마음과 생각을 평강으로 지켜 주신다고 약속하십니다.

  오늘은 아직 해결되지 않은 문제보다 이미 베풀어 주신 은혜를 기억하면 좋겠습니다. 감자의 심장이 뛰고 있고, 우리 부부가 함께 기도할 수 있으며, 하나님께서 여전히 우리 가정을 인도하고 계십니다. 이것만으로도 충분히 감사하고 기뻐할 이유가 있습니다.

questions:
  - "최근 하나님께 가장 감사한 일은 무엇인가요?"
  - "요즘 나의 마음을 가장 무겁게 하는 염려는 무엇인가요?"
  - "오늘 하나님 안에서 기뻐할 수 있는 이유는 무엇인가요?"

prayer: |
  사랑의 하나님,

  오늘도 우리 가정을 돌보시고 인도하여 주셔서 감사합니다.

  주 안에서 항상 기뻐하라고 말씀하셨지만,
  때로는 걱정과 염려가 먼저 찾아올 때가 있습니다.
  그럴 때마다 문제를 붙드는 사람이 아니라
  하나님께 기도하는 사람이 되게 하여 주옵소서.

  감자의 생명을 지켜 주시고 건강하게 자라게 하심에 감사드립니다.
  앞으로의 성장 과정도 주님의 손으로 안전하게 인도하여 주옵소서.

  입덧으로 힘들어하는 아내에게 힘과 위로를 주시고,
  몸과 마음에 평안을 허락하여 주옵소서.
  필요한 영양과 휴식을 공급하여 주시고,
  하루하루를 잘 이겨낼 수 있도록 도와주옵소서.

  우리 부부가 받은 은혜를 기억하며 감사로 살아가게 하시고,
  여러 선택과 고민들 앞에서 하나님의 뜻을 구하게 하여 주옵소서.

  남편에게는 지혜와 배려를 주셔서
  아내를 사랑으로 섬기고 힘이 되게 하여 주옵소서.

  하나님께서 오늘도 아내에게 평안과 기쁨을 주시고,
  감자에게 건강한 성장의 은혜를 허락하시기를 축복합니다.

  예수님의 이름으로 기도합니다.

  아멘.

footer: "2026년 6월 20일 토요일 가정예배"