title: "함께 꿈꾸는 하나님 나라"

subtitle: "복음으로 사람을 살리는 생명 사역자"

date: "2026-10-21"

calling: "하나님, 우리를 예수님의 생명을 전하는 사람으로 불러 주셨음을 기억하게 해 주세요. 내가 서 있는 자리에서 한 사람을 귀하게 여기며 살아가게 해 주세요."

verse1_title: "하나님 나라의 모습"

verse1: "하나님의 나라는 먹는 것과 마시는 것이 아니요 오직 성령 안에 있는 의와 평강과 희락이라 (로마서 14:17)"

verse2_title: "나를 따라오라"

verse2: "말씀하시되 나를 따라오라 내가 너희를 사람을 낚는 어부가 되게 하리라 하시니 (마태복음 4:19)"

reflection: "목사님의 말씀을 들으며 교회의 사명 선언문인 ‘복음으로 사람을 살리고 키우고 고치는 생명 사역자’라는 문장이 마음에 남았습니다. 예수님은 제자들을 부르실 때 단순히 종교적인 일을 맡기신 것이 아니라, 먼저 자신을 따라오라고 하셨습니다. 예수님과 함께 살아가던 제자들은 점차 사람을 살리는 일에 자신의 삶을 드리게 되었습니다. 우리도 특별한 사역을 맡아야만 생명 사역자가 되는 것은 아닐 것입니다. 가족에게 건네는 말 한마디, 직장에서 동료를 대하는 태도, 누군가의 이야기를 들어주는 시간에도 사람을 살리는 복음이 드러날 수 있습니다. 우리는 요즘 우리 일과 관심사에만 마음을 쏟고 있지는 않은지, 우리 곁에 있는 사람을 돌아보고 싶습니다."

questions:

- "내가 있는 자리에서 누군가에게 생명과 힘을 전할 수 있는 작은 행동은 무엇일까?"
- "우리 부부가 앞으로 감자에게 말로만이 아니라 삶으로 보여주고 싶은 믿음의 모습은 무엇일까?"

prayer: "하나님, 우리를 예수님을 따르는 사람으로 불러 주셔서 감사합니다. 복음을 말로만 아는 데 머물지 않고, 가까운 사람을 대하는 태도와 일상의 선택 속에서도 예수님의 마음을 드러내게 해 주세요. 사람을 내 기준으로 판단하거나 내 일에만 몰두하느라 곁에 있는 이들을 놓치지 않게 하시고, 우리가 만나는 사람들에게 작은 위로와 소망을 전하게 해 주세요. 우리 부부가 함께 하나님 나라를 꿈꾸며 각자의 자리에서 성실하게 살아가도록 이끌어 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 21일 수요일 가정예배"