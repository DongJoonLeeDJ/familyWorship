title: "은혜가 흘러넘치는 가정"

subtitle: "채움에서 멈추지 않고 흘려보내는 은혜"

date: "2026-11-12"

calling: "은혜의 근원이신 하나님께 나아가, 우리에게 주신 사랑이 삶 속에서 흘러가기를 소망하며 예배합니다."

verse1_title: "모든 착한 일을 넘치게 하시는 은혜"

verse1: "“하나님이 능히 모든 은혜를 너희에게 넘치게 하시나니 이는 너희로 모든 일에 항상 모든 것이 넉넉하여 모든 착한 일을 넘치게 하게 하려 하심이라” (고린도후서 9:8)"

verse2_title: "받은 은혜를 흘려보내는 삶"

verse2: "하나님께서 은혜를 풍성하게 주시는 이유는 우리만 누리게 하시려는 것이 아닙니다. 우리에게 채워 주신 은혜가 다른 사람을 향해 흘러가고, 그 은혜로 선한 일을 넉넉히 감당하도록 하시기 위함입니다. 은혜를 받는 것과 흘려보내는 것은 따로 떨어진 일이 아닙니다."

reflection: "물을 길어 나누려면 먼저 우물이 마르지 않아야 하듯, 다른 사람을 사랑하고 섬기기 위해서는 우리 자신도 하나님의 은혜로 채워져야 합니다. 내 힘과 의지만으로 계속 내어주다 보면 지치고 메마를 수 있습니다. 하나님께 은혜를 구하고 그 은혜 안에서 충만함을 누릴 때, 비로소 우리에게서 선한 것이 흘러나올 수 있습니다. 우리 부부도 서로에게 무언가를 내어주기 전에 주님께 충분히 공급받고, 받은 사랑을 서로와 주변 사람들에게 기쁘게 흘려보내면 좋겠습니다."

questions:

- "요즘 우리 마음을 메마르게 하는 것은 무엇이며, 하나님의 은혜로 다시 채워지기 위해 무엇이 필요할까요?"
- "우리가 받은 은혜를 오늘 누구에게, 어떤 작은 선행으로 흘려보낼 수 있을까요?"

prayer: "은혜가 풍성하신 하나님, 우리에게 필요한 은혜를 넉넉히 부어주세요. 우리의 힘만으로 사랑하고 섬기려다 지치지 않게 하시고, 먼저 주님의 사랑 안에서 충만함을 누리게 해주세요. 남편과 아내가 서로에게 은혜를 흘려보내고, 감자에게도 사랑과 축복을 전하는 부모가 되게 해주세요. 우리 가정에 채워 주신 은혜가 이웃과 주변 사람들에게도 흘러가도록 인도해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 12일 목요일 가정예배"