title: "추석의 감사"
subtitle: "평화로운 연휴의 하루"
date: "2026-09-25"
calling: "창세기 43장"
verse1_title: "야곱의 마음"
verse1: "이스라엘이 이르되 내가 어찌하여 너희에게 또 재난을 당하게 하였느냐 하니라 (창세기 43:6)"
verse2_title: "유다의 책임"
verse2: "유다가 아버지 이스라엘에게 이르되 내가 그 아이를 담보하오니... (창세기 43:9)"
reflection: "오늘은 추석이라 평소보다 마음이 한결 느긋합니다. 가족을 직접 만나지는 않았지만, 평화롭게 하루를 맞이할 수 있다는 것만으로도 감사가 됩니다. 본문에서 야곱은 또 다른 재난을 걱정하며 불안해하지만, 유다는 책임을 지겠다고 나섭니다. 우리 삶에도 불안과 감사가 함께 있습니다. 어제의 작은 어려움이 지나고 오늘을 맞이한 것처럼, 불안 속에서도 책임과 감사가 함께 어우러질 때 마음이 한결 가벼워집니다. 오늘은 그저 평범한 하루가 주어진 것 자체를 감사하며 보내고 싶습니다."
questions:
  - "나는 요즘 불안 때문에 감사의 마음을 놓치고 있는 순간이 있을까요?"
  - "오늘 하루에서 내가 책임 있게 붙잡아야 할 작은 일은 무엇일까요?"
prayer: "하나님, 추석 연휴를 평화롭게 맞이하게 하심에 감사합니다. 불안한 마음이 찾아올 때에도 오늘 주어진 하루를 감사하며 살게 하시고, 맡겨진 작은 책임을 성실히 감당하게 하소서. 예수님의 이름으로 기도드립니다. 아멘."
footer: "2026년 9월 25일 금요일 가정예배"
