title: "오늘의 걸음을 맡기다"
subtitle: "신뢰로 걷는 작은 날들"
date: "2026-09-02"

calling: |
  잠깐 눈을 감고 오늘 하루를 하나님 앞에 내려놓습니다. 우리의 걸음 하나하나를 주께서 보시고 인도하심을 믿습니다.

verse1_title: "신뢰의 권면"
verse1: |
  너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라.
  너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라. (잠언 3:5-6)

verse2_title: "새 생명과 은혜"
verse2: |
  보라 자식들은 여호와의 기업이요 태의 열매는 그의 상급이로다. (시편 127:3)

reflection: |
  감자가 가볍게 움직이는 것을 느낄 때, 우리는 큰 계획보다 지금 이 순간의 신실하심을 더 잘 봅니다. 모든 것을 알지 못해도, 우리의 지혜로 길을 완성하려 애쓰지 않아도 됩니다. 오늘 본문은 우리에게 '범사에 하나님을 인정하는 삶'을 권합니다. 부모가 되어 가는 길은 완전한 준비가 아니라 매일의 작은 신뢰로 이어집니다. 매일 서로의 손을 잡고 한 걸음씩 나아가며, 모르는 내일을 주께 맡기는 연습을 하길 원합니다. 그렇게 걸을 때 하나님은 우리의 길을 부드럽게 인도하시고, 우리의 가정에 평안과 소망을 남기십니다.

questions:
  - "오늘 내가 하나님께 맡기지 못한 한 가지는 무엇인가요?"
  - "배우자에게 오늘 건네고 싶은 한 마디는 무엇인가요?"
  - "작은 신뢰의 행동 하나를 내일 실천한다면 무엇일까요?"

prayer: |
  하나님 아버지, 오늘도 우리의 발걸음을 살피시는 주님을 찬양합니다.
  말씀을 통해 우리가 모든 일에 주를 인정하게 하시고, 결과까지 억지로 붙잡지 않게 도와주소서.
  사랑하는 아내를 위해, 오늘의 수고와 불편함 가운데서도 작은 기쁨을 누리게 하시고 마음의 평안을 허락해 주세요.
  감자에게 생명의 은혜를 지켜 주시고, 우리 부부가 부모로서 서로를 격려하며 자라게 하소서.
  이 모든 것을 우리를 위해 중보하신 예수 그리스도의 이름으로 기도합니다.
  아멘.

footer: "2026년 9월 2일 수요일 가정예배"
