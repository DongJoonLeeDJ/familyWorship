title: "자랑할 것이 있다면"
subtitle: "우리의 자랑이 되시는 그리스도"
date: "2026-08-16"

calling: |
  주일의 하루가 저물었습니다.
  한 주를 돌아보면 잘한 일도 있고 아쉬운 일도 있었을 것입니다.
  다른 사람과 비교하며 마음이 올라갔던 순간도 있었고,
  반대로 괜히 작아졌던 순간도 있었을지 모릅니다.

  오늘은 우리의 조건이나 성취를 잠시 내려놓고,
  하나님께서 어떤 사람을 부르셨는지를 바라보겠습니다.
  그리고 우리에게 정말 자랑할 만한 것이 무엇인지
  조용히 생각하며 예배드리겠습니다.

verse1_title: "세상의 약한 것들을 택하사"
verse1: |
  고린도전서 1:26-29
  형제들아 너희를 부르심을 보라 육체를 따라 지혜로운 자가 많지 아니하며
  능한 자가 많지 아니하며 문벌 좋은 자가 많지 아니하도다
  그러나 하나님께서 세상의 미련한 것들을 택하사 지혜 있는 자들을 부끄럽게 하려 하시고
  세상의 약한 것들을 택하사 강한 것들을 부끄럽게 하려 하시며
  하나님께서 세상의 천한 것들과 멸시 받는 것들과 없는 것들을 택하사
  있는 것들을 폐하려 하시나니
  이는 아무 육체도 하나님 앞에서 자랑하지 못하게 하려 하심이라

verse2_title: "주 안에서 자랑하라"
verse2: |
  고린도전서 1:30-31
  너희는 하나님으로부터 나서 그리스도 예수 안에 있고
  예수는 하나님으로부터 나와서 우리에게 지혜와 의로움과 거룩함과 구원함이 되셨으니
  기록된 바 자랑하는 자는 주 안에서 자랑하라 함과 같게 하려 함이라

reflection: |
  사람은 무엇으로 자신을 설명할까요.

  직업을 말할 수도 있고,
  얼마나 공부했는지를 이야기할 수도 있고,
  가진 것과 이룬 것을 이야기할 수도 있습니다.
  가족이나 자녀, 사회적인 위치를 통해 자신을 설명하기도 합니다.

  우리도 자연스럽게 그렇게 살아갑니다.
  "나는 이런 사람입니다"라고 말할 때
  내가 어떤 일을 하는지, 무엇을 잘하는지,
  어떤 것을 가지고 있는지가 따라옵니다.

  그런데 바울은 오늘 본문에서 조금 이상한 질문을 던집니다.

  "너희를 부르심을 보라."

  그리고 고린도 교회의 사람들을 바라보며
  세상적인 기준으로 볼 때 특별히 대단한 사람들이 많지 않았다고 말합니다.

  지혜로운 사람이 많지 않았고,
  능한 사람이 많지 않았고,
  문벌 좋은 사람도 많지 않았습니다.

  그런데 하나님께서 그런 사람들을 부르셨습니다.

  이것은 하나님께서 지혜나 능력이나 좋은 배경 자체를 싫어하신다는 뜻은 아닙니다.
  성경은 그것들을 죄악이라고 말하지 않습니다.
  오히려 문제는 그것들이 하나님 앞에서
  "내가 누구인지"를 증명하는 근거가 되어 버리는 데 있습니다.

  사람은 무언가를 가지고 있으면 그것으로 자신을 높이고 싶어집니다.

  "나는 이것을 할 수 있어."
  "나는 이런 것을 이루었어."
  "나는 저 사람보다 조금 나은 것 같아."

  반대로 아무것도 내세울 것이 없다고 느껴지면
  "나는 별것 아닌 사람인가 봐."
  하며 자신을 낮추기도 합니다.

  그런데 복음은 이 두 방향 모두에서 우리를 자유롭게 합니다.

  하나님께서는 우리가 가진 것으로 우리를 부르신 것이 아니라
  우리를 먼저 부르셨습니다.

  이것은 부부의 삶에서도 참 중요한 것 같습니다.

  함께 살다 보면 서로의 장점도 잘 보이지만
  단점은 더 빨리 보입니다.
  처음에는 몰랐던 습관이 보이고,
  생각하는 방식의 차이도 보이고,
  내가 보기에는 쉽게 할 수 있는 일을
  왜 저 사람은 저렇게 하는지 이해되지 않을 때도 있습니다.

  그러다 보면 어느 순간 부부 사이에서도
  은근한 비교가 생길 수 있습니다.

  "나는 이 정도는 하는데."
  "나는 당신보다 더 많이 참았는데."
  "내가 더 바쁜데도 이것까지 했는데."

  굳이 말로 꺼내지 않아도
  마음속에서 점수를 계산할 때가 있습니다.

  그런데 오늘 본문은 그런 계산 자체를
  조금 멈추게 합니다.

  하나님 앞에서는 누구도 자기 자신을 자랑할 수 없기 때문입니다.

  그리고 이것은 우리를 초라하게 만드는 말이 아닙니다.
  오히려 이상할 만큼 편안하게 만드는 말입니다.

  내가 나를 증명할 필요가 없기 때문입니다.

  하나님께 사랑받기 위해 내가 더 대단한 사람이 될 필요도 없고,
  배우자에게 인정받기 위해 모든 면에서 더 잘할 필요도 없습니다.

  물론 우리는 더 성숙해져야 하고,
  서로를 사랑하는 법도 배워야 합니다.
  하지만 그 노력은
  "내가 괜찮은 사람이라는 것을 증명하기 위해서"가 아닙니다.

  이미 그리스도 안에서 우리가 받아들여졌기 때문에
  조금씩 변화되어 가는 것입니다.

  그래서 바울은 마지막에 아주 분명하게 말합니다.

  "자랑하는 자는 주 안에서 자랑하라."

  그리고 그 이유를 바로 앞에서 설명합니다.

  예수님께서 우리에게
  지혜가 되시고,
  의로움이 되시고,
  거룩함이 되시고,
  구원함이 되셨다고 합니다.

  우리의 자랑이 예수님께 있다는 것은
  단순히 교회에서 겸손한 척하라는 뜻이 아닙니다.

  내가 나를 설명하는 가장 깊은 자리에서
  "나는 무엇을 가지고 있는 사람인가"보다
  "나는 누구에게 속한 사람인가"가 먼저가 되는 것입니다.

  이것을 생각하다 보면
  감자를 기다리고 있는 우리에게도
  참 좋은 방향이 보입니다.

  앞으로 우리는 아이에게 많은 것을 해주고 싶을 것입니다.
  좋은 것을 먹이고 싶고,
  좋은 환경을 만들어 주고 싶고,
  잘 교육하고 싶고,
  무엇보다 좋은 부모가 되고 싶을 것입니다.

  그런데 부모가 된다는 것 역시
  아이에게 우리의 능력을 증명하는 일이 되어서는 안 될 것 같습니다.

  아이가 잘 자라면
  "내가 부모로서 잘해서 그렇다"고 자랑하고,
  어려운 일이 생기면
  "내가 부모로서 부족해서 그렇다"고 자책한다면
  부모의 삶은 너무 무거워질 것입니다.

  우리는 모든 것을 통제할 수 없습니다.

  감자가 어떤 성격의 아이로 자랄지,
  어떤 재능을 갖게 될지,
  어떤 길을 선택하게 될지
  지금 우리가 다 알 수 없습니다.

  우리가 할 수 있는 것은
  사랑하고 가르치고 기다려 주며
  하나님께 맡겨진 생명을 성실하게 돌보는 것입니다.

  그리고 부모인 우리 자신도
  하나님께서 빚어 가시는 사람이라는 사실을 기억하는 것입니다.

  감자만 자라는 것이 아닙니다.
  우리도 부모가 되어 가고 있습니다.

  아직 서툴고 모르는 것이 많아도 괜찮습니다.
  하나님께서는 완성된 부모를 찾아 우리에게 감자를 맡기신 것이 아닙니다.

  부족한 두 사람에게 한 생명을 맡기시고
  그 과정 속에서 우리도 함께 자라게 하십니다.

  이것은 참 은혜로운 일입니다.

  우리가 완벽하지 않다는 사실이
  반드시 절망적인 소식은 아닙니다.

  오히려 우리가 부족하기 때문에
  하나님을 의지할 자리가 생깁니다.

  바울이 말하는 "없는 것들"을 하나님께서 택하셨다는 말씀도
  바로 그런 방향으로 우리를 이끕니다.

  하나님은 세상의 기준으로 부족해 보이는 사람을 통해서도
  자신의 일을 이루십니다.

  그러니 오늘 하루를 돌아보면서
  "나는 왜 이것밖에 못 했을까"라고만 생각하지 않았으면 좋겠습니다.

  반대로
  "나는 이 정도는 했으니 괜찮은 사람이지"라고
  스스로를 높일 필요도 없습니다.

  오늘의 우리는 그저
  하나님께 부름받은 사람입니다.

  잘한 날에도 하나님께 속해 있고,
  부족한 날에도 하나님께 속해 있습니다.

  일에서 좋은 결과를 얻은 날에도 그렇고,
  아무것도 제대로 해내지 못한 것처럼 느껴지는 날에도 그렇습니다.

  부부 사이에서 서로에게 좋은 배우자였던 날에도 그렇고,
  피곤해서 말 한마디가 날카롭게 나왔던 날에도 그렇습니다.

  우리의 가치가 하루의 성적표에 따라 오르내리지 않습니다.

  그리스도께서 우리의 의로움이 되셨기 때문입니다.

  이것이 복음이 주는 자유입니다.

  우리는 스스로를 구원할 필요가 없습니다.
  스스로 자신의 가치를 만들어 낼 필요도 없습니다.
  예수님께서 이미 우리를 위해 하신 일이 있기 때문입니다.

  그래서 오늘 밤 우리에게 남는 자랑은
  "우리 부부가 꽤 잘하고 있다"가 아닐지도 모르겠습니다.

  오히려

  "우리가 부족한데도 여기까지 왔구나."
  "우리가 잘해서만이 아니라 하나님의 은혜였구나."
  "우리에게 맡겨진 이 새로운 삶도 주님의 손에 있구나."

  하는 고백일 것 같습니다.

  그리고 서로를 바라보면서도
  상대방의 부족함보다 먼저
  하나님께서 그 사람을 사랑하신다는 사실을 기억하면 좋겠습니다.

  아내도 하나님께서 사랑하시는 사람이고,
  저도 그렇습니다.

  앞으로 태어날 감자도
  우리가 만들어 내는 성취가 아니라
  하나님께서 우리에게 맡겨 주신 생명입니다.

  그러니 오늘 밤에는
  조금 힘을 빼도 괜찮겠습니다.

  잘 보이려고 애쓰지 않아도 되고,
  완벽한 남편이나 아내가 되려고 조급해하지 않아도 됩니다.

  물론 내일도 서로 사랑하기 위해 노력해야 합니다.
  그러나 그 노력의 출발점은
  "내가 부족하니까 더 증명해야 한다"가 아니라
  "이미 받은 사랑이 있으니 그 사랑을 흘려보내자"여야 합니다.

  이것이 주 안에서 자랑하는 사람의 삶일 것입니다.

  우리의 자랑은 우리의 능력에 있지 않습니다.
  우리의 자랑은 우리의 계획에도 있지 않습니다.
  우리의 자랑은 심지어 우리가 얼마나 믿음이 좋은가에도 있지 않습니다.

  우리의 자랑은 예수 그리스도께 있습니다.

  그러니 오늘 주일의 마지막에
  우리 자신을 평가하는 일을 잠시 멈추면 좋겠습니다.

  잘한 것도 하나님께 감사드리고,
  부족했던 것은 주님께 맡기고,
  내일 다시 사랑하면 됩니다.

  우리는 대단해서 하나님께 선택받은 사람들이 아니라,
  하나님께서 은혜로 불러 주신 사람들입니다.

  그리고 그 은혜 안에서
  오늘도 함께 살아가고 있습니다.

  이것이면 충분합니다.

questions:
  - "오늘 말씀을 들으며 '내가 나를 증명하려고 애쓰고 있었구나' 싶었던 부분이 있다면 무엇인가요?"
  - "서로의 능력이나 잘한 일을 떠나서, 배우자에게 '당신이라서 고마워'라고 말해 주고 싶은 것이 있나요?"
  - "감자가 자라면서 우리에게도 부모로서 부족한 모습이 생길 텐데, 그때 우리가 꼭 기억하고 싶은 복음의 한 문장은 무엇일까요?"

prayer: |
  하나님 아버지,
  우리가 가진 것과 이루어 놓은 것을 자랑하기보다
  우리를 먼저 불러 주신 은혜를 기억하게 해 주세요.

  우리는 때때로 다른 사람과 비교하고,
  우리의 능력을 증명하려 하고,
  잘하지 못한 날에는 스스로를 너무 쉽게 정죄합니다.
  그런 마음에서 우리를 자유롭게 해 주세요.

  우리의 자랑이 성취나 조건에 있지 않고
  예수 그리스도께 있음을 마음 깊이 붙들게 해 주세요.
  주님께서 우리의 지혜가 되시고,
  의로움과 거룩함과 구원이 되어 주셨다는 사실이
  하루를 살아갈 든든한 기초가 되게 해 주세요.

  아내를 주님께서 귀하게 바라보시는 시선으로 저도 바라보게 해 주세요.
  서로의 부족한 부분을 발견할 때 점수를 매기기보다
  먼저 사랑할 수 있게 하시고,
  아내가 애쓰고 있는 작은 일들도 지나치지 않고 알아주는 남편이 되게 해 주세요.
  오늘 밤에는 마음의 무게를 내려놓고
  편안하게 웃으며 쉴 수 있게 해 주세요.

  감자를 기다리는 우리에게도 지혜를 주세요.
  좋은 부모가 되어야 한다는 부담 때문에
  스스로를 몰아붙이지 않게 하시고,
  한 생명을 맡겨 주신 은혜를 감사함으로 받아들이게 해 주세요.
  감자가 자라나는 동안 우리도 함께 자라게 하시며,
  아직 만나지 않은 그 아이의 삶을 우리의 계획으로 다 만들려 하지 않고
  하나님께서 인도하실 길을 신뢰하게 해 주세요.

  우리 부부가 서로에게 경쟁자가 되지 않고
  함께 은혜를 받은 사람으로 살아가게 해 주세요.
  한 사람이 힘들 때 다른 사람이 손을 내밀고,
  한 사람이 잘했을 때 진심으로 기뻐해 주며,
  우리의 부족함 때문에 서로를 작게 만들지 않게 해 주세요.

  우리가 무엇을 이루었기 때문에 하나님께 사랑받는 것이 아니라,
  예수 그리스도 안에서 먼저 사랑받았다는 사실을 잊지 않게 해 주세요.
  그래서 실패한 날에도 다시 일어설 수 있고,
  잘된 날에도 교만하지 않을 수 있게 해 주세요.

  우리의 자랑이 오직 주님께 있게 하시고,
  오늘 받은 은혜를 내일의 삶으로 조용히 이어가게 해 주세요.

  예수 그리스도의 이름으로 기도드립니다.
  아멘.

