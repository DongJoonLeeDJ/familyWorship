title: "감사로 기억하는 하루"
subtitle: "한 걸음씩 인도하시는 하나님의 은혜"
date: "2026-06-09"

calling: |
  오늘도 우리 가정을 인도하신 하나님께 감사드립니다.

  우리의 계획보다 앞서 일하시고,
  우리의 염려보다 크신 은혜로 돌보시는 하나님을 찬양합니다.

  기쁨과 감사의 마음으로
  하나님 앞에 예배드립니다.

verse1_title: "시편 126:3"
verse1: |
  여호와께서 우리를 위하여
  큰 일을 행하셨으니
  우리는 기쁘도다

verse2_title: "데살로니가전서 5:18"
verse2: |
  범사에 감사하라
  이것이 그리스도 예수 안에서
  너희를 향하신 하나님의 뜻이니라

reflection: |
  지난 일주일은 길게 느껴졌습니다.

  심장박동을 처음 확인했던 날의 기쁨도 있었고,
  출혈과 피고임 때문에 걱정했던 순간도 있었습니다.

  그리고 오늘,
  우리는 감자의 심장 소리를 들었습니다.

  눈으로만 보던 박동이 아니라,
  실제로 뛰고 있는 소리를 들으며
  하나님께 감사하지 않을 수 없습니다.

  물론 아직 모든 과정이 끝난 것은 아닙니다.

  피고임이 조금 남아 있어
  주사를 더 맞아야 하고,
  앞으로도 여러 검진과 기다림이 남아 있습니다.

  하지만 오늘은 남아 있는 걱정보다
  하나님께서 이미 베풀어 주신 은혜를 기억하고 싶습니다.

  IVF를 시작할 때만 해도
  지금 이 순간을 상상하며 기도했습니다.

  그리고 하나님께서는 하루씩,
  한 단계씩,
  우리를 여기까지 인도해 주셨습니다.

  신앙은 모든 문제가 사라졌을 때 감사하는 것이 아니라,
  아직 과정 가운데 있어도
  하나님의 손길을 발견하는 것입니다.

  오늘은 하나님께서 주신 선물을 기뻐해도 되는 날입니다.

  감자의 심장 소리를 듣게 하신 하나님께 감사하고,
  아내의 몸을 지켜 주신 하나님께 감사하고,
  여기까지 함께 걸어오게 하신 하나님께 감사합시다.

  그리고 앞으로의 길도
  같은 하나님께 맡겨 드립시다.

questions:
  - "오늘 초음파 검사에서 가장 감사했던 순간은 무엇이었나요?"
  - "지난 한 달 동안 하나님께서 우리를 인도하셨다고 느끼는 장면은 무엇인가요?"
  - "앞으로 분만병원을 알아보는 새로운 과정 속에서 하나님께 맡기고 싶은 것은 무엇인가요?"

prayer: |
  하나님 아버지,

  오늘 우리에게 큰 기쁨을 허락해 주셔서 감사합니다.

  감자의 심장 소리를 듣게 하시고,
  지금까지 생명을 지켜 주셔서 감사합니다.

  IVF 과정의 모든 순간을 돌아볼 때
  우리의 힘보다 하나님의 은혜가 더 컸음을 고백합니다.

  오늘 좋은 소식을 듣게 하시고,
  미라클병원 졸업이 가까워지고 있다는 이야기를 듣게 하심도 감사합니다.

  아직 피고임이 조금 남아 있으니
  잘 흡수되게 하시고,
  남아 있는 출혈의 원인들도 회복되게 하여 주옵소서.

  남은 주사 치료도 잘 감당하게 하시고,
  아내의 몸을 보호하여 주옵소서.

  감자가 건강하게 자라게 하시고,
  앞으로의 임신 기간도 주님의 손으로 지켜 주옵소서.

  분만병원을 알아보는 새로운 과정 가운데도
  우리 부부에게 지혜를 주시고,
  필요한 길을 열어 주옵소서.

  오늘의 기쁨을 당연하게 여기지 않게 하시고,
  감사할 줄 아는 마음을 허락하여 주옵소서.

  하나님께서 오늘 우리 가정에
  감사와 평안과 소망을 허락해 주시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 9일 화요일 가정예배"