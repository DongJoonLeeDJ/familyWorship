title: "길이 없을 때 길을 여시는 하나님"
subtitle: "불가능처럼 보이는 자리에서도 함께하시는 주님"
date: "2026-08-05"

calling: |
  사랑의 하나님 아버지,
  오늘 하루도 우리와 함께 걸어 주심을 감사합니다.
  잠시 모든 염려를 내려놓고,
  주님의 말씀 앞에서 쉼을 얻게 하옵소서.
  오늘도 우리를 향한 하나님의 사랑을 깊이 깨닫게 하옵소서.

verse1_title: "출애굽기 14:13-14"
verse1: |
  모세가 백성에게 이르되 너희는 두려워하지 말고 가만히 서서 여호와께서 오늘 너희를 위하여 행하시는 구원을 보라 너희가 오늘 본 애굽 사람을 영원히 다시 보지 아니하리라.
  여호와께서 너희를 위하여 싸우시리니 너희는 가만히 있을지니라.

verse2_title: "로마서 5:8"
verse2: |
  우리가 아직 죄인 되었을 때에 그리스도께서 우리를 위하여 죽으심으로 하나님께서 우리에 대한 자기의 사랑을 확증하셨느니라.

reflection: |
  살아가다 보면 눈앞에 벽이 놓인 것처럼 느껴질 때가 있습니다. 아무리 생각해도 방법이 보이지 않고, 앞으로 어떻게 해야 할지 막막한 순간이 찾아옵니다. 그럴 때 우리는 종종 '길이 없다'고 결론을 내리곤 합니다.

  하지만 출애굽기의 이스라엘 백성도 똑같은 자리에 서 있었습니다. 앞에는 홍해가 있고, 뒤에는 애굽의 군대가 따라왔습니다. 사람의 눈으로 보면 선택지는 하나도 없었습니다. 그러나 하나님께서는 그들이 막다른 길이라고 생각한 바로 그곳에서 새로운 길을 여셨습니다. 바다는 장애물이 아니라 구원의 통로가 되었습니다.

  하나님께서는 지금도 같은 방식으로 일하십니다. 우리의 모든 문제를 즉시 없애 주신다는 뜻은 아닙니다. 오히려 하나님은 우리가 하나님을 더 깊이 신뢰하도록, 때로는 예상하지 못한 방법으로 길을 만들어 가십니다. 그래서 믿음은 문제가 없는 상태가 아니라, 문제 가운데서도 하나님이 함께하신다는 사실을 붙드는 것입니다.

  또 한편으로 하나님은 우리를 있는 모습 그대로 사랑하십니다. 우리가 완전해서 사랑하시는 것이 아니라, 아직 부족할 때 먼저 사랑하셨습니다. 그러나 그 사랑은 우리를 그대로 머물게 하지 않습니다. 하나님은 사랑으로 우리를 조금씩 빚어 가십니다. 거친 돌을 장인이 다듬듯, 하나님은 우리의 성품과 믿음, 그리고 가정을 아름답게 만들어 가십니다.

  요즘 우리 부부도 부모가 되어 가는 새로운 시간을 지나고 있습니다. 기쁜 날도 있고, 예상하지 못한 걱정이 생기는 날도 있습니다. 하지만 돌이켜 보면 하나님께서는 언제나 그때그때 필요한 은혜를 주셨습니다. 미래를 한꺼번에 보여 주시지는 않았지만, 오늘 걸을 만큼의 빛은 늘 비추어 주셨습니다.

  감자도 하나님의 손 안에서 하루하루 자라가고 있습니다. 눈에 띄는 변화보다 보이지 않는 시간이 훨씬 길지만, 하나님은 그 조용한 시간에도 쉼 없이 일하고 계십니다. 마찬가지로 우리 부부의 믿음도 하나님께서 천천히, 그러나 분명하게 자라게 하실 것입니다.

  오늘 말씀은 우리에게 이렇게 초대합니다. 길이 보이지 않을 때에도 하나님의 손은 멈추지 않았음을 믿으라고 말입니다. 우리를 먼저 사랑하신 하나님께서는 앞으로도 우리를 가장 좋은 길로 인도하실 것입니다. 그러므로 오늘도 우리는 두려움보다 소망을 선택하며 하루를 마무리할 수 있습니다.

questions:
  - "최근 하나님께서 예상하지 못한 방법으로 도와주셨던 일이 있었나요?"
  - "지금 하나님께 맡기고 싶은 '홍해' 같은 문제는 무엇인가요?"
  - "오늘 서로에게 하나님의 사랑을 전할 수 있는 작은 행동은 무엇일까요?"

prayer: |
  사랑의 하나님 아버지,
  우리가 길이 보이지 않는 순간에도
  먼저 앞서가시며 길을 여시는 주님을 찬양합니다.

  눈앞의 상황보다 주님의 신실하심을 더 바라보게 하시고,
  두려움보다 믿음을 선택하는 하루하루가 되게 하옵소서.

  사랑하는 아내를 주님의 평안으로 감싸 주시고,
  몸과 마음을 세밀하게 돌보아 주셔서
  하루를 지낼수록 회복의 기쁨을 더 누리게 하옵소서.

  감자를 주님의 가장 따뜻한 손으로 품어 주시고,
  하나님의 계획 가운데 아름답게 자라게 하옵소서.
  태어나기 전부터 하나님의 사랑을 받는 귀한 생명임을
  우리 부부도 늘 기억하게 하옵소서.

  우리 가정이 완벽해서가 아니라
  하나님의 은혜로 세워지는 가정이 되게 하시고,
  서로를 격려하며 함께 믿음으로 걸어가게 하옵소서.

  우리를 끝까지 사랑하시고 새롭게 빚어 가시는
  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 8월 5일 수요일 가정예배"
