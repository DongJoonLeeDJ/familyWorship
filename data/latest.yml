title: "하나님의 영광이 드러나는 자리"

subtitle: "우리의 준비와 하나님의 임재"

date: "2026-11-26"

calling: "오늘도 말씀 앞에 함께 머물며, 하나님께서 우리 가운데 행하시는 일을 바라보겠습니다."

verse1_title: "레위기 8:30"

verse1: "모세가 관유와 제단 위의 피를 가져다가 아론과 그의 옷과 그의 아들들과 그의 아들들의 옷에 뿌려서 아론과 그의 옷과 그의 아들들과 그의 아들들의 옷을 거룩하게 하고"

verse2_title: "레위기 9:24"

verse2: "불이 여호와 앞에서 나와 제단 위의 번제물과 기름을 사른지라 온 백성이 이를 보고 소리 지르며 엎드렸더라"

reflection: "레위기 8장에서는 제사장들이 하나님을 섬기기 위해 구별되는 과정을 보여주고, 9장에서는 마침내 하나님께서 임하시는 장면이 나옵니다. 아론과 그의 아들들이 제사장의 일을 시작했을 때, 그들이 준비한 제물을 하나님께서 받으시는 모습을 온 백성이 목격했습니다. 사람의 준비와 수고가 예배의 전부는 아니었습니다. 그 자리에 하나님의 임재가 드러났을 때 백성은 기쁨과 경외함으로 엎드렸습니다. 우리도 무언가를 잘 해내는 데만 마음을 쓰기보다, 우리의 삶과 예배 가운데 하나님을 바라보는 마음을 잃지 않았으면 좋겠습니다."

questions:
  - "우리는 신앙생활을 하면서 하나님을 바라보기보다 해야 할 일이나 형식에 마음을 빼앗길 때가 있나요?"
  - "오늘 우리 일상에서 하나님의 임재를 기억하며 살아갈 수 있는 순간은 언제일까요?"

prayer: "하나님 아버지, 주님을 섬기는 일에 익숙해지면서 정작 하나님을 바라보는 마음을 놓치지 않게 해주세요. 우리의 준비와 노력만으로 충분하다고 여기지 않고, 예배와 삶의 중심에 하나님을 모시게 하소서. 감자와 함께 맞이할 새로운 가정의 시간에도 주님을 기억하며 살아가게 하시고, 우리 부부가 서로를 존중하며 믿음 안에서 함께 자라가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 26일 목요일 가정예배"