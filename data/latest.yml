title: "사랑으로 행하는 하루"
subtitle: "하나님의 사랑을 받은 우리가 사랑을 흘려보냅니다"
date: "2026-06-30"

calling: |
  사랑의 하나님 아버지,
  오늘도 우리를 먼저 사랑하여 주심에 감사합니다.
  우리의 말과 행동, 생각과 마음이 모두 사랑으로 시작되게 하옵소서.

verse1_title: "고린도전서 16장 14절"
verse1: |
  너희 모든 일을 사랑으로 행하라.

verse2_title: "요한일서 4장 19절"
verse2: |
  우리가 사랑함은
  그가 먼저 우리를 사랑하셨음이라.

reflection: |
  바울은 고린도전서를 마무리하며 짧지만 깊은 권면을 남깁니다.
  "너희 모든 일을 사랑으로 행하라."

  여기서 '모든 일'에는 특별한 사역만이 아니라
  평범한 일상도 포함됩니다.
  가족과 나누는 대화, 직장에서의 업무,
  누군가를 배려하는 작은 행동까지도
  사랑이 전제가 될 때 하나님께서 기뻐하시는 삶이 됩니다.

  우리는 완전해서 사랑할 수 있는 사람이 아니라,
  하나님께 먼저 사랑받은 사람이기에 사랑할 수 있습니다.
  하나님의 사랑을 경험한 사람은
  그 사랑을 다시 흘려보내는 통로가 됩니다.

  요즘 우리 가정에도 하나님의 사랑이 계속해서 나타나고 있습니다.
  아내를 지켜 주시고,
  감자를 건강하게 자라게 하시며,
  부부가 함께 기도하고 서로를 아끼게 하시는 것도
  모두 하나님의 사랑의 표현입니다.

  오늘 하루도 어떤 일을 하든
  '내가 옳은가'보다 '내가 사랑으로 행하고 있는가'를 먼저 돌아보면 좋겠습니다.
  하나님께 받은 사랑이 우리 가정을 통해 주변 사람들에게도 전해지기를 소망합니다.

questions:
  - "오늘 내가 가장 먼저 사랑으로 대해야 할 사람은 누구인가요?"
  - "최근 하나님께 사랑받고 있음을 느꼈던 순간은 언제였나요?"
  - "오늘 말과 행동에서 사랑을 표현할 수 있는 작은 실천은 무엇인가요?"

prayer: |
  사랑의 하나님 아버지,
  먼저 우리를 사랑하여 주시고
  그 사랑 안에서 살아가게 하심에 감사합니다.

  우리의 모든 말과 행동이 사랑으로 시작되게 하시고,
  옳음을 주장하기보다 사랑을 실천하는 마음을 허락하여 주옵소서.

  직장과 가정, 만나는 모든 사람과의 관계 속에서
  예수님의 사랑을 전하는 통로가 되게 하옵소서.

  아내를 오늘도 사랑으로 붙들어 주셔서
  입덧 가운데서도 평안과 새 힘을 허락하여 주시고,
  감자를 건강하게 보호하셔서 하루하루 주님의 은혜 가운데 자라게 하옵소서.

  우리 부부가 서로를 더욱 사랑하고 존중하며,
  하나님의 사랑을 가장 먼저 가정 안에서 실천하는 사람들이 되게 하옵소서.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 30일 화요일 가정예배"