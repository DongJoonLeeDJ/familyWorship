title: "주님이 주신 자리에서"
subtitle: "오늘의 작은 일에도 하나님을 모십니다"
date: "2026-08-27"

calling: |
  오늘 하루를 돌아보며 하나님 앞에 잠시 머뭅니다.
  특별하지 않았던 순간까지도 주님께서 아시는 시간임을 기억하며,
  우리의 일상과 마음을 하나님께 맡겨 드리겠습니다.

verse1_title: "무슨 일을 하든지"
verse1: |
  골로새서 3:23-24
  무슨 일을 하든지 마음을 다하여 주께 하듯 하고 사람에게 하듯 하지 말라
  이는 기업의 상을 주께 받을 줄 아나니 너희는 주 그리스도를 섬기느니라

verse2_title: "작은 것에 충성된 사람"
verse2: |
  누가복음 16:10
  지극히 작은 것에 충성된 자는 큰 것에도 충성되고
  지극히 작은 것에 불의한 자는 큰 것에도 불의하니라

reflection: |
  하루를 보내다 보면 "이게 무슨 의미가 있나" 싶은 일들이 있습니다. 반복되는 일, 귀찮은 일, 아무도 알아주지 않는 작은 수고도 있습니다. 하지만 하나님께서는 우리가 무엇을 얼마나 크게 이루었는지만 보시는 분이 아닙니다. 오늘 주어진 자리에서 어떻게 살아갔는지를 바라보십니다.

  바울은 무슨 일을 하든지 "주께 하듯" 하라고 말합니다. 일이 크든 작든, 누가 알아주든 그렇지 않든 그 자리를 하나님 앞에서 살아가는 것입니다.

  우리의 가정도 그렇습니다. 앞으로 감자가 태어나면 하루에도 수많은 작은 일이 생길 것입니다. 먹이고, 씻기고, 재우고, 치우고, 또 같은 일을 반복하게 될 것입니다. 그중에는 아무도 박수를 보내지 않는 일도 많겠지요. 그러나 그런 작은 돌봄 하나하나가 사랑이 될 것입니다.

  지금의 우리 삶도 마찬가지입니다. 오늘 해야 할 일을 하고, 아내의 이야기를 들어 주고, 서로에게 필요한 것을 챙겨 주는 평범한 일상이 하나님과 무관한 시간이 아닙니다. 오히려 하나님께서 우리를 빚어 가시는 자리일 수 있습니다.

  그러니 오늘 하루가 특별하지 않았다고 아쉬워하지 않았으면 좋겠습니다. 하나님께서 주신 자리에서 충실하게 살아낸 하루라면 충분히 귀합니다. 우리의 가치를 큰 성취로 증명할 필요도 없습니다. 그리스도께서 이미 우리를 사랑하시고 붙드시는 가운데 오늘의 작은 일들을 살아가는 것이니까요.

  오늘 밤, "별것 없었던 하루"가 아니라 "하나님께서 내게 맡기신 하루"라고 다시 바라보면 좋겠습니다. 그리고 내일도 거창한 일을 찾기보다, 주님께 하듯 우리의 작은 일을 사랑으로 해 나가면 좋겠습니다.

questions:
  - "오늘 내가 별것 아니라고 생각했던 일 중 감사할 일은 무엇인가요?"
  - "아내가 오늘 해 준 작은 수고 가운데 기억하고 싶은 것은 무엇인가요?"
  - "내일 내가 조금 더 사랑으로 해 보고 싶은 작은 일은 무엇인가요?"

prayer: |
  하나님, 오늘 우리에게 맡겨 주신 평범한 하루를 감사합니다.
  크고 특별한 일만 가치 있다고 생각하지 않고, 작은 일에도 주님을 섬기는 마음을 갖게 해 주세요.
  아내의 수고를 당연하게 여기지 않고 알아주게 하시며, 우리 둘의 평범한 일상 속에도 감사가 자라게 해 주세요.
  앞으로 감자와 함께 살아갈 날에도 수많은 작은 일들을 사랑으로 감당하게 하시고, 우리가 잘해서가 아니라 그리스도께서 먼저 붙드신다는 사실 안에서 자유롭게 살아가게 해 주세요.
  우리의 모든 삶의 주인이신 예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 8월 27일 목요일 가정예배"