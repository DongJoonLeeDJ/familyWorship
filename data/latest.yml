title: "보이지 않아도 자라고 있습니다"
subtitle: "기다림 속에서도 일하시는 하나님"
date: "2026-08-14"

calling: |
  오늘 하루도 어느새 저물었습니다.
  우리가 알지 못하는 사이에도 자라는 것들이 있습니다.
  눈에 잘 띄지 않는 마음의 변화도 있고, 하루하루 쌓이는 시간도 있으며,
  아직 만나지 못한 내일도 있습니다.

  오늘은 우리가 모든 것을 확인하려 하기보다,
  보이지 않는 곳에서도 일하시는 하나님을 바라보며
  잠시 마음을 내려놓고 함께 예배드리겠습니다.

verse1_title: "때를 따라 아름답게 하시는 하나님"
verse1: |
  전도서 3:11
  하나님이 모든 것을 지으시되 때를 따라 아름답게 하셨고
  또 사람들에게는 영원을 사모하는 마음을 주셨느니라
  그러나 하나님이 하시는 일의 시종을 사람으로 측량할 수 없게 하셨도다

verse2_title: "믿음은 보이지 않는 것을 바라봅니다"
verse2: |
  히브리서 11:1
  믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니

reflection: |
  우리가 살아가면서 의외로 자주 하는 일이 있습니다.
  아직 때가 되지 않은 것을 자꾸 확인하는 것입니다.

  씨앗을 심어 놓고 얼마나 자랐는지 땅을 파 보고 싶어집니다.
  아이가 잘 자라고 있는지 궁금하고,
  내일 어떤 일이 생길지도 알고 싶습니다.
  내가 한 일이 제대로 진행되고 있는지도 계속 확인하고 싶습니다.

  그런데 생명은 우리가 확인한다고 더 빨리 자라지는 않습니다.
  오히려 우리가 보지 않는 동안에도 자기만의 시간을 따라 자랍니다.

  전도서는 하나님께서 모든 것을 때를 따라 아름답게 하신다고 말합니다.
  참 재미있는 것은 바로 뒤에 우리가 하나님의 일을 처음부터 끝까지
  다 측량할 수 없다고 말한다는 것입니다.

  우리는 결과를 보고 싶어 합니다.
  시작하면 끝이 어떻게 될지 알고 싶고,
  기다림이 시작되면 언제 끝날지 알고 싶습니다.
  하지만 하나님께서 우리에게 허락하시는 삶은
  언제나 그렇게 한눈에 보이는 삶은 아닙니다.

  그래서 믿음이 필요합니다.

  믿음은 내가 모든 것을 알고 있다는 뜻이 아닙니다.
  오히려 내가 다 알지 못한다는 사실을 인정하면서도
  하나님을 신뢰하는 것입니다.

  히브리서에서는 믿음을 "보이지 않는 것들의 증거"라고 말합니다.
  이것은 아무 근거 없이 막연히 낙관하는 것과는 다릅니다.
  보이지 않는 하나님을 신뢰하기 때문에,
  아직 보이지 않는 하나님의 일도 기다릴 수 있다는 뜻에 가깝습니다.

  생각해 보면 우리 부부의 삶에도
  이런 "아직 보이지 않는 것"이 참 많습니다.

  지금 우리가 알고 있는 것은 하루하루의 작은 모습뿐입니다.
  오늘의 일과, 오늘 나눈 대화와, 오늘 먹은 음식과,
  오늘 느낀 피곤함과 기쁨 정도입니다.
  그러나 하나님께서는 우리가 아직 경험하지 않은 내일까지 알고 계십니다.

  감자도 그렇습니다.

  우리는 초음파 화면을 통해 조금씩 모습을 확인하고,
  시간이 지나면서 자라는 모습을 보게 됩니다.
  하지만 우리가 볼 수 있는 것은 생명의 아주 작은 한 장면일 뿐입니다.
  하나님께서는 우리가 아직 만나지 못한 감자의 시간까지 알고 계십니다.

  그리고 여기서 한 걸음 더 생각해 보면,
  하나님께서 빚어 가시는 것은 감자만이 아닌 것 같습니다.

  우리도 부모가 되어 가고 있습니다.

  아직 아이를 실제로 품에 안아 본 적도 없고,
  부모가 된다는 것이 정확히 어떤 것인지 다 알지도 못합니다.
  앞으로 얼마나 많은 예상 밖의 일이 생길지도 모릅니다.
  우리가 세워 놓은 계획이 그대로 흘러가지 않을 수도 있습니다.

  하지만 지금 우리는 조금씩 부모가 되어 가고 있습니다.
  기다리는 법을 배우고,
  우리의 한계를 인정하는 법을 배우고,
  무엇보다 우리 힘으로 모든 것을 통제할 수 없다는 사실을
  조금씩 받아들이고 있습니다.

  어쩌면 이것도 하나님께서 우리를 준비시키시는 시간인지 모릅니다.

  하나님께서는 결과만 주시는 분이 아니라
  그 결과를 기다리는 동안 우리 자신도 빚어 가시는 분이십니다.

  그래서 오늘 우리가 꼭 모든 것을 알아야 할 필요는 없습니다.
  오늘 해결되지 않은 일이 있다고 해서
  하나님께서 아무것도 하지 않고 계신 것도 아닙니다.

  아직 답을 모르는 것과 하나님께서 모르시는 것은 전혀 다릅니다.

  우리는 모르지만 하나님은 아십니다.
  우리는 내일을 보지 못하지만 하나님은 내일도 알고 계십니다.
  우리는 지금 눈앞에 있는 것밖에 보지 못하지만
  하나님께서는 우리의 삶을 처음과 끝의 한 장면으로 보지 않으시고
  자신의 뜻 안에서 이어지는 하나의 길로 보고 계십니다.

  그러니 오늘 밤에는 모든 것을 확인하려는 마음을 조금 내려놓아도 좋겠습니다.

  "왜 아직 이렇지?"
  "앞으로 어떻게 되지?"
  "내가 잘하고 있는 걸까?"

  이런 질문들이 마음에 떠오를 수 있습니다.
  그 질문 자체가 믿음 없는 모습은 아닙니다.
  기다리는 사람이라면 누구나 그런 생각을 할 수 있습니다.

  중요한 것은 그 질문을 품은 채 어디로 가느냐는 것입니다.

  우리는 그 마음을 하나님께 가져갈 수 있습니다.

  예수님께서도 제자들에게 모든 미래의 일을 미리 알려 주시는 방식으로
  그들을 인도하지 않으셨습니다.
  대신 제자들과 함께 걸으셨고,
  그들이 이해하지 못하는 순간에도 곁에 계셨습니다.

  우리에게도 그렇습니다.

  하나님을 믿는다는 것은 내일의 모든 장면을 미리 보는 것이 아니라,
  내일을 알고 계시는 하나님과 함께 오늘을 살아가는 것입니다.

  그래서 오늘 하루를 무사히 지나온 것만으로도 감사할 수 있습니다.
  아직 오지 않은 내일을 오늘 밤 미리 살아내지 않아도 됩니다.

  아내도 오늘 하루의 모든 것을 해결할 필요가 없고,
  저도 앞으로의 모든 일을 미리 준비할 필요가 없습니다.
  우리에게 주어진 오늘만큼은 오늘 살아내고,
  오늘의 끝에서는 하나님께 맡기면 됩니다.

  그리고 우리가 잠든 사이에도 하나님께서는 일하십니다.

  우리가 눈을 감는다고 해서 하나님께서 함께 눈을 감으시는 것이 아닙니다.
  우리가 아무것도 하지 않는 밤에도 생명은 자라고,
  시간은 흐르고,
  하나님께서 지으신 세계는 계속 움직입니다.

  그러니 오늘 밤의 믿음은 거창하지 않아도 좋겠습니다.

  "하나님, 제가 모르는 것이 많습니다.
  하지만 하나님께서 모르시는 것은 없다는 것을 믿습니다."

  그 정도의 고백이면 충분할 것 같습니다.

  우리가 잘해서 미래가 안전해지는 것이 아닙니다.
  우리가 모든 것을 통제해서 감자의 미래가 보장되는 것도 아닙니다.
  우리의 부족함보다 크신 하나님께서 우리를 붙드시고,
  우리보다 먼저 앞서 가시는 주님이 계시기에
  우리는 아직 보이지 않는 내일을 기다릴 수 있습니다.

  오늘도 우리에게 주어진 것은 오늘입니다.
  그리고 오늘 밤에는 하나님 앞에 함께 앉아 있습니다.

  이것이면 충분합니다.

  내일 무슨 일이 있을지는 아직 모르지만,
  내일도 하나님께서 계십니다.
  우리가 앞으로 어떤 부모가 될지도 아직 모르지만,
  우리를 먼저 사랑하신 하나님께서 그 길에도 함께하십니다.

  그러니 오늘 밤은 서둘러 결론을 내리지 않고,
  아직 자라고 있는 것들을 하나님께 맡겨 봅니다.

  감자도,
  우리 부부도,
  그리고 하나님께서 우리에게 주신 새로운 삶의 계절도
  하나님의 시간 안에 있습니다.

  우리는 모든 것을 볼 수 없지만,
  하나님은 보고 계십니다.

  그리고 그것만으로도 오늘 밤은 충분히 평안할 수 있습니다.

questions:
  - "오늘 내가 아직 알지 못해서 마음 한편에 남아 있는 일은 무엇인가요? 그것을 하나님께 맡긴다면 어떤 말을 드리고 싶나요?"
  - "우리 부부가 지금까지 지나오면서 '그때는 몰랐지만 지나고 보니 감사했던 일'이 있었나요?"
  - "오늘 밤 서로에게 '이건 내가 다 해결하지 않아도 괜찮아'라고 말해 주고 싶은 것이 있다면 무엇인가요?"

prayer: |
  하나님 아버지,
  오늘도 우리의 하루를 여기까지 인도해 주셔서 감사합니다.

  우리는 내일을 알고 싶어 하고,
  아직 보이지 않는 일들을 미리 확인하고 싶어 할 때가 많습니다.
  하지만 우리의 눈에는 보이지 않는 시간에도
  주님께서 일하고 계심을 믿습니다.

  우리가 알지 못하는 것을 억지로 알아내려 하기보다
  우리보다 앞서 가시는 주님을 신뢰하게 해 주세요.
  오늘 해결하지 못한 일은 오늘 밤 주님의 손에 내려놓고,
  내일의 일은 내일의 은혜 가운데 맞이하게 해 주세요.

  사랑하는 아내의 하루를 주님께서 품어 주세요.
  몸과 마음에 쌓인 작은 피로까지도 아시는 주님께서
  오늘 밤 편안한 쉼을 허락해 주시고,
  평범한 순간 속에서도 웃을 이유와 감사할 일을 발견하게 해 주세요.
  우리가 함께 부모가 되어 가는 이 시간을
  부담만으로 기억하지 않고 기쁨과 기대 속에서 지나가게 해 주세요.

  그리고 우리에게 맡겨 주신 감자를 생각합니다.
  우리가 볼 수 있는 것보다 훨씬 많은 일을 주님께서 알고 계심을 믿습니다.
  아직 만나지 못한 그날까지 감자의 모든 시간을 주님께서 아시고,
  우리에게 허락하신 자리에서 사랑으로 돌보게 해 주세요.
  감자를 통해 우리도 생명의 신비와 하나님의 섭리를 더 깊이 알아가게 해 주세요.

  우리 부부가 서로에게 조급함을 더하는 사람이 아니라
  기다림을 함께 견디어 주는 사람이 되게 해 주세요.
  서로 모르는 것을 가지고 다투기보다 함께 하나님께 물어보고,
  오늘의 작은 기쁨을 함께 누리며,
  때로는 아무 말 없이 곁에 있는 것만으로도 서로에게 힘이 되게 해 주세요.

  우리의 가정이 모든 것을 완벽하게 해내는 가정이 되기보다
  넘어지고 부족할 때에도 다시 주님께 돌아오는 가정이 되게 해 주세요.

  우리가 아직 보지 못하는 내일도 주님께서 알고 계시고,
  우리가 아직 알지 못하는 길에도 예수님께서 함께 걸어가심을 믿습니다.
  우리의 소망은 우리가 미래를 다 알고 있다는 데 있지 않고,
  우리를 먼저 사랑하시고 끝까지 붙드시는 주님께 있습니다.

  오늘 밤 그 사랑 안에서 편히 쉬게 해 주세요.

  예수 그리스도의 이름으로 기도드립니다.
  아멘.

