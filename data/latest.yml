title: "아이를 품는 마음으로 다시 읽는 이야기"

subtitle: "출애굽기 2장, 모세를 살리려 했던 사람들"

date: "2026-10-06"

calling: "출애굽기 2장을 부모의 마음으로 읽으니 예전과는 조금 다르게 다가옵니다. 한 아기를 살리기 위해 어머니는 석 달을 숨기고, 더 숨길 수 없게 되자 갈대 상자를 준비합니다. 그리고 그 아이를 발견한 바로의 딸 역시 울고 있는 아기를 불쌍히 여깁니다. 한 생명을 둘러싸고 여러 사람의 마음과 선택이 이어지는 장면입니다."

verse1_title: "출애굽기 2장 3절"

verse1: "더 숨길 수 없게 되매 그를 위하여 갈대 상자를 가져다가 역청과 나무 진을 칠하고 아기를 거기 담아 나일 강 가 갈대 사이에 두고"

verse2_title: "출애굽기 2장 6절"

verse2: "열고 그 아기를 보니 아기가 우는지라 그가 그를 불쌍히 여겨 이르되 이는 히브리 사람의 아기로다"

reflection: "아들의 부모가 된 지금 이 장면을 읽으면 모세의 어머니가 아기를 갈대 상자에 넣어 강에 띄워 보내는 마음이 조금 다르게 느껴집니다. 어떻게든 살리고 싶지만 내가 할 수 있는 일이 더 이상 많지 않은 순간이었을 것 같습니다. 한편으로는 ‘모세가 엄마보다는 아빠를 닮아서 들키지 않았던 것 아닐까’, 혹은 바로의 딸이 알아도 모르는 척해준 것은 아닐까 하는 상상도 해보게 됩니다. 본문이 그 부분을 말해주지는 않지만, 아기를 바라보는 부모의 마음으로 읽으니 이런 생각까지 자연스럽게 떠오릅니다. 우리도 감자를 기다리며 모든 순간을 미리 준비하거나 지켜낼 수는 없겠지만, 지금 우리가 할 수 있는 사랑과 돌봄을 다하고 나머지는 하나님께 맡기는 법을 조금씩 배워가면 좋겠습니다."

questions:
  - "감자를 기다리면서 내가 새롭게 알게 된 부모의 마음은 무엇일까?"
  - "우리가 아무리 애써도 우리 손을 떠나 맡겨야 하는 부분은 무엇일까?"

prayer: "하나님, 모세를 바라보던 부모의 마음을 생각하며 우리도 감자를 기다리는 마음을 돌아봅니다. 아직 만나지 못한 아이를 사랑하고 걱정하는 마음이 때로는 앞날을 미리 걱정하게 만들기도 합니다. 우리가 할 수 있는 것은 성실하게 준비하고 사랑으로 돌보되, 우리의 힘으로 어찌할 수 없는 것까지 붙잡고 불안해하지 않게 해주세요. 아이를 사랑하는 마음이 두려움에만 머물지 않고 감사와 기쁨으로도 이어지게 하시고, 우리 부부가 부모로서 서로의 부족한 부분을 채워가게 해주세요. 우리에게 맡겨진 한 생명을 소중히 여기며 하루하루 잘 살아가게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 6일 화요일 가정예배"
