title: "잠잠히 주님을 기다리는 마음"
subtitle: "내가 다 알지 못해도 하나님께 맡길 수 있습니다"
date: "2026-08-21"

calling: |
  오늘 하루도 이제 내려놓습니다.
  잘한 일도, 아쉬운 일도, 아직 마음에 남아 있는 생각도 잠시 하나님께 맡깁니다.
  우리의 마음을 조용히 가라앉히고, 우리보다 우리를 더 잘 아시는 하나님을 바라보며 예배하겠습니다.

verse1_title: "내 영혼이 고요하기를"
verse1: |
  시편 131:1-2
  여호와여 내 마음이 교만하지 아니하고 내 눈이 오만하지 아니하오며
  내가 큰 일과 감당하지 못할 놀라운 일을 하려고 힘쓰지 아니하나이다
  실로 내가 내 영혼으로 고요하고 평온하게 하기를
  젖 뗀 아이가 그의 어머니 품에 있음 같게 하였나니
  내 영혼이 젖 뗀 아이와 같도다

verse2_title: "수고하고 무거운 짐을 내려놓다"
verse2: |
  마태복음 11:28
  수고하고 무거운 짐 진 자들아 다 내게로 오라
  내가 너희를 쉬게 하리라

reflection: |
  우리는 하루를 살면서 생각보다 많은 것을 미리 걱정합니다. 아직 일어나지 않은 일을 생각하고, 내가 할 수 없는 일까지 붙잡고 있으면서 마음을 지치게 만들기도 합니다.

  시편 기자는 모든 것을 이해하고 통제하려 하지 않고 자신의 영혼을 하나님 앞에서 고요하게 합니다. 어린아이가 어머니의 품에 기대어 있듯이, 자신이 해결해야 할 모든 것을 내려놓는 것입니다.

  우리도 앞으로의 일을 전부 알 수는 없습니다. 부모가 되는 일도 그렇고, 감자를 기다리는 시간도 그렇습니다. 무엇을 준비해야 하는지는 조금씩 알아가겠지만, 모든 상황을 미리 통제할 수는 없습니다. 그래서 오히려 하나님께 맡길 자리가 생깁니다.

  오늘 밤에는 "내가 이것까지 걱정해야 하나?" 싶은 것 하나를 하나님께 내려놓으면 좋겠습니다. 아내도 오늘 하루의 수고를 잠시 내려놓고 편히 쉬었으면 좋겠습니다. 우리 둘이 서로에게 모든 답을 주어야 하는 것도 아닙니다. 때로는 그저 곁에 앉아 함께 하나님을 바라보는 것만으로 충분합니다.

  예수님께서는 지친 사람에게 더 무거운 짐을 얹지 않으시고 "내게로 오라"고 말씀하십니다. 우리가 잘해서 평안을 얻는 것이 아니라, 주님께 나아갈 수 있기 때문에 쉼을 얻습니다. 오늘 밤 우리의 마음도 그 품 안에서 잠잠해지기를 바랍니다.

questions:
  - "오늘 내가 하나님께 내려놓고 싶은 걱정은 무엇인가요?"
  - "오늘 하루, 배우자에게 고맙다고 말하고 싶은 작은 일이 있었나요?"
  - "우리 둘이 함께 하나님께 맡기고 싶은 내일의 한 가지는 무엇인가요?"

prayer: |
  하나님 아버지, 오늘도 우리의 마음을 살펴 주시니 감사합니다.
  우리가 알 수 없는 일까지 붙잡고 애쓰지 않고 주님께 맡길 수 있게 해 주세요.
  아내가 오늘의 수고를 내려놓고 편안히 쉬게 하시고, 감자를 기다리는 시간도 조급함보다 감사로 채워 주세요.
  우리 부부가 서로에게 답을 요구하기보다 함께 주님을 의지하게 하시고, 내일도 필요한 만큼의 힘을 주님께 받아 걸어가게 해 주세요.
  우리를 품으시고 쉬게 하시는 예수님의 이름으로 기도합니다. 아멘.

footer: "2026년 8월 21일 금요일 가정예배"
