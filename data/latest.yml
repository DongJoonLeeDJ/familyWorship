title: "내일을 맡기며 오늘을 살아가기"
subtitle: "기다림의 시간에도 함께하시는 하나님"
date: "2026-06-08"

calling: |
  우리의 앞날을 아시는 하나님께 나아갑니다.

  내일의 일을 알지 못하지만,
  오늘까지 인도하신 하나님을 알기에
  감사함으로 예배드립니다.

  우리보다 먼저 내일을 보고 계시는 주님을 신뢰하며
  이 시간을 주님께 맡겨 드립니다.

verse1_title: "마태복음 6:34"
verse1: |
  그러므로 내일 일을 위하여 염려하지 말라
  내일 일은 내일이 염려할 것이요
  한 날의 괴로움은 그 날로 족하니라

verse2_title: "시편 62:8"
verse2: |
  백성들아 시시로 그를 의지하고
  그의 앞에 마음을 토하라
  하나님은 우리의 피난처시로다

reflection: |
  내일은 기다리던 초음파 검사 날입니다.

  지난주에는 감자의 심장이 뛰고 있는 모습을 보았습니다.
  작은 생명이 실제로 살아 있다는 사실은
  우리에게 큰 감사와 기쁨이 되었습니다.

  내일은 또 어떤 소식을 듣게 될지 기대가 됩니다.

  심장박동 소리를 들을 수도 있고,
  피고임의 상태가 어떻게 변했는지도 확인할 수 있을 것입니다.

  하지만 기대가 큰 만큼
  마음 한편에는 긴장도 함께 찾아옵니다.

  우리는 좋은 소식을 듣고 싶고,
  모든 것이 잘 되고 있다는 말을 듣고 싶습니다.

  그러나 아직 결과를 알지 못하는 오늘,
  하나님께서는 우리를 기다림의 자리로 부르십니다.

  믿음은 모든 결과를 미리 아는 상태가 아닙니다.

  믿음은 결과를 모르는 순간에도
  하나님이 함께하신다는 사실을 붙드는 것입니다.

  지난 몇 주를 돌아보면,
  하나님께서는 한 걸음씩 우리를 인도해 주셨습니다.

  착상 확인도,
  혈액검사도,
  아기집 확인도,
  심장박동 확인도
  모두 하루씩 지나며 경험한 은혜였습니다.

  내일 역시 하나님께서 허락하시는 하루입니다.

  우리는 내일의 결과를 미리 붙잡을 수 없지만,
  오늘 하나님을 신뢰할 수는 있습니다.

  그리고 그것이면 오늘을 살아가기에는 충분합니다.

questions:
  - "내일 검사와 관련하여 가장 기대되는 것은 무엇인가요?"
  - "내 마음속에 있는 걱정은 무엇이며, 그것을 하나님께 어떻게 맡길 수 있을까요?"
  - "지금까지 IVF와 임신 과정 속에서 하나님께서 인도해 주셨다고 느끼는 순간은 무엇인가요?"

prayer: |
  하나님 아버지,

  오늘도 우리 가정을 지켜 주시고
  감자를 보호하여 주셔서 감사합니다.

  지난주 감자의 심장박동을 보게 하시고,
  여기까지 인도하여 주신 은혜를 기억합니다.

  내일은 초음파 검사를 받는 날입니다.

  기대도 있고 긴장도 있지만,
  아직 알 수 없는 결과 때문에 마음이 흔들리지 않게 하시고
  우리보다 먼저 내일을 보고 계시는 하나님을 신뢰하게 하옵소서.

  감자가 건강하게 자라고 있도록 지켜 주시고,
  심장박동도 안정적으로 유지되게 하여 주옵소서.

  아기집 주변의 피고임이 잘 흡수되게 하시고,
  출혈이 멈추게 하시며,
  아내의 몸을 보호하여 주옵소서.

  아내의 마음에 평안을 주시고,
  남편도 믿음과 사랑으로 곁을 잘 지키게 하옵소서.

  좋은 결과를 주시면 감사함으로 받게 하시고,
  어떤 상황에서도 하나님께 더욱 가까이 나아가는 가정이 되게 하옵소서.

  오늘 밤은 걱정보다 평안 가운데 쉬게 하시고,
  내일도 주님의 손 안에 있음을 기억하게 하옵소서.

  하나님께서 오늘 우리 가정에
  평안과 신뢰와 감사의 마음을 허락해 주시기를 바랍니다.

  예수님의 이름으로 기도합니다.
  아멘.

footer: "2026년 6월 8일 월요일 가정예배"