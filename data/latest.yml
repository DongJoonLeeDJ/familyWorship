title: "당신의 실로암은 어디입니까?"

subtitle: "주님의 말씀을 따라 한 걸음 내딛기"

date: "2026-11-28"

calling: "오늘 우리에게도 주님께서 눈을 열어 주시기를 바라며 말씀 앞에 함께 나아가겠습니다."

verse1_title: "요한복음 9:7"

verse1: "이르시되 실로암 못에 가서 씻으라 하시니 (실로암은 번역하면 보냄을 받았다는 뜻이라) 이에 가서 씻고 밝은 눈으로 왔더라."

verse2_title: "요한복음 9:11"

verse2: "대답하되 예수라 하는 그 사람이 진흙을 이겨 내 눈에 바르고 나더러 실로암에 가서 씻으라 하기에 가서 씻었더니 보게 되었노라."

reflection: "날 때부터 보지 못했던 사람은 예수님의 말씀을 듣고 실로암 못으로 가서 씻었습니다. 그에게는 예수님의 말씀을 따라 직접 길을 나서는 일이 필요했습니다. 실로암에 가기 전까지 그는 여전히 앞을 볼 수 없었지만, 말씀을 믿고 한 걸음씩 나아갔습니다. 우리에게도 주님의 말씀을 듣고 행동으로 옮겨야 할 자리가 있을 것입니다. 거창한 결심이 아니더라도, 지금 우리 앞에 놓인 작은 순종의 한 걸음이 무엇인지 생각해 보면 좋겠습니다."

questions:
  - "요즘 우리에게 예수님의 말씀을 따라 한 걸음 내딛어야 할 '실로암'은 어디일까요?"
  - "그 길을 가로막는 망설임이나 두려움이 있다면 무엇인가요?"

prayer: "하나님 아버지, 우리의 눈을 열어 주님의 말씀을 깨닫게 해주세요. 모든 것을 다 이해한 뒤에야 움직이려 하기보다, 주님께서 말씀하시는 방향을 신뢰하며 한 걸음씩 나아가게 하소서. 우리에게 필요한 순종이 무엇인지 분별하게 하시고, 작은 일에도 주님의 인도하심을 구하게 해주세요. 감자가 세상을 처음 마주할 날을 준비하는 우리 부부에게도 지혜와 사랑을 더해 주시고, 감자와 함께 주님을 바라보며 살아가는 가정이 되게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 28일 토요일 가정예배"
