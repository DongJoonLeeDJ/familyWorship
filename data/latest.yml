title: "선한 목자는 양들을 위하여"

subtitle: "나를 살리기 위해 자신을 내어 주신 예수님"

date: "2026-10-25"

calling: "하나님, 오늘도 우리를 위해 자신을 내어 주신 예수님의 사랑을 깊이 알아가게 해 주세요."

verse1_title: "한 사람이 백성을 위하여"

verse1: "한 사람이 백성을 위하여 죽어서 온 민족이 망하지 않게 되는 것이 너희에게 유익한 줄을 생각하지 아니하는도다 — 요한복음 11:50"

verse2_title: "선한 목자의 사랑"

verse2: "나는 선한 목자라 선한 목자는 양들을 위하여 목숨을 버리거니와 — 요한복음 10:11"

reflection: "요한복음 11장에서 가야바는 한 사람이 백성을 위해 죽는 것이 유익하다고 말합니다. 그는 자신의 계산으로 그 말을 했지만, 그 말은 결국 예수님께서 우리를 위해 죽으실 일을 가리키게 됩니다. 요한복음 10장에서 예수님은 선한 목자로서 양들을 위해 목숨을 버리신다고 직접 말씀하십니다. 사람들은 예수님의 죽음을 자신들의 유익과 필요에 따라 바라보았지만, 예수님은 우리를 살리기 위해 스스로 생명을 내어 주셨습니다. 이 사랑을 기억한다면 우리도 서로를 내 뜻대로 움직이려 하기보다, 상대방의 유익을 생각하고 기꺼이 사랑을 실천하는 쪽으로 한 걸음 나아갈 수 있겠습니다."

questions:

- "예수님께서 우리를 위해 자신을 내어 주셨다는 사실이 오늘 우리의 삶에 어떤 의미로 다가오나요?"
- "오늘 부부가 서로의 유익을 먼저 생각하며 실천할 수 있는 작은 사랑은 무엇일까요?"

prayer: "하나님 아버지, 우리를 살리시기 위해 목숨까지 내어 주신 예수님의 사랑에 감사드립니다. 예수님의 사랑을 당연하게 여기지 않게 하시고, 그 사랑을 날마다 기억하며 살아가게 해 주세요. 부부가 서로를 자신의 뜻대로 바꾸려 하기보다 상대방의 마음을 헤아리고, 작은 일에서도 기꺼이 사랑을 실천하게 해 주세요. 감자에게도 말로만 사랑을 가르치는 것이 아니라, 서로를 아끼는 삶으로 예수님의 사랑을 보여 주는 부모가 되게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 25일 일요일 가정예배"