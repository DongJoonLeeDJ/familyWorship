title: "내일도 주님의 손 안에"
subtitle: "염려보다 먼저 우리를 붙드시는 하나님을 신뢰합니다."
date: "2026-07-12"

calling: |
  사랑의 하나님,
  오늘도 우리 부부를 예배의 자리로 불러 주셔서 감사합니다.
  지난 한 주도 함께하셨던 주님께 감사드리며,
  오늘도 우리의 시선을 하나님께 향하게 하옵소서.
  예수님의 이름으로 기도합니다. 아멘.

verse1_title: "이사야 41:10"
verse1: |
  두려워하지 말라 내가 너와 함께함이라
  놀라지 말라 나는 네 하나님이 됨이라
  내가 너를 굳세게 하리라 참으로 너를 도와주리라
  참으로 나의 의로운 오른손으로 너를 붙들리라.
  (두려워하지 마십시오. 하나님께서 함께하시며,
  친히 붙들어 주십니다.)

verse2_title: "시편 121:7-8"
verse2: |
  여호와께서 너를 지켜 모든 환난을 면하게 하시며
  또 네 영혼을 지키시리로다.
  여호와께서 너의 출입을 지금부터 영원까지 지키시리로다.
  (하나님은 우리의 모든 걸음을 지켜 주시는 분이십니다.)

reflection: |
  내일을 앞두고 있으면 마음이 조금씩 앞서가지 않나요?

  아직 일어나지 않은 일인데도,
  결과를 먼저 상상하고,
  혹시나 하는 마음이 생기기도 합니다.

  우리도 내일 1차 기형아 검사를 앞두고 있습니다.
  기다림이 있었던 만큼,
  하나님께서 주신 감자가 얼마나 소중한 선물인지 알기에
  더욱 마음이 쓰이는 것이 자연스럽습니다.

  그런데 왜 하나님은 성경에서
  "두려워하지 말라."는 말씀을 자주 하실까요?

  혹시 두려움이 없어서가 아니라,
  두려움보다 더 크신 하나님을 바라보게 하시려는 것은 아닐까요?

  생각해 보면 우리 가정은 이미 여러 번 그 은혜를 경험했습니다.

  시험관 시술의 긴 기다림도 지나왔고,
  착상을 확인했던 기쁨도,
  출혈로 놀랐던 순간도,
  심장박동을 처음 들었던 감격도,
  하나님은 한 번도 우리를 홀로 두지 않으셨습니다.

  그리고 어제,
  드디어 감자가 임신 12주를 맞이했습니다.

  얼마나 감사한 일인지 모릅니다.
  이 평범해 보이는 숫자 하나에도
  수많은 기도와 하나님의 신실하심이 담겨 있습니다.

  그렇다면 내일도 다르지 않을 것입니다.

  하나님은 오늘까지만 함께하시고
  내일부터는 우리를 혼자 보내시는 분이 아니십니다.

  예수님께서는 십자가를 통해
  하나님이 우리를 끝까지 사랑하신다는 사실을 확증해 주셨습니다.
  그러므로 우리의 평안은 검사 결과가 아니라,
  우리와 함께하시는 예수님께 있습니다.

  내일 우리는 병원으로 걸어가겠지만,
  하나님께서는 이미 우리보다 먼저 그곳에 계십니다.

  그러니 오늘만큼은 결과를 미리 붙잡기보다,
  우리 손을 붙들고 계시는 하나님을 붙잡으면 좋겠습니다.
  감자를 지금까지 지켜 주신 하나님께서
  앞으로의 걸음도 가장 선한 길로 인도하실 것을 믿습니다.

questions:
  - "지난 몇 달을 돌아보며 하나님께서 가장 선명하게 함께하셨다고 느낀 순간은 언제였나요?"
  - "내일 검사를 앞두고 하나님께 맡기고 싶은 마음이나 기도 제목은 무엇인가요?"
  - "오늘 우리 가정이 결과보다 하나님의 함께하심을 신뢰하기 위해 서로 어떤 격려를 나눌 수 있을까요?"

prayer: |
  사랑의 하나님,
  오늘도 우리 가정을 변함없이 지켜 주셔서 감사합니다.
  긴 기다림 끝에 감자를 선물로 주시고,
  어느덧 임신 12주까지 인도해 주신 은혜를 찬양합니다.

  내일 있을 1차 기형아 검사도
  주님의 손에 온전히 맡겨 드립니다.
  병원을 오가는 모든 걸음을 지켜 주시고,
  의료진에게 지혜를 주시며,
  필요한 모든 과정을 평안 가운데 진행하게 하옵소서.

  사랑하는 아내에게 몸의 회복과 마음의 평안을 더하여 주시고,
  입덧과 피로 가운데서도 날마다 새 힘을 허락하여 주옵소서.
  하나님께서 가장 가까이에서 위로해 주시는 하루하루가 되게 하옵소서.

  사랑하는 감자를 오늘도 주님의 손으로 보호하여 주시고,
  건강하고 안전하게 자라게 하시며,
  태중에서부터 하나님을 사랑하는 믿음의 사람으로 빚어 주옵소서.

  우리 부부도 결과에 마음을 빼앗기기보다
  지금까지 인도하신 하나님을 기억하며,
  내일도 주님과 함께 걸어가게 하옵소서.

  우리를 끝까지 사랑하시고 붙드시는
  예수 그리스도의 이름으로 기도합니다.
  아멘.

footer: "2026년 7월 12일 주일 가정예배"
