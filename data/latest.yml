title: "맡겨진 일을 끝까지 이루다"

subtitle: "하나님께서 명하신 대로"

date: "2026-11-14"

calling: "우리에게 맡겨진 일을 돌아보며, 처음의 마음을 잃지 않고 신실하게 살아가기를 소망하며 예배합니다."

verse1_title: "모든 일을 마친 사람들"

verse1: "“모세가 그 필한 모든 것을 본즉 여호와께서 명하신 대로 되었으므로 모세가 그들에게 축복하였더라” (출애굽기 39:43)"

verse2_title: "마지막까지 신실하게"

verse2: "출애굽기 39장에서 성막과 제사장의 옷을 만드는 일이 마무리됩니다. 모세는 완성된 것을 살펴보았고, 모든 것이 하나님께서 명하신 대로 이루어진 것을 확인한 뒤 사람들을 축복했습니다. 처음 시작한 일은 마침내 완성되었고, 그 과정에 참여한 사람들의 수고도 열매를 맺었습니다."

reflection: "무언가를 시작하는 순간에는 기대와 의욕이 있지만, 시간이 지나면 처음의 마음을 잃거나 마무리를 미루기도 합니다. 그러나 맡겨진 일을 끝까지 감당하는 것도 중요한 믿음의 모습입니다. 성막을 만든 사람들은 각자의 자리에서 수고했고, 그 결과 하나님께서 명하신 일이 완성되었습니다. 우리도 가정과 일터에서 맡겨진 일을 성실하게 마무리하고, 서로의 수고를 알아보며 축복하는 부부가 되면 좋겠습니다."

questions:

- "요즘 시작해 놓고 마무리하지 못했거나 소홀히 하고 있는 일은 무엇인가요?"
- "서로의 수고를 알아보고 구체적으로 축복해 줄 수 있는 일은 무엇일까요?"

prayer: "하나님, 시작한 일을 끝까지 감당할 수 있는 성실함을 주세요. 눈에 띄지 않는 수고도 소중히 여기고, 서로가 감당한 일을 당연하게 여기지 않게 해주세요. 우리 부부가 맡겨진 가정의 책임을 함께 감당하며, 서로에게 감사와 축복을 전하게 해주세요. 감자와 함께 살아갈 날들도 사랑과 성실함으로 준비하게 해주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 11월 14일 토요일 가정예배"