title: "하나님께 나아가는 자리"

subtitle: "보이지 않는 곳까지 정성으로 준비하는 믿음"

date: "2026-10-30"

calling: "하나님, 우리의 일상과 마음을 주님께서 기뻐하시는 모습으로 가꾸어 가게 해 주세요."

verse1_title: "내가 그들 중에 거할 성소"

verse1: "내가 그들 중에 거할 성소를 그들이 나를 위하여 짓되 — 출애굽기 25:8"

verse2_title: "항상 켜 두는 등불"

verse2: "이스라엘 자손에게 명령하여 감람으로 짠 순수한 기름을 등불을 위하여 네게로 가져오게 하고 끊이지 않게 등불을 켜되 — 출애굽기 27:20"

reflection: "출애굽기 26장과 27장에는 성막의 휘장과 널판, 제단과 뜰의 구조, 등불을 위한 기름까지 세세하게 기록되어 있습니다. 하나님께 예배드리는 자리를 준비하는 일에는 눈에 잘 띄는 부분뿐 아니라 안쪽의 구조와 매일 필요한 작은 준비도 포함되었습니다. 신앙도 특별한 순간의 감동만으로 이어지는 것은 아닙니다. 눈에 띄지 않는 일상에서 말씀과 기도를 이어 가고, 서로에게 한 약속을 지키며, 맡은 일을 성실하게 감당하는 과정이 믿음의 자리를 만들어 갑니다. 우리 부부도 큰 결심만 하기보다 오늘의 작은 일들을 정성껏 감당하며 하나님을 향한 마음을 지켜 가면 좋겠습니다."

questions:
  - "겉으로 드러나지는 않지만 우리 신앙을 지탱해 주는 좋은 습관은 무엇인가요?"
  - "오늘 우리 가정의 믿음을 위해 꾸준히 돌보고 싶은 작은 일 한 가지는 무엇인가요?"

prayer: "하나님 아버지, 성막을 세세하게 준비하게 하신 말씀을 통해 주님께 나아가는 자리를 정성껏 가꾸는 일이 중요함을 생각합니다. 눈에 띄는 일에만 마음을 쓰지 않고, 아무도 알아주지 않는 작은 일에도 신실하게 하시며, 말씀과 기도를 꾸준히 이어 가게 해 주세요. 우리 부부가 서로를 돌보는 일과 일상의 책임도 가볍게 여기지 않게 하시고, 우리의 평범한 하루가 주님을 향한 믿음으로 채워지게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 30일 금요일 가정예배"
