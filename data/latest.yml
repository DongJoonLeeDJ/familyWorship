title: "작은 사람의 편에 서는 마음"

subtitle: "하나님께서 기뻐하시는 공의와 자비"

date: "2026-10-27"

calling: "하나님, 우리의 판단과 선택이 힘 있는 사람에게만 기울지 않고 주님의 공의와 사랑을 닮아가게 해 주세요."

verse1_title: "약한 사람을 외면하지 않기"

verse1: "가난한 자의 송사라고 해서 편벽되이 두둔하지 말지니라 — 출애굽기 23:3"

verse2_title: "원수의 어려움도 외면하지 않기"

verse2: "네가 만일 네 원수의 길 잃은 소나 나귀를 만나거든 반드시 그 사람에게로 돌릴지며 — 출애굽기 23:4"

reflection: "출애굽기 23장은 재판에서 거짓말하지 말고, 가난하다는 이유만으로 한쪽을 편들지도 말라고 가르칩니다. 동시에 원수의 가축이 길을 잃었을 때에도 돌려보내라고 합니다. 공의는 단순히 내 편을 지키는 것이 아니고, 사랑은 나에게 잘해 주는 사람에게만 친절한 것도 아닙니다. 마음이 내키지 않는 상대에게도 옳은 일을 하는 것은 쉽지 않지만, 하나님께서 기뻐하시는 길은 우리의 감정이나 이해관계보다 더 넓습니다. 오늘 우리 부부도 누가 내 편인지를 먼저 따지기보다, 무엇이 옳고 어떻게 사랑할 수 있을지를 한 번 더 생각하면 좋겠습니다."

questions:
  - "의견이 다르거나 마음이 불편한 사람을 대할 때, 사실과 옳고 그름을 차분히 살피기보다 감정에 따라 판단하는 순간은 없나요?"
  - "오늘 나와 가까운 사람뿐 아니라 조금 불편한 사람에게도 실천할 수 있는 공정함이나 친절은 무엇일까요?"

prayer: "하나님 아버지, 우리의 마음이 내 편과 남의 편을 가르는 데 머물지 않게 해 주세요. 사실을 정직하게 바라보고, 약한 사람을 함부로 대하지 않으며, 마음이 불편한 사람에게도 옳은 일을 선택할 수 있도록 도와주세요. 부부가 서로의 생각이 다를 때에도 감정만 앞세우지 않고 상대방의 말을 들으며 공정하고 따뜻하게 대하게 해 주세요. 우리의 작은 선택을 통해 주님의 공의와 자비가 드러나게 해 주세요. 우리 주 예수 그리스도의 이름으로 기도드립니다. 아멘."

footer: "2026년 10월 27일 화요일 가정예배"
