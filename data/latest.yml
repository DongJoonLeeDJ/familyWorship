title: "우리를 붙드시는 주님의 손"
subtitle: "두려움보다 크신 예수님의 손을 바라보며"
date: "2026-07-22"

calling: |
  오늘도 우리와 함께하신 하나님을 찬양합니다.
  우리의 마음을 분주하게 하는 걱정과 염려를 내려놓고,
  우리를 붙드시는 예수님을 바라보며 평안 가운데 예배드립니다.

verse1_title: "이사야 41:10"
verse1: |
  두려워하지 말라 내가 너와 함께 함이라
  놀라지 말라 나는 네 하나님이 됨이라
  내가 너를 굳세게 하리라 참으로 너를 도와 주리라
  참으로 나의 의로운 오른손으로 너를 붙들리라.

verse2_title: "마태복음 14:31"
verse2: |
  예수께서 즉시 손을 내밀어 그를 붙잡으시며 이르시되
  믿음이 작은 자여 왜 의심하였느냐 하시고

reflection: |
  함께 말씀을 읽으며 생각해 봅니다. 우리는 언제 가장 불안해질까요? 모든 것이 잘 풀리지 않을 때일까요, 아니면 앞날이 보이지 않을 때일까요?

  베드로는 예수님의 말씀을 따라 물 위를 걸었습니다. 하지만 바람을 바라보는 순간 두려움이 커졌고, 결국 물에 빠지기 시작했습니다. 예수님은 먼저 꾸짖기보다 즉시 손을 내밀어 베드로를 붙드셨습니다.

  이사야의 말씀도 같은 하나님의 마음을 보여 줍니다. 하나님은 "두려워하지 말라"라고만 말씀하지 않으셨습니다. "내가 너와 함께 한다", "내가 너를 붙든다"라고 약속하셨습니다. 두려움이 없는 삶을 약속하신 것이 아니라, 두려움 속에서도 함께하시는 하나님을 약속하신 것입니다.

  우리도 미래를 생각하면 여러 가지를 떠올리게 됩니다. 감자가 건강하게 자라기를 바라고, 남아 있는 검사들도 잘 지나가기를 소망합니다. 얼마 전 시행한 1차 기형아 검사에서는 투명대가 정상으로 확인되었고, 최종 결과는 아직 기다리는 중입니다. 기다림은 때때로 마음을 흔들지만, 하나님은 그 기다림 속에서도 우리를 놓지 않으십니다.

  예수님께서는 십자가에서 우리를 위해 자신의 생명을 내어주셨고, 부활하심으로 우리에게 흔들리지 않는 소망을 주셨습니다. 그러므로 우리의 믿음은 우리 손의 힘이 아니라 우리를 붙드시는 예수님의 손에 달려 있습니다. 우리가 약해질 때에도 주님의 손은 결코 약해지지 않습니다.

  오늘 하루도 하나님께서 우리와 함께하셨습니다. 내일도 우리의 손보다 크신 하나님의 손을 신뢰하며 평안히 걸어가면 됩니다.

questions:
  - "오늘 나는 어떤 일 때문에 마음이 흔들렸나요?"
  - "그 순간 예수님께서 나를 붙들고 계신다는 사실을 어떻게 기억할 수 있을까요?"
  - "우리 가정이 서로에게 하나님의 평안을 전해 줄 수 있는 말 한마디는 무엇일까요?"

prayer: |
  사랑의 하나님 아버지,
  오늘 하루도 우리를 붙드시고 인도하여 주셔서 감사합니다.
  눈에 보이는 상황보다 주님의 손을 더 신뢰하는 믿음을 허락하여 주옵소서.
  사랑하는 아내에게 건강과 새 힘을 더하여 주시고,
  몸과 마음을 평안으로 지켜 주옵소서.
  감자를 주님의 손으로 안전하게 보호하여 주시고,
  건강하게 자라게 하시며 앞으로 남아 있는 모든 검사와 출산의 과정도 은혜 가운데 인도하여 주옵소서.
  우리 부부가 날마다 주님과 더욱 친밀해지고,
  믿음 안에서 서로를 격려하며 사랑하는 가정이 되게 하옵소서.
  예수 그리스도의 이름으로 기도드립니다.
  아멘.

footer: "2026년 7월 22일 수요일 가정예배"
