
<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>가정예배</title>

<link rel="stylesheet" href="./assets/style.css">

<style>

.calendar {
    width:100%;
    border-collapse:collapse;
}
.calendar {

    table-layout:fixed;
}
.calendar th,
.calendar td {
    border:1px solid #ddd;
    text-align:center;
    padding:10px;
}

.nav-area {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:16px;
    margin:20px 0;
}

.nav-btn {
    background:#4f7cff;
    color:white;
    border:none;
    border-radius:10px;
    padding:10px 18px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    transition:0.2s;
}

.nav-btn:hover {
    transform:translateY(-1px);
    opacity:0.9;
}

.month-title {
    min-width:180px;
    text-align:center;
    font-size:1.3rem;
    font-weight:bold;
}

.year-buttons{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.year-btn{

    border:none;

    border-radius:999px;

    padding:8px 16px;

    cursor:pointer;

    background:#eceff4;

    font-weight:600;

    transition:0.2s;
}

.year-btn:hover{
    transform:translateY(-1px);
}

.year-btn.active{
    background:#4f7cff;
    color:white;
}

</style>

</head>

<body>

<div class="sheet">

<h1>가정예배</h1>

<p>
<a href="./latest.html">✨ 오늘의 예배</a>
</p>

<div id="yearButtons" class="year-buttons"></div>

<div id="monthButtons" class="month-buttons"></div>
<div class="nav-area">

<button id="prevBtn" class="nav-btn"
        onclick="prevMonth()">
    ◀ 이전달
</button>



<div id="monthTitle"
     class="month-title">
</div>

<button id="nextBtn" class="nav-btn"
        onclick="nextMonth()">
    다음달 ▶
</button>

</div>

<table class="calendar">

<thead>
<tr>
<th>일</th>
<th>월</th>
<th>화</th>
<th>수</th>
<th>목</th>
<th>금</th>
<th>토</th>
</tr>
</thead>

<tbody id="calendarBody">
</tbody>

</table>

</div>

<script>

const worships = {"2026-05-17": "./archive/2026-05-17.html", "2026-05-18": "./archive/2026-05-18.html", "2026-05-19": "./archive/2026-05-19.html", "2026-05-20": "./archive/2026-05-20.html", "2026-05-21": "./archive/2026-05-21.html", "2026-05-22": "./archive/2026-05-22.html", "2026-05-23": "./archive/2026-05-23.html", "2026-05-24": "./archive/2026-05-24.html", "2026-05-25": "./archive/2026-05-25.html", "2026-05-26": "./archive/2026-05-26.html", "2026-05-27": "./archive/2026-05-27.html", "2026-05-28": "./archive/2026-05-28.html", "2026-05-29": "./archive/2026-05-29.html", "2026-05-30": "./archive/2026-05-30.html", "2026-05-31": "./archive/2026-05-31.html", "2026-06-01": "./archive/2026-06-01.html", "2026-06-02": "./archive/2026-06-02.html", "2026-06-03": "./archive/2026-06-03.html", "2026-06-04": "./archive/2026-06-04.html", "2026-06-05": "./archive/2026-06-05.html", "2026-06-06": "./archive/2026-06-06.html", "2026-06-07": "./archive/2026-06-07.html", "2026-06-08": "./archive/2026-06-08.html", "2026-06-09": "./archive/2026-06-09.html", "2026-06-10": "./archive/2026-06-10.html", "2026-06-11": "./archive/2026-06-11.html", "2026-06-12": "./archive/2026-06-12.html", "2026-06-13": "./archive/2026-06-13.html"};

const years =
    Object.keys(worships)
    .map(x => x.substring(0,4));

const uniqueYears =
    [...new Set(years)].sort();

let currentYear = 2026;
let currentMonth = 6;

const dates = Object.keys(worships);

const latest = dates.sort().slice(-1)[0];

const first = dates[0];

const minYear =
    parseInt(first.substring(0,4));

const minMonth =
    parseInt(first.substring(5,7));

const maxYear =
    parseInt(latest.substring(0,4));

const maxMonth =
    parseInt(latest.substring(5,7));

currentYear = parseInt(latest.substring(0,4));
currentMonth = parseInt(latest.substring(5,7));

function renderCalendar() {

    const body = document.getElementById("calendarBody");
    const title = document.getElementById("monthTitle");

    body.innerHTML = "";

    title.textContent =
        currentYear + "년 " + currentMonth + "월";

    const firstDay =
        new Date(currentYear,currentMonth-1,1);

    const start =
        firstDay.getDay();

    const lastDate =
        new Date(currentYear,currentMonth,0).getDate();

    let row = document.createElement("tr");

    for(let i=0;i<start;i++) {
        row.appendChild(document.createElement("td"));
    }

    for(let day=1;day<=lastDate;day++) {

        const td =
            document.createElement("td");

        const key =
            currentYear + "-" +
            String(currentMonth).padStart(2,'0') + "-" +
            String(day).padStart(2,'0');

        if(worships[key]) {
        
            td.classList.add("has-worship");
        
            if(key === latest){
                td.classList.add("latest");
            }
        
            td.innerHTML =
                '<a href="' +
                worships[key] +
                '">' +
                day +
                '</a>';
        }
        else {
            td.textContent = day;
        }

        row.appendChild(td);

        if((start + day) % 7 === 0) {
            body.appendChild(row);
            row = document.createElement("tr");
        }
    }
    body.appendChild(row);
    updateNavButtons();
}

function prevMonth() {

    currentMonth--;

    if(currentMonth < 1) {
        currentMonth = 12;
        currentYear--;
    }

    buildYearButtons();
    buildMonthButtons();
    renderCalendar();
}

function nextMonth() {

    currentMonth++;

    if(currentMonth > 12) {
        currentMonth = 1;
        currentYear++;
    }

    buildYearButtons();
    buildMonthButtons();
    renderCalendar();
}

function updateNavButtons() {

    const prevBtn =
        document.getElementById("prevBtn");

    const nextBtn =
        document.getElementById("nextBtn");

    prevBtn.disabled =
        (currentYear === minYear &&
         currentMonth === minMonth);

    nextBtn.disabled =
        (currentYear === maxYear &&
         currentMonth === maxMonth);
}

function buildYearButtons(){

    const area =
        document.getElementById("yearButtons");

    area.innerHTML = "";

    uniqueYears.forEach(year=>{

        const btn =
            document.createElement("button");

        btn.className = "year-btn";

        if(parseInt(year) === currentYear){
            btn.classList.add("active");
        }

        btn.textContent = year;

        btn.onclick = ()=>{

            currentYear =
                parseInt(year);

            buildYearButtons();
            buildMonthButtons();
            renderCalendar();
        };

        area.appendChild(btn);
    });
}

function buildMonthButtons() {

    const area =
        document.getElementById("monthButtons");

    area.innerHTML = "";

    for(let m=1;m<=12;m++) {

        const btn =
            document.createElement("button");

        btn.className = "month-btn";

        if(m === currentMonth){
            btn.classList.add("active");
        }

        btn.textContent =
            String(m).padStart(2,'0');

        btn.onclick = ()=>{

            currentMonth = m;

            buildMonthButtons();

            renderCalendar();
        };

        area.appendChild(btn);
    }
}

buildYearButtons();
buildMonthButtons();
renderCalendar();

</script>

</body>

</html>
